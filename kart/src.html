<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>わんにゃんカート</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800;900&display=swap">
<style>
/* Full-screen 3D game: WebGL canvas, vignette, 2D HUD canvas, then HTML overlays for menus. */
:root {
  --ink: #1d1436;
  --panel: rgba(18, 12, 42, 0.88);
  --panel-line: rgba(255, 255, 255, 0.14);
  --gold: #ffd23f;
  --ok: #3ddc97;
  --pink: #ff4f9a;
  --text: #ffffff;
  --font: "M PLUS Rounded 1c", "Hiragino Maru Gothic ProN", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
  color-scheme: dark;
}
html, body {
  margin: 0; height: 100%; overflow: hidden; background: #0b0820; color: var(--text);
  font-family: var(--font); touch-action: none; user-select: none; -webkit-user-select: none;
  -webkit-tap-highlight-color: transparent;
}
#gl, #hud, #vig { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
#vig { pointer-events: none; z-index: 1; background: radial-gradient(ellipse at 50% 55%, rgba(0,0,0,0) 55%, rgba(10,0,30,.45) 100%); }
#hud { pointer-events: none; z-index: 2; }
.overlay {
  position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center;
  justify-content: safe center; padding: 16px; box-sizing: border-box; overflow-y: auto;
}
.dim { background: radial-gradient(ellipse at center, rgba(20,10,50,.45), rgba(5,3,15,.85)); }
.hidden { display: none !important; }
#loading { position: fixed; inset: 0; z-index: 30; display: flex; align-items: center; justify-content: center; background: #0b0820; font-weight: 800; font-size: 20px; }
.logo {
  font-size: clamp(44px, 10vw, 112px); font-weight: 900; font-style: italic; letter-spacing: .02em; margin: 0;
  background: linear-gradient(180deg, #fff7a8 0%, #ffd23f 35%, #ff8a1c 65%, #ff3d5f 100%);
  -webkit-background-clip: text; background-clip: text; color: transparent;
  filter: drop-shadow(0 6px 0 #1d1436) drop-shadow(0 0 24px rgba(255,140,60,.55));
  text-align: center; line-height: 1.05; transform: rotate(-3deg);
}
.logo small { display: block; font-size: .3em; letter-spacing: .3em; font-style: normal; margin-top: 6px; }
.sub { margin: 30px 0 24px; text-align: center; font-size: 16px; font-weight: 800; text-shadow: 0 2px 6px #000a; }
.btn {
  font-family: var(--font); font-weight: 900; font-size: 22px; color: var(--ink); background: var(--gold);
  border: none; border-radius: 999px; padding: 14px 46px; cursor: pointer; box-shadow: 0 6px 0 #b0780a, 0 10px 24px rgba(0,0,0,.4);
  transition: transform .08s;
}
.btn:hover { filter: brightness(1.06); }
.btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #b0780a; }
.btn:focus-visible, .card:focus-visible, .chip:focus-visible, .sw:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
.btn.sec { background: #ece8ff; box-shadow: 0 5px 0 #8c84c4; font-size: 16px; padding: 10px 26px; }
.btn.sec:active { box-shadow: 0 2px 0 #8c84c4; }
.pulse { animation: pulse 1.4s ease-in-out infinite; }
@keyframes pulse { 50% { transform: scale(1.06); } }
@media (prefers-reduced-motion: reduce) { .pulse { animation: none; } }
.row { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; margin-top: 14px; }
.howto { margin-top: 24px; font-size: 13px; line-height: 1.9; text-align: center; background: rgba(0,0,0,.45); padding: 10px 18px; border-radius: 14px; }
kbd { background: #fff2; border: 1px solid #fff4; border-radius: 4px; padding: 0 6px; font-family: inherit; }
h2 { margin: 0 0 8px; font-size: 15px; font-weight: 900; letter-spacing: .06em; opacity: .85; }

/* select: the 3D showroom renders behind; the panel sits right (landscape) or bottom (portrait) */
#scrSelect { align-items: flex-end; }
.selpanel { width: min(520px, 100%); max-height: 100%; overflow-y: auto; background: var(--panel); border: 1px solid var(--panel-line); border-radius: 20px; padding: 14px 16px; box-sizing: border-box; backdrop-filter: blur(6px); }
.selhead { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.selname { font-size: 30px; font-weight: 900; font-style: italic; margin: 0; }
.seltitle { font-size: 13px; font-weight: 800; color: var(--gold); }
.quote { margin: 6px 0 10px; font-size: 14px; font-weight: 800; background: #fff; color: var(--ink); border-radius: 14px; padding: 6px 12px; display: inline-block; position: relative; }
.quote::before { content: ""; position: absolute; left: 18px; top: -7px; border: 7px solid transparent; border-top: 0; border-bottom-color: #fff; }
@media (orientation: portrait) {
  #scrSelect { align-items: center; justify-content: flex-end; }
  .selpanel { max-height: 60%; }
}
.grid { display: grid; grid-template-columns: repeat(9, minmax(0, 1fr)); gap: 5px; }
.card {
  background: rgba(255,255,255,.06); border: 2px solid transparent; border-radius: 12px; padding: 5px 1px; text-align: center;
  cursor: pointer; transition: transform .1s, border-color .1s; font-family: var(--font); color: var(--text);
}
.card:hover { transform: translateY(-2px); }
.card.sel { border-color: var(--gold); background: rgba(255,210,63,.16); }
.card .emo { font-size: 24px; line-height: 1.15; }
.card .mini { font-size: 9px; font-weight: 800; opacity: .85; white-space: nowrap; overflow: hidden; }
.stats { margin: 10px 0 4px; font-size: 12px; }
.stat { display: flex; align-items: center; gap: 10px; margin: 3px 0; }
.stat span { width: 74px; flex: none; }
.bar { flex: 1; height: 8px; background: #fff2; border-radius: 5px; overflow: hidden; }
.bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--ok), var(--gold)); border-radius: 5px; }
.courses { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.course { padding: 7px 3px; }
.course .emo { font-size: 22px; }
.course .nm { font-weight: 800; font-size: 11px; line-height: 1.3; }
.course .best { font-size: 10px; color: var(--gold); margin-top: 3px; font-variant-numeric: tabular-nums; }
.course .best:empty { display: none; }
.sep { height: 1px; background: var(--panel-line); margin: 10px 0; }
#editor { margin-top: 10px; display: grid; gap: 6px; font-size: 12px; }
.erow { display: flex; align-items: center; gap: 8px; }
.erow > b { width: 62px; flex: none; font-weight: 800; }
.opts { display: flex; flex-wrap: wrap; gap: 4px; min-width: 0; }
.chip { font-family: var(--font); font-size: 12px; font-weight: 800; color: var(--text); background: rgba(255,255,255,.08); border: 2px solid transparent; border-radius: 999px; padding: 3px 9px; cursor: pointer; }
.chip.sel { border-color: var(--gold); background: rgba(255,210,63,.18); }
.sw { width: 22px; height: 22px; border-radius: 50%; border: 2px solid rgba(255,255,255,.3); cursor: pointer; padding: 0; }
.sw.sel { border-color: #fff; box-shadow: 0 0 0 2px var(--gold); }
#myName { font-family: var(--font); font-weight: 800; font-size: 14px; background: rgba(255,255,255,.1); color: #fff; border: 1px solid var(--panel-line); border-radius: 8px; padding: 4px 8px; width: 140px; }
@media (max-height: 520px) {
  .selpanel { width: min(470px, 100%); padding: 10px 12px; }
  .selname { font-size: 20px; }
  .quote, .seltitle { display: none; }
  .card .emo { font-size: 18px; }
  .card .mini { display: none; }
  .stats { margin: 6px 0 2px; font-size: 11px; }
  .stat { margin: 0; }
  .sep, .selpanel h2 { display: none; }
  .courses { margin-top: 8px; }
  .course { padding: 4px 2px; }
  .course .emo { display: none; }
  .row { margin-top: 8px; }
  .btn { font-size: 17px; padding: 9px 30px; }
  .btn.sec { font-size: 14px; padding: 8px 18px; }
  #scrSelect { padding-block: 8px; }
  #editor { gap: 3px; }
}

#scrResult { align-items: flex-end; justify-content: flex-end; }
.respanel { width: min(440px, 100%); background: var(--panel); border: 1px solid var(--panel-line); border-radius: 20px; padding: 12px 14px; box-sizing: border-box; max-height: 100%; overflow-y: auto; }
table.res { border-collapse: collapse; width: 100%; }
table.res td { padding: 4px 10px; font-size: 15px; }
table.res tr:nth-child(odd) { background: #ffffff0d; }
table.res tr.me { background: rgba(255,210,63,.28); font-weight: 900; }
table.res td.rk { font-weight: 900; text-align: right; font-style: italic; width: 2em; }
table.res td.tm { font-variant-numeric: tabular-nums; text-align: right; opacity: .9; }
.bigrank { font-size: clamp(40px, 8vw, 72px); font-weight: 900; font-style: italic; margin: 0; color: var(--gold); text-shadow: 0 5px 0 #1d1436, 0 0 30px rgba(255,200,60,.5); text-align: center; }
@media (orientation: portrait) { #scrResult { align-items: center; } .respanel { max-height: 55%; } }

#touch { position: fixed; inset: 0; z-index: 5; pointer-events: none; }
#touch .tb {
  position: absolute; pointer-events: auto; border-radius: 50%; background: rgba(255,255,255,.16);
  border: 2px solid rgba(255,255,255,.5); color: #fff; font-family: var(--font); font-weight: 900; white-space: nowrap;
  display: flex; align-items: center; justify-content: center; font-size: 24px; touch-action: none;
}
#touch .tb.on { background: rgba(255,255,255,.45); }
#touch #tl { left: 18px; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); width: 80px; height: 80px; }
#touch #tr { left: 112px; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); width: 80px; height: 80px; }
#touch #tdrift { right: 112px; bottom: calc(22px + env(safe-area-inset-bottom, 0px)); width: 78px; height: 78px; font-size: 12px; }
#touch #tbrake { right: 20px; bottom: calc(22px + env(safe-area-inset-bottom, 0px)); width: 78px; height: 78px; font-size: 12px; }
#touch #titem { right: 64px; bottom: calc(114px + env(safe-area-inset-bottom, 0px)); width: 72px; height: 72px; font-size: 30px; }
#topbtns { position: fixed; top: calc(10px + env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%); z-index: 6; display: flex; gap: 8px; }
#topbtns button { font-family: var(--font); background: rgba(0,0,0,.35); color: #fff; border: 1px solid #fff5; border-radius: 999px; padding: 4px 12px; font-size: 13px; cursor: pointer; }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="vig"></div>
<canvas id="hud"></canvas>
<div id="loading">よみこみ中…</div>

<div id="topbtns" class="hidden">
  <button id="btnPause" type="button">⏸ ポーズ</button>
  <button id="btnMute" type="button">🔊</button>
</div>

<div id="touch" class="hidden">
  <div class="tb" id="tl">◀</div>
  <div class="tb" id="tr">▶</div>
  <div class="tb" id="titem">🎁</div>
  <div class="tb" id="tdrift">ドリフト<br>ジャンプ</div>
  <div class="tb" id="tbrake">ブレーキ</div>
</div>

<div id="scrTitle" class="overlay hidden">
  <h1 class="logo">わんにゃん<br>カート<small>WANNYAN GRAND PRIX</small></h1>
  <p class="sub">オリジナルキャラたちの 3D カートレース！ ドリフト・ジャンプ・アイテムで 1位をねらえ</p>
  <button class="btn pulse" id="btnStart" type="button">あそぶ</button>
  <div class="howto">
    <kbd>↑</kbd>/<kbd>W</kbd> アクセル　<kbd>↓</kbd>/<kbd>S</kbd> ブレーキ　<kbd>←</kbd><kbd>→</kbd> ハンドル<br>
    <kbd>Space</kbd>/<kbd>Shift</kbd> ドリフト（長押し → 火花の色でターボ）・ジャンプ台で押すとトリック<br>
    <kbd>X</kbd>/<kbd>Z</kbd>/<kbd>Enter</kbd> アイテム　<kbd>Esc</kbd>/<kbd>P</kbd> ポーズ　｜ スマホは自動アクセル
  </div>
  <div style="margin-top:10px;font-size:11px;opacity:.7">3Dモデル: Kenney (kenney.nl, CC0)</div>
</div>

<div id="scrSelect" class="overlay hidden">
  <div class="selpanel">
    <div class="selhead"><div class="selname" id="selName"></div><div class="seltitle" id="selTitle"></div></div>
    <div class="quote" id="selQuote"></div>
    <div class="grid" id="charGrid"></div>
    <div id="editor" class="hidden"></div>
    <div class="stats" id="charStats"></div>
    <div class="sep"></div>
    <h2>コース</h2>
    <div class="courses" id="courseGrid"></div>
    <div class="row">
      <button class="btn sec" id="btnBack" type="button">もどる</button>
      <button class="btn" id="btnGo" type="button">スタート！</button>
    </div>
  </div>
</div>

<div id="scrPause" class="overlay dim hidden">
  <h2 style="font-size:26px;opacity:1">ポーズ中</h2>
  <div class="row">
    <button class="btn" id="btnResume" type="button">つづける</button>
    <button class="btn sec" id="btnRetry2" type="button">やりなおす</button>
    <button class="btn sec" id="btnQuit" type="button">メニューへ</button>
  </div>
</div>

<div id="scrResult" class="overlay hidden">
  <div class="respanel">
    <div class="bigrank" id="resRank"></div>
    <div id="resBest" style="text-align:center;margin:2px 0 8px;color:var(--gold);font-weight:900"></div>
    <table class="res" id="resTable"></table>
    <div class="row">
      <button class="btn" id="btnRetry" type="button">もういちど</button>
      <button class="btn sec" id="btnMenu" type="button">メニューへ</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

  play(i) {
    if (!Sound.ac) return;

    this.timer = setInterval(() => this.tick(), 25);
  },
  stop() { if (this.timer) clearInterval(this.timer); this.timer = null; },

const TRUCKS = { 'vehicle-truck-red': '#e63946', 'vehicle-truck-yellow': '#ffd23f', 'vehicle-truck-green': '#3ddc97', 'vehicle-truck-purple': '#9b7bff' };
function truckFor(color) {
  const c = new THREE.Color(color), hsl = {}; c.getHSL(hsl);
  let best = 'vehicle-truck-red', bd = 1e9;
  for (const [name, col] of Object.entries(TRUCKS)) {
    const h2 = {}; new THREE.Color(col).getHSL(h2);
    let d = Math.abs(hsl.h - h2.h); d = Math.min(d, 1 - d);
    if (hsl.s < 0.2) d = name.endsWith('purple') ? 0 : 1;
    if (d < bd) { bd = d; best = name; }
  }
  return best;
}
function buildKart(c) {

let course = null, courseGroup = null;
// 3D models: Kenney "Starter Kit Racing" and "Starter Kit 3D Platformer" (CC0, kenney.nl)
const ASSETS = /*__ASSETS__*/{};
const MODELS = {}, SHARED = new Set();
function loadAssets() {
  const b64 = s => { const bin = atob(s), u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return u.buffer; };
  return Promise.all(Object.entries(ASSETS.models).map(([name, data]) => new Promise((res, rej) => {
    const mgr = new THREE.LoadingManager();
    mgr.setURLModifier(u => u.includes('colormap') ? 'data:image/png;base64,' + ASSETS.textures[ASSETS.texOf[name]] : u);
    new THREE.GLTFLoader(mgr).parse(b64(data), '', g => {
      const root = g.scene;
      root.traverse(o => {
        if (o.geometry) SHARED.add(o.geometry);
        if (o.material) { o.material.side = THREE.FrontSide; if (o.material.map) { o.material.map.encoding = THREE.LinearEncoding; o.material.map.anisotropy = MAX_ANISO; SHARED.add(o.material.map); } SHARED.add(o.material); root.userData.mat = o.material; }
      });
      MODELS[name] = root; res();
    }, rej);
  })));
}
function disposeGroup(g) {
  const shared = new Set(Object.values(matCache));
  for (const r of SHARED) shared.add(r);
  g.traverse(o => {
    if (o.geometry && !Object.values(GEO).includes(o.geometry) && !SHARED.has(o.geometry)) o.geometry.dispose();
    if (o.material) for (const m of (Array.isArray(o.material) ? o.material : [o.material])) {
      if (shared.has(m) || m === partMat || m === outlineMat) continue;
      if (m.map && m.map !== boxTex && m.map !== sparkTex && !SHARED.has(m.map)) m.map.dispose();
      m.dispose();
    }
  });
}

// ---- Kenney tile-based course (CC0 models by Kenney, kenney.nl) ----
const TILE = 160;            // world size of one track tile
const KS = TILE / 10;        // Kenney tile models are 10 units wide
const DIRS = [[0, -1], [1, 0], [0, 1], [-1, 0]];  // N E S W

// Expand a list of corner cells (a rectilinear loop) into tiles.
function layoutTiles(V) {
  const sg = v => (v > 0) - (v < 0);
  const n = V.length, dirs = [];
  for (let i = 0; i < n; i++) {
    const a = V[i], b = V[(i + 1) % n];
    dirs.push(DIRS.findIndex(d => d[0] === sg(b[0] - a[0]) && d[1] === sg(b[1] - a[1])));
  }
  const tiles = [];
  for (let i = 0; i < n; i++) {
    const a = V[i], b = V[(i + 1) % n], len = Math.abs(b[0] - a[0]) + Math.abs(b[1] - a[1]), h = dirs[i];
    for (let k = 1; k < len; k++) tiles.push({ x: a[0] + DIRS[h][0] * k, y: a[1] + DIRS[h][1] * k, hin: h, hout: h, type: 'F' });
    const hout = dirs[(i + 1) % n];
    tiles.push({ x: b[0], y: b[1], hin: h, hout, type: (h + 1) % 4 === hout ? 'R' : 'L' });
  }
  return tiles;   // tiles[0] is the first straight after V[0]: the finish tile
}

function cloneModel(name) {
  const m = MODELS[name].clone(true);
  m.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
  return m;
}

function buildCourse(ci) {

  const group = new THREE.Group(); courseGroup = group; scene.add(group);
  const tiles = layoutTiles(def.loop);

  // ---------- centerline from tiles ----------
  const raw = [];
  for (const t of tiles) {
    const cx = t.x * TILE, cy = t.y * TILE, din = DIRS[t.hin], dout = DIRS[t.hout];
    const ex = cx - din[0] * TILE / 2, ey = cy - din[1] * TILE / 2;
    if (t.type === 'F') {
      for (let s = 0; s < 40; s++) raw.push({ x: ex + din[0] * TILE * s / 40, y: ey + din[1] * TILE * s / 40 });
    } else {
      const ax = ex + dout[0] * TILE / 2, ay = ey + dout[1] * TILE / 2, r = TILE / 2;
      const a0 = Math.atan2(ey - ay, ex - ax);
      const xx = cx + dout[0] * TILE / 2, yy = cy + dout[1] * TILE / 2;

  let prev = rot[0], need = SP;
  for (let i = 1; i <= rot.length; i++) {
    const cur = rot[i % rot.length];
    let px = prev.x, py = prev.y, seg = Math.hypot(cur.x - px, cur.y - py);
    while (seg >= need) { const t = need / seg; px += (cur.x - px) * t; py += (cur.y - py) * t; pts.push({ x: px, y: py }); seg -= need; need = SP; }

  const M = 2, start = tiles[0];

    const r = (Math.sin(x * 12.9898 + y * 78.233 + ci * 3.1) * 43758.5453) % 1;
    const rr = Math.abs(r);
    const name = nearStart && rr < 0.6 ? 'decoration-tents' : rr < th.forest ? 'decoration-forest' : 'decoration-empty';
    const m = cloneModel(name);
    m.scale.setScalar(KS); m.position.set(x * TILE, 0, y * TILE); m.rotation.y = Math.floor(rr * 97) % 4 * Math.PI / 2;

  }

    ground.rotation.x = -Math.PI / 2; ground.position.set(cx, -0.5, cy); ground.receiveShadow = true; group.add(ground);
  }
  // distant hills + clouds
  {
    const mm = new THREE.MeshLambertMaterial({ color: th.hill, flatShading: true, fog: true });
    for (let i = 0; i < 30; i++) {
      const a = i / 30 * TAU + rand(-0.05, 0.05), r = rand(2900, 3500), hh = rand(260, 620), rr = rand(400, 700);
      const h = new THREE.Mesh(new THREE.SphereGeometry(1, 10, 6, 0, TAU, 0, Math.PI / 2), mm);
      h.scale.set(rr, hh, rr); h.position.set(cx + Math.cos(a) * r, -10, cy + Math.sin(a) * r); group.add(h);
    }
    if (!night) for (let i = 0; i < 22; i++) {
      const c = cloneModel('cloud'); c.traverse(o => { if (o.isMesh) { o.castShadow = false; o.receiveShadow = false; } });
      const a = rand(0, TAU), r = rand(400, 2600), s = rand(60, 120);
      c.scale.set(s * 1.6, s * 0.7, s); c.position.set(cx + Math.cos(a) * r, rand(650, 950), cy + Math.sin(a) * r); c.rotation.y = rand(0, TAU); group.add(c);

    const g = new THREE.ExtrudeGeometry(prof, { depth: w, bevelEnabled: false }); g.translate(0, 0, -w / 2);
    const rtex = canvasTex(64, 64, (gg, ww, hh) => { gg.fillStyle = '#f2f2f2'; gg.fillRect(0, 0, ww, hh); gg.fillStyle = '#ef5a4c'; gg.fillRect(0, 0, ww, hh / 2); });

    const slope = Math.atan2(hmax, len * SP);

    const mid = lp((i0 + 3) % n, lat);
    dec.position.set(mid[0], hgt[i0] + hmax * 0.5 + 0.3, mid[1]);

    for (let y = 0; y < h; y += 32) { g.beginPath(); g.moveTo(8, y + 28); g.lineTo(32, y + 6); g.lineTo(56, y + 28); g.lineTo(48, y + 32); g.lineTo(32, y + 16); g.lineTo(16, y + 32); g.closePath(); g.fill(); }

function nearestIdx(x, y, from) {
  const { pts, n } = course;
  let best = from, bd = 1e18;
  for (let o = -25; o <= 25; o++) { const i = (from + o + n) % n, p = pts[i], d = (p.x - x) ** 2 + (p.y - y) ** 2; if (d < bd) { bd = d; best = i; } }
  return best;
}
function latOf(x, y, i) { const p = course.pts[i], a = course.ang[i]; return (x - p.x) * -Math.sin(a) + (y - p.y) * Math.cos(a); }
function alongOf(x, y, i) { const p = course.pts[i], a = course.ang[i]; return ((x - p.x) * Math.cos(a) + (y - p.y) * Math.sin(a)) / SP; }
function rampAt(i, t, lat) {
  for (const r of course.ramps) {
    const d = ((i - r.i0 + course.n) % course.n) + t;
    if (d >= 0 && d <= r.len && Math.abs(lat - r.lat) < r.w / 2) return r.hmax * d / r.len;
  }
  return 0;
}
function trackH(x, y, i) {
  const { hgt, n } = course, t = alongOf(x, y, i);
  const j = t >= 0 ? (i + 1) % n : (i - 1 + n) % n;
  return lerp(hgt[i], hgt[j], Math.min(1, Math.abs(t)));
}

function setupRace(ci, playerChar, demo = false) {

  for (let s = 0, o = 0; s < 8; s++) {
    if (s === 6) karts.push(player = makeKart(playerChar, !demo, s));
    else karts.push(makeKart(pool[o++], false, s));

  podConfetti.instanceMatrix.needsUpdate = true;
  const a = Math.sin(clock * 0.3) * 0.45;
  podCam.position.set(Math.sin(a) * 95, 32, Math.cos(a) * 95); podCam.lookAt(0, 16, 0);
}

// ============================================================
//  HUD
// ============================================================
let hudFont = 'sans-serif';
const INK = [[0.3, 0.45, 0.13], [0.62, 0.35, 0.1], [0.5, 0.62, 0.16], [0.78, 0.6, 0.09]];
function drawLights(c, u, Wd, lit, green) {
  const lw = 150 * u, lh = 46 * u, lx = Wd / 2 - lw / 2, ly = 52 * u;
  c.fillStyle = '#1d1436'; c.beginPath(); c.roundRect ? c.roundRect(lx, ly, lw, lh, 12 * u) : c.rect(lx, ly, lw, lh); c.fill();
  for (let i = 0; i < 3; i++) { c.beginPath(); c.arc(lx + lw * (i + 0.5) / 3, ly + lh / 2, 15 * u, 0, TAU); c.fillStyle = green ? '#3ddc97' : i < lit ? '#ff3b3b' : '#3d3355'; c.fill(); }
}
function drawHUD() {
  const c = hctx, Wd = hud.width, Hd = hud.height;
  c.clearRect(0, 0, Wd, Hd);
  if (flashT > 0) { c.fillStyle = `rgba(255,255,230,${clamp(flashT / 0.35, 0, 1) * 0.8})`; c.fillRect(0, 0, Wd, Hd); }
  if (player && player.inkT > 0 && (state === 'race' || state === 'done')) {
    const a = clamp(player.inkT / 1.2, 0, 1) * 0.92;
    c.fillStyle = `rgba(20,10,40,${a})`;
    for (const [px, py, r] of INK) { c.beginPath(); c.arc(px * Wd, py * Hd, r * Math.min(Wd, Hd), 0, TAU); c.fill(); for (let k2 = 0; k2 < 6; k2++) { const an = k2 * 1.1 + px * 9; c.beginPath(); c.arc(px * Wd + Math.cos(an) * r * Math.min(Wd, Hd) * 1.25, py * Hd + Math.sin(an) * r * Math.min(Wd, Hd) * 1.25, r * Math.min(Wd, Hd) * 0.32, 0, TAU); c.fill(); } }
  }
  if (!course || !player || state === 'title' || state === 'select' || state === 'loading' || state === 'result') return;
  const u = Math.min(Wd, Hd) / 400, pad = 14 * u;
  const txt = (text, x, y, size, color, align = 'left', weight = 900, italic = true) => {
    c.font = `${italic ? 'italic ' : ''}${weight} ${Math.round(size)}px ${hudFont}`; c.textAlign = align; c.textBaseline = 'middle';
    c.lineJoin = 'round'; c.lineWidth = size * 0.2; c.strokeStyle = '#1d1436'; c.strokeText(text, x, y);
    c.fillStyle = color; c.fillText(text, x, y);
  };
  if (player.boostT > 0) {
    c.strokeStyle = 'rgba(255,255,255,.55)'; c.lineWidth = 2 * u;
    for (let i = 0; i < 26; i++) {
      const a = rand(0, TAU), r0 = rand(0.35, 0.5) * Math.max(Wd, Hd), r1 = r0 + rand(40, 120) * u;
      c.beginPath(); c.moveTo(Wd / 2 + Math.cos(a) * r0, Hd * 0.55 + Math.sin(a) * r0); c.lineTo(Wd / 2 + Math.cos(a) * r1, Hd * 0.55 + Math.sin(a) * r1); c.stroke();
    }
  }
  // item slot
  const bs = 54 * u, bx = pad + bs / 2, by = pad + bs / 2 + 4 * u;
  c.beginPath(); c.arc(bx, by, bs / 2, 0, TAU);
  const gr = c.createRadialGradient(bx, by - bs * 0.2, bs * 0.1, bx, by, bs / 2);
  gr.addColorStop(0, 'rgba(90,70,160,.85)'); gr.addColorStop(1, 'rgba(25,15,60,.85)'); c.fillStyle = gr; c.fill();
  c.lineWidth = 4 * u; c.strokeStyle = '#ffd23f'; c.stroke();
  let em = null;
  if (player.rollT > 0) em = ITEMS[ITEM_KEYS[Math.floor(clock * 14) % ITEM_KEYS.length]].emoji;
  else if (player.item) em = ITEMS[player.item].emoji;
  if (em) { c.font = `${Math.round(bs * 0.58)}px ${EMOJI_FONT}`; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(em, bx, by + 2 * u); }
  if (player.item === 'triple' && player.rollT <= 0) txt(`×${player.itemCount}`, bx + bs * 0.32, by + bs * 0.36, 14 * u, '#ffffff', 'center');
  if (player.item === 'golden' && player.goldT > 0) { c.beginPath(); c.arc(bx, by, bs / 2 + 4 * u, -Math.PI / 2, -Math.PI / 2 + TAU * player.goldT / 7); c.strokeStyle = '#ffe14d'; c.lineWidth = 4 * u; c.stroke(); }
  if (player.rollT <= 0 && player.item) txt(ITEMS[player.item].name, bx, by + bs / 2 + 12 * u, 11 * u, '#ffffff', 'center', 800, false);
  // coins
  const cxp = pad + bs + 18 * u, cyp = by;
  c.beginPath(); c.arc(cxp, cyp, 10 * u, 0, TAU); c.fillStyle = '#ffcc22'; c.fill(); c.lineWidth = 2.5 * u; c.strokeStyle = '#1d1436'; c.stroke();
  c.fillStyle = '#fff3a0'; c.fillRect(cxp - 1.5 * u, cyp - 5 * u, 3 * u, 10 * u);
  txt(`×${player.coins}`, cxp + 14 * u, cyp + 1 * u, 18 * u, player.coins >= 10 ? '#ffd23f' : '#ffffff');
  // lap & time
  const lap = clamp(Math.floor(player.total / course.L) + 1, 1, LAPS);
  txt('LAP', Wd - pad - 64 * u, pad + 16 * u, 14 * u, '#ffffff', 'right');
  txt(`${lap}/${LAPS}`, Wd - pad, pad + 14 * u, 28 * u, '#ffffff', 'right');
  txt(fmtTime(player.finished ? player.finishTime : raceTime), Wd - pad, pad + 40 * u, 16 * u, '#ffd23f', 'right', 800, false);
  // rank & speed
  const rk = player.rank + 1;
  const rankY = isTouch ? Hd - 140 * DPR : Hd - pad - 30 * u;
  const rcol = rk === 1 ? '#ffd23f' : rk === 2 ? '#e3e8f0' : rk === 3 ? '#ffae6b' : '#b9b3ff';
  txt(`${rk}`, pad, rankY, 70 * u, rcol);
  c.font = `italic 900 ${Math.round(70 * u)}px ${hudFont}`;
  txt('位', pad + c.measureText(`${rk}`).width + 6 * u, rankY + 12 * u, 26 * u, '#ffffff');
  const kmh = `${Math.round(Math.abs(player.speed) * 0.55)}`;
  txt(kmh, pad, rankY - 52 * u, 20 * u, '#ffffff');
  c.font = `italic 900 ${Math.round(20 * u)}px ${hudFont}`;
  txt('km/h', pad + c.measureText(kmh).width + 6 * u, rankY - 50 * u, 11 * u, '#ffffff', 'left', 800);
  if (player.drifting) {
    const tier = driftTier(player.driftCharge), col = tier >= 0 ? TIERS[tier].c : '#ffffff';
    const gw = 120 * u, gx = Wd / 2 - gw / 2, gy = Hd - (isTouch ? 40 : 30) * u;
    c.fillStyle = 'rgba(0,0,0,.45)'; c.fillRect(gx, gy, gw, 8 * u);
    c.fillStyle = col; c.fillRect(gx, gy, gw * clamp(player.driftCharge / 2.3, 0, 1), 8 * u);
    txt('DRIFT', Wd / 2, gy - 12 * u, 14 * u, col, 'center');
  }
  drawMinimap(c, u, pad, Wd);
  if (player.wrongT > 1 && Math.floor(clock * 3) % 2 === 0) txt('ぎゃくそう！', Wd / 2, Hd * 0.3, 32 * u, '#ff5d73', 'center');
  const cdState = state === 'countdown' || (state === 'paused' && pausedFrom === 'countdown');
  if (cdState && countdown < 3.6) {
    drawLights(c, u, Wd, countdown > 3 ? 0 : countdown > 2 ? 1 : countdown > 1 ? 2 : 3, false);
    const nn = Math.ceil(countdown);
    if (nn <= 3 && nn >= 1) { const f = countdown - Math.floor(countdown); txt(`${nn}`, Wd / 2, Hd * 0.4, (80 + f * 50) * u, ['', '#3ddc97', '#ffd23f', '#ff5d73'][nn], 'center'); }
  }
  if (cdState && countdown >= 3.6) txt(course.def.name, Wd / 2, Hd * 0.2, 34 * u, '#ffffff', 'center');
  if (state === 'race' && raceTime < 0.8) drawLights(c, u, Wd, 3, true);
  let my = Hd * 0.27;
  for (const m of messages) {
    const a = clamp(m.t / 0.3, 0, 1), grow = 1 + Math.max(0, (m.t - m.max + 0.2)) * 2;
    c.globalAlpha = a; txt(m.text, Wd / 2, my, 40 * u * grow, m.color, 'center'); c.globalAlpha = 1;
    my += 52 * u;
  }
}
function drawMinimap(c, u, pad, Wd) {
  const { bounds, pts } = course;
  const size = 100 * u, sc = size / Math.max(bounds.maxX - bounds.minX, bounds.maxY - bounds.minY);
  const ox = Wd - pad - size, oy = pad + 62 * u;
  const tx = x => ox + (x - bounds.minX) * sc, ty = y => oy + (y - bounds.minY) * sc;
  c.lineJoin = 'round';
  c.beginPath(); for (let i = 0; i < pts.length; i += 3) { const p = pts[i]; i ? c.lineTo(tx(p.x), ty(p.y)) : c.moveTo(tx(p.x), ty(p.y)); } c.closePath();
  c.strokeStyle = 'rgba(20,10,50,.6)'; c.lineWidth = 8 * u; c.stroke();
  c.strokeStyle = 'rgba(255,255,255,.9)'; c.lineWidth = 4 * u; c.stroke();
  for (const k of [...karts].sort((a, b) => a.isPlayer - b.isPlayer)) {
    c.fillStyle = k.ch.kart; c.strokeStyle = k.isPlayer ? '#fff' : '#1d1436'; c.lineWidth = (k.isPlayer ? 2.5 : 1.2) * u;
    c.beginPath(); c.arc(tx(k.x), ty(k.y), (k.isPlayer ? 5 : 3.4) * u, 0, TAU); c.fill(); c.stroke();
  }
}

// ============================================================
//  menus
// ============================================================
const screens = ['scrTitle', 'scrSelect', 'scrPause', 'scrResult'];
function showScreen(id) { for (const s of screens) document.getElementById(s).classList.toggle('hidden', s !== id); }
function setShowKart() {
  if (showKart) { turntable.remove(showKart); disposeGroup(showKart); }
  showKart = buildKart(charAt(selChar)); showKart.rotation.y = 0.6; turntable.add(showKart);
  showCam.position.set(0, 20, 56); showCam.lookAt(0, 7, 0);
}
function speciesEmoji(sp) { return (SPECIES_LIST.find(s => s.id === sp) || SPECIES_LIST[0]).emoji; }
function buildSelect() {
  const c = charAt(selChar);
  document.getElementById('selName').textContent = c.name;
  document.getElementById('selTitle').textContent = `${c.title}・${FRAMES[c.frame].name}`;
  document.getElementById('selQuote').textContent = c.quote;
  const cg = document.getElementById('charGrid'); cg.innerHTML = '';
  [...CHARS, myChar].forEach((ch, i) => {
    const d = document.createElement('button'); d.type = 'button'; d.className = 'card' + (i === selChar ? ' sel' : '');
    d.setAttribute('aria-label', ch.name);
    d.innerHTML = `<div class="emo">${i === CHARS.length ? '✏️' : speciesEmoji(ch.sp)}</div><div class="mini">${i === CHARS.length ? 'つくる' : ch.name}</div>`;
    d.onclick = () => { selChar = i; Sound.init(); Sound.beep(700 + i * 60, 0.08, 'triangle', 0.1); buildSelect(); setShowKart(); };
    cg.appendChild(d);
  });
  buildEditor();
  const s = statsOf(c);
  const bar = (label, v) => `<div class="stat"><span>${label}</span><div class="bar"><i style="width:${Math.round(clamp(v, 0.08, 1) * 100)}%"></i></div></div>`;
  document.getElementById('charStats').innerHTML = bar('スピード', (s.max - 215) / 36) + bar('かそく', (s.acc - 0.6) / 0.55) + bar('ハンドル', (s.hand - 2.4) / 0.9) + bar('おもさ', s.weight / 1.6);
  const og = document.getElementById('courseGrid'); og.innerHTML = '';
  COURSES.forEach((co, i) => {
    const best = store.get('best' + i);
    const d = document.createElement('button'); d.type = 'button'; d.className = 'card course' + (i === selCourse ? ' sel' : '');
    d.innerHTML = `<div class="emo">${co.emoji}</div><div class="nm">${co.name}</div><div class="best">${best ? 'ベスト ' + fmtTime(best) : ''}</div>`;
    d.onclick = () => { selCourse = i; Sound.init(); Sound.beep(500 + i * 120, 0.08, 'triangle', 0.1); buildSelect(); };
    og.appendChild(d);
  });
}
function buildEditor() {
  const ed = document.getElementById('editor');
  ed.classList.toggle('hidden', selChar !== CHARS.length);
  if (selChar !== CHARS.length) return;
  const c = myChar;
  const save = () => { store.set('mychar', myChar); buildSelect(); setShowKart(); };
  ed.innerHTML = '';
  const row = (label) => { const r = document.createElement('div'); r.className = 'erow'; r.innerHTML = `<b>${label}</b>`; const o = document.createElement('div'); o.className = 'opts'; r.appendChild(o); ed.appendChild(r); return o; };
  const chips = (label, entries, key, after) => {
    const o = row(label);
    for (const [val, text] of entries) {
      const b = document.createElement('button'); b.type = 'button'; b.className = 'chip' + (c[key] === val ? ' sel' : ''); b.textContent = text;
      b.onclick = () => { c[key] = val; if (after) after(val); save(); }; o.appendChild(b);
    }
  };
  const swatches = (label, cols, key, after) => {
    const o = row(label);
    for (const col of cols) {
      const b = document.createElement('button'); b.type = 'button'; b.className = 'sw' + (c[key] === col ? ' sel' : ''); b.style.background = col; b.setAttribute('aria-label', col);
      b.onclick = () => { c[key] = col; if (after) after(col); save(); }; o.appendChild(b);
    }
  };
  chips('どうぶつ', SPECIES_LIST.map(s => [s.id, s.emoji]), 'sp');
  swatches('毛の色', PALETTE_FUR, 'fur', v => { c.ear = c.sp === 'dog' ? shadeHex(v, 0.65) : v; });
  swatches('服', PALETTE, 'suit');
  swatches('カート', PALETTE, 'kart');
  swatches('アクセント', PALETTE, 'accent', v => { c.scarf = v; });
  chips('ぼうし', Object.entries(HATS), 'hat');
  chips('アクセ', Object.entries(ACCS), 'acc');
  chips('タイプ', Object.entries(FRAMES).map(([k2, f]) => [k2, f.name]), 'frame');
  const o = row('なまえ');
  const inp = document.createElement('input'); inp.id = 'myName'; inp.maxLength = 8; inp.value = c.name;
  inp.oninput = () => { c.name = inp.value.trim() || 'マイキャラ'; store.set('mychar', myChar); document.getElementById('selName').textContent = c.name; };
  o.appendChild(inp);
}
function showResults() {
  state = 'result'; messages = [];
  Sound.engine(0, false);
  updateRanks();
  const rows = karts.map(k => ({ k, time: k.finished ? k.finishTime : raceTime + Math.max(0, LAPS * course.L - k.total) / 270 })).sort((a, b) => a.time - b.time);
  const pos = rows.findIndex(r => r.k.isPlayer) + 1;
  setupPodium(rows.slice(0, 3).map(r => r.k));
  document.getElementById('resRank').textContent = pos === 1 ? '🏆 1位！' : pos <= 3 ? `🎉 ${pos}位` : `${pos}位`;
  const key = 'best' + selCourse, best = store.get(key);
  let bestMsg = '';
  if (!best || player.finishTime < best) { store.set(key, player.finishTime); bestMsg = best ? '🌟 ベストタイム更新！' : ''; }
  document.getElementById('resBest').textContent = bestMsg;
  document.getElementById('resTable').innerHTML = rows.map((r, i) =>
    `<tr class="${r.k.isPlayer ? 'me' : ''}"><td class="rk">${i + 1}</td><td>${speciesEmoji(r.k.ch.sp)} ${r.k.ch.name}${r.k.isPlayer ? '（あなた）' : ''}</td><td class="tm">${fmtTime(r.time)}</td></tr>`).join('');
  showScreen('scrResult');
  document.getElementById('touch').classList.add('hidden');
  document.getElementById('topbtns').classList.add('hidden');
  setTimeout(() => { if (state === 'result') Music.play(4); }, 2200);
}
function togglePause() {
  if (state === 'race' || state === 'countdown' || state === 'done') { pausedFrom = state; state = 'paused'; Sound.engine(0, false); Music.stop(); showScreen('scrPause'); }
  else if (state === 'paused') { state = pausedFrom; showScreen(null); lastT = performance.now(); if (state !== 'countdown') Music.play(course.def.song); }
}
function toTitle() {
  setupRace(Math.floor(Math.random() * COURSES.length), CHARS[Math.floor(Math.random() * CHARS.length)], true);
  state = 'title'; cam.focusT = 0; showScreen('scrTitle');
}
function toSelect() {
  state = 'select'; Sound.engine(0, false); buildSelect(); setShowKart(); showScreen('scrSelect');
  if (!Music.timer || Music.song !== SONGS[4]) Music.play(4);
  document.getElementById('touch').classList.add('hidden');
  document.getElementById('topbtns').classList.add('hidden');
}
document.getElementById('btnStart').onclick = () => { Sound.init(); toSelect(); };
document.getElementById('btnBack').onclick = () => { toTitle(); };
document.getElementById('btnGo').onclick = startRace;
document.getElementById('btnRetry').onclick = startRace;
document.getElementById('btnRetry2').onclick = startRace;
document.getElementById('btnMenu').onclick = toSelect;
document.getElementById('btnQuit').onclick = toSelect;
document.getElementById('btnResume').onclick = togglePause;
document.getElementById('btnPause').onclick = togglePause;
const muteBtn = document.getElementById('btnMute');
const syncMute = () => { muteBtn.textContent = Sound.muted ? '🔇' : '🔊'; };
muteBtn.onclick = () => { Sound.init(); Sound.setMuted(!Sound.muted); syncMute(); };
syncMute();

// ============================================================
//  loop
// ============================================================
let W = 0, H = 0, DPR = 1;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, isTouch ? 1.5 : 1.75);
  W = innerWidth; H = innerHeight;
  renderer.setPixelRatio(DPR); renderer.setSize(W, H, false);
  hud.width = Math.round(W * DPR); hud.height = Math.round(H * DPR);
  for (const cm of [camera, showCam, podCam]) { cm.aspect = W / H; cm.clearViewOffset(); }
  if (W > H) { showCam.setViewOffset(W, H, W * 0.22, 0, W, H); podCam.setViewOffset(W, H, W * 0.2, 0, W, H); }
  else { showCam.setViewOffset(W, H, 0, H * 0.25, W, H); podCam.setViewOffset(W, H, 0, H * 0.22, W, H); }
  for (const cm of [camera, showCam, podCam]) cm.updateProjectionMatrix();
  partMat.uniforms.uScale.value = H * DPR * 0.6;
}
window.addEventListener('resize', resize);
let lastT = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - lastT) / 1000);
  lastT = now;
  if (state !== 'paused') update(dt);
  if (state === 'select') renderer.render(showroom, showCam);
  else if (state === 'result') renderer.render(podium, podCam);
  else if (course) { updateCamera(dt); renderer.render(scene, camera); }
  drawHUD();
  requestAnimationFrame(frame);
}
resize();
setTimeout(async () => {
  hudFont = getComputedStyle(document.body).fontFamily;
  try { await loadAssets(); } catch (e) { document.getElementById('loading').textContent = '3Dモデルの読み込みに失敗しました。再読み込みしてください'; return; }
  toTitle();
  document.getElementById('loading').remove();
  lastT = performance.now();
  requestAnimationFrame(frame);
}, 30);
</script>
