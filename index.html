<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!--PAGE-START-->
<title>ポケットわんにゃん</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&family=M+PLUS+Rounded+1c:wght@500;800&display=swap">
<style>
/* Layout: one handheld "device" column — header, care meters, the room (stage), an LCD message line, then a 4×2 grid of care buttons. Menus slide up as sheets inside the device. */
:root {
  --sun: #FFD45E;        /* page ground */
  --shell: #FFFDF8;      /* device body */
  --ink: #3A2E39;        /* plum-brown text and outlines */
  --ink-soft: #7A6878;
  --coral: #FF6F61;      /* the one accent */
  --honey: #FFE6A3;
  --wall: #DDF1E6;
  --floor: #E7B98A;
  --floor-line: #D49E6C;
  --lcd: #C9D9A6;
  --lcd-ink: #2F3B1C;
  --m-hunger: #FF9F43;
  --m-happy: #FF7BAC;
  --m-clean: #3EC1D3;
  --m-energy: #6BCB77;
  --m-water: #5B9BEA;
  --line: #EADFD3;
  --font-ui: "M PLUS Rounded 1c", "Hiragino Maru Gothic ProN", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
  --font-dot: "DotGothic16", "MS Gothic", "Osaka-Mono", monospace;
  color-scheme: light;
}
html, body { margin: 0; height: 100%; }
body {
  background: var(--sun);
  background-image: radial-gradient(circle at 1px 1px, rgba(58,46,57,.09) 1.5px, transparent 0);
  background-size: 18px 18px;
  color: var(--ink);
  font-family: var(--font-ui);
  font-weight: 500;
  -webkit-tap-highlight-color: transparent;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
button { font-family: inherit; color: inherit; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--coral); outline-offset: 2px; }

.wrap { padding-inline: 16px; padding-block: 16px 24px; display: flex; justify-content: center; }
.device {
  width: 100%; max-width: 420px;
  background: var(--shell);
  border: 3px solid var(--ink);
  border-radius: 34px;
  box-shadow: 0 8px 0 var(--ink);
  padding: 14px;
  display: flex; flex-direction: column; gap: 12px;
  position: relative; overflow: hidden;
}

/* header */
.head { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding-inline: 4px; }
.who { min-width: 0; }
.who h1 { margin: 0; font-size: 1.35rem; font-weight: 800; line-height: 1.1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.who .sub { font-size: .76rem; color: var(--ink-soft); display: flex; gap: 2px 8px; flex-wrap: wrap; }
.right { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; flex-shrink: 0; }
.hearts { display: flex; gap: 2px; }
.hearts svg { width: 19px; height: 19px; }
.coins { font-family: var(--font-dot); font-size: .95rem; background: var(--honey); border: 2px solid var(--ink); border-radius: 999px; padding: 0 10px; font-variant-numeric: tabular-nums; }
.coins.bump { animation: bump .4s ease-out; }
@keyframes bump { 40% { transform: scale(1.25); } }

/* meters */
.meters { display: grid; grid-template-columns: 1fr 1fr; gap: 7px 14px; padding-inline: 4px; }
.body-chip { justify-self: start; font-size: .72rem; font-weight: 800; border: 2px solid var(--ink); border-radius: 999px; padding: 0 8px; background: var(--wall); }
.body-chip.warn { background: var(--honey); }
.meter { display: grid; grid-template-columns: 4.2em 1fr; align-items: center; gap: 6px; font-size: .8rem; }
.meter .bar { height: 12px; border: 2px solid var(--ink); border-radius: 8px; background: var(--shell); overflow: hidden; }
.meter .fill { height: 100%; width: 50%; border-radius: 4px; transition: width .6s ease; }
.meter.low .bar { animation: blink 1s steps(2) infinite; }
@keyframes blink { 50% { border-color: var(--coral); } }

/* room */
.room {
  position: relative; width: 100%; aspect-ratio: 1 / .86; max-width: 100%;
  border: 3px solid var(--ink); border-radius: 22px; overflow: hidden;
  background: var(--wall);
  user-select: none; -webkit-user-select: none; touch-action: manipulation;
}
.room::after { /* floor */
  content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 30%;
  background: repeating-linear-gradient(90deg, var(--floor) 0 46px, var(--floor-line) 46px 48px);
  border-top: 3px solid var(--ink);
}
.room.catching { touch-action: none; }
.window {
  position: absolute; top: 9%; left: 8%; width: 30%; aspect-ratio: 1 / .8;
  border: 3px solid var(--ink); border-radius: 10px; overflow: hidden; background: #9ED8F5;
  transition: background 1s;
}
.window::before, .window::after { content: ""; position: absolute; background: var(--ink); }
.window::before { left: 50%; top: 0; bottom: 0; width: 3px; transform: translateX(-50%); }
.window::after { top: 50%; left: 0; right: 0; height: 3px; transform: translateY(-50%); }
.sky-orb { position: absolute; width: 28%; aspect-ratio: 1; border-radius: 50%; top: 14%; left: 14%; }
.frame { position: absolute; top: 12%; right: 10%; width: 18%; aspect-ratio: 1 / 1.2; border: 3px solid var(--ink); border-radius: 6px; background: #FFF6E0; display: grid; place-items: center; font-family: var(--font-dot); font-size: .68rem; text-align: center; line-height: 1.2; overflow: hidden; }
.rug { position: absolute; bottom: 6%; left: 50%; width: 62%; height: 12%; transform: translateX(-50%); background: #F7C6CF; border: 3px solid var(--ink); border-radius: 50%; z-index: 1; }
.furn { position: absolute; z-index: 2; line-height: 1; pointer-events: none; }
.furn.radio { animation: bob 1s ease-in-out infinite; }
.gift { position: absolute; bottom: 9%; z-index: 4; font-size: 2rem; line-height: 1; background: none; border: 0; padding: 0; cursor: pointer; animation: wiggle 1.2s ease-in-out infinite; }
@keyframes wiggle { 0%, 60%, 100% { transform: rotate(0); } 70% { transform: rotate(-12deg); } 80% { transform: rotate(12deg); } 90% { transform: rotate(-6deg); } }

.petpos { position: absolute; bottom: 8%; left: 50%; width: 52%; z-index: 3; transform: translateX(-50%); transition: transform 1.6s ease-in-out; cursor: pointer; }
.room.catching .petpos { transition: none; width: 36%; }
.petflip { transition: transform .25s; }
.petflip.left { transform: scaleX(-1); }
.petbob { position: relative; animation: bob 1.2s ease-in-out infinite; transform-origin: 50% 100%; }
.petpos.walking .petbob { animation: hop .4s ease-in-out infinite; }
.petpos.asleep .petbob { animation: breathe 3s ease-in-out infinite; }
.petpos.jump .petbob { animation: jump .5s ease-out 2; }
.petpos.spin .petbob { animation: spin .8s ease-in-out; }
@keyframes bob { 50% { transform: translateY(-3px) scaleY(.98); } }
@keyframes hop { 50% { transform: translateY(-8px); } }
@keyframes breathe { 50% { transform: scale(1.03, .97); } }
@keyframes jump { 40% { transform: translateY(-30px) scaleY(1.05); } 80% { transform: translateY(0) scaleY(.92); } }
@keyframes wheel { from { transform: translateX(-50%) rotate(0); } to { transform: translateX(-50%) rotate(360deg); } }
@keyframes spin { 50% { transform: translateY(-24px) rotate(180deg); } 100% { transform: rotate(360deg); } }
.pet-svg { display: block; width: 100%; height: auto; overflow: visible; }
.pet-svg .tail { animation: wag .5s ease-in-out infinite alternate; }
.pet-svg.cat .tail { animation: swish 1.6s ease-in-out infinite alternate; }
.pet-svg.rabbit .ears-b, .pet-svg.hamster .ears-b { animation: twitch 3s ease-in-out infinite; transform-origin: 100px 70px; transform-box: view-box; }
.pet-svg.penguin .flip-l { animation: flap .6s ease-in-out infinite alternate; transform-origin: 62px 130px; transform-box: view-box; }
.pet-svg.penguin .flip-r { animation: flap .6s ease-in-out infinite alternate-reverse; transform-origin: 138px 130px; transform-box: view-box; }
.pet-svg.sleep .tail, .pet-svg.sick .tail, .pet-svg.sad .tail, .pet-svg.sleep .ears-b, .pet-svg.sleep .flip-l, .pet-svg.sleep .flip-r { animation: none; }
@keyframes wag { from { transform: rotate(-12deg); } to { transform: rotate(14deg); } }
@keyframes swish { from { transform: rotate(-6deg); } to { transform: rotate(8deg); } }
@keyframes twitch { 0%, 80%, 100% { transform: rotate(0); } 86% { transform: rotate(-4deg); } 92% { transform: rotate(4deg); } }
@keyframes flap { from { transform: rotate(-8deg); } to { transform: rotate(10deg); } }
.pet-svg .chomp { animation: chomp .25s steps(2) infinite; }
@keyframes chomp { 50% { transform: scaleY(.2); } }
.hat { position: absolute; left: 50%; line-height: 1; pointer-events: none; transform: translate(-50%, -70%); }
.hat.eyes { transform: translate(-50%, -50%); }

.bubble {
  position: absolute; bottom: 92%; left: 50%; transform: translateX(-50%);
  background: var(--shell); border: 2.5px solid var(--ink); border-radius: 14px;
  padding: 4px 10px; font-size: .85rem; font-weight: 800; white-space: nowrap; z-index: 6;
  pointer-events: none; animation: pop .25s ease-out;
}
.bubble::after { content: ""; position: absolute; left: 50%; bottom: -8px; width: 10px; height: 10px; background: var(--shell); border-right: 2.5px solid var(--ink); border-bottom: 2.5px solid var(--ink); transform: translateX(-50%) rotate(45deg); }
@keyframes pop { from { transform: translateX(-50%) scale(.6); opacity: 0; } }

.zzz { position: absolute; top: -6%; right: 4%; font-family: var(--font-dot); font-size: 1.3rem; color: #fff; text-shadow: 0 0 2px var(--ink); animation: zz 2s ease-in-out infinite; z-index: 6; }
@keyframes zz { 0% { transform: translate(0,6px); opacity: 0; } 40% { opacity: 1; } 100% { transform: translate(10px,-14px); opacity: 0; } }

.dark { position: absolute; inset: 0; background: rgba(20,22,52,.62); z-index: 4; pointer-events: none; opacity: 0; transition: opacity .8s; }
.room.lights-off .dark { opacity: 1; }

.item { position: absolute; z-index: 5; font-size: 2rem; line-height: 1; pointer-events: none; }
.drop { position: absolute; left: 0; top: 0; z-index: 7; font-size: 1.9rem; line-height: 1; pointer-events: none; will-change: transform; }
.poop { position: absolute; bottom: 5%; z-index: 2; font-size: 1.7rem; line-height: 1; animation: plop .4s ease-out; }
.poop::before { content: "〰"; position: absolute; top: -12px; left: 4px; font-size: .8rem; color: #7d9a3a; animation: stink 1.6s ease-in-out infinite; }
@keyframes plop { from { transform: scale(.2) translateY(20px); } }
@keyframes stink { 50% { transform: translateY(-4px); opacity: .4; } }
.float { position: absolute; z-index: 9; pointer-events: none; animation: rise 1.1s ease-out forwards; font-size: 1.4rem; font-weight: 800; white-space: nowrap; }
@keyframes rise { to { transform: translateY(-60px) scale(1.3); opacity: 0; } }
.bub { position: absolute; z-index: 7; border-radius: 50%; border: 2px solid #8FD3E8; background: rgba(255,255,255,.7); pointer-events: none; animation: bubup 1.6s ease-out forwards; }
@keyframes bubup { to { transform: translateY(-120px); opacity: 0; } }

.lcd {
  font-family: var(--font-dot); background: var(--lcd); color: var(--lcd-ink);
  border: 3px solid var(--ink); border-radius: 12px; padding: 6px 12px; font-size: .95rem;
  min-height: 2.3em; display: flex; align-items: center; overflow: hidden;
}
.lcd span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* buttons */
.pad { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.act {
  position: relative; border: 2.5px solid var(--ink); border-radius: 16px; background: var(--shell);
  box-shadow: 0 4px 0 var(--ink); padding: 8px 2px 6px; cursor: pointer;
  display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: .74rem; font-weight: 800;
  transition: transform .08s, box-shadow .08s;
}
.act .ic { font-size: 1.5rem; line-height: 1.1; }
.act:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
.act.need::after { content: "!"; position: absolute; top: -8px; right: -6px; width: 20px; height: 20px; border-radius: 50%; background: var(--coral); color: #fff; border: 2px solid var(--ink); font-size: .75rem; display: grid; place-items: center; animation: nudge .8s ease-in-out infinite; }
@keyframes nudge { 50% { transform: scale(1.2); } }

/* full overlays */
.overlay { position: absolute; inset: 0; z-index: 20; background: var(--shell); border-radius: 31px; padding: 22px 18px; display: flex; flex-direction: column; gap: 14px; overflow-y: auto; }
.overlay h2 { margin: 0; font-size: 1.3rem; font-weight: 800; text-align: center; text-wrap: balance; }
.overlay h3 { margin: 0; font-size: 1rem; font-weight: 800; }
.overlay p { margin: 0; text-align: center; color: var(--ink-soft); font-size: .9rem; line-height: 1.6; }
.choices { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.choice { border: 2.5px solid var(--ink); border-radius: 16px; background: var(--wall); padding: 6px 4px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 2px; font-weight: 800; font-size: .9rem; }
.choice[aria-pressed="true"] { background: var(--honey); box-shadow: 0 0 0 3px var(--coral); }
.choice svg { width: 100%; max-width: 92px; height: auto; }
.choice.locked { background: var(--line); cursor: default; }
.choice.locked svg { filter: brightness(0); opacity: .25; }
.choice small { font-size: .62rem; color: var(--ink-soft); font-weight: 500; line-height: 1.3; text-align: center; }
.colors-box { display: flex; flex-direction: column; gap: 6px; align-items: center; }
.colors-box .cname { font-size: .85rem; font-weight: 800; }
.swatches { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
.sw { width: 38px; height: 38px; border-radius: 50%; border: 2.5px solid var(--ink); cursor: pointer; padding: 0; box-shadow: inset -4px -5px 0 rgba(0,0,0,.12), inset 4px 4px 0 rgba(255,255,255,.45); }
.sw.custom { position: relative; overflow: hidden; background: conic-gradient(#FF8A8A, #FFD36E, #9BE38F, #7FD3F0, #B39BF2, #FF8AC8, #FF8A8A); display: grid; place-items: center; font-weight: 800; font-size: 1rem; }
.sw.custom input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; border: 0; padding: 0; }
.sw[aria-pressed="true"] { box-shadow: 0 0 0 4px var(--shell), 0 0 0 7px var(--coral); }
.field { display: flex; flex-direction: column; gap: 4px; font-size: .85rem; font-weight: 800; }
.field input { font: inherit; font-size: 1.1rem; padding: 10px 12px; border: 2.5px solid var(--ink); border-radius: 12px; background: #fff; color: var(--ink); }
.big { border: 2.5px solid var(--ink); border-radius: 16px; background: var(--coral); color: #fff; font-weight: 800; font-size: 1.1rem; padding: 12px; box-shadow: 0 4px 0 var(--ink); cursor: pointer; }
.big.ghost { background: var(--shell); color: var(--ink); }
.big:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
.rows { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; font-size: .92rem; margin: 0; }
.rows dt { color: var(--ink-soft); }
.rows dd { margin: 0; font-weight: 800; text-align: right; font-variant-numeric: tabular-nums; }
.confirm { display: flex; flex-direction: column; gap: 8px; border: 2px dashed var(--coral); border-radius: 14px; padding: 10px; }
.confirm .btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.album { display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 8px; }
.album .card { border: 2px solid var(--ink); border-radius: 12px; padding: 4px; text-align: center; font-size: .7rem; line-height: 1.3; background: var(--wall); min-width: 0; }
.album .card b { display: block; font-size: .8rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.album svg { width: 100%; max-width: 64px; height: auto; }
.bones { display: block; width: 100%; height: auto; }

/* sheets (menus) */
.sheet { position: absolute; inset: 0; z-index: 15; background: rgba(58,46,57,.35); display: flex; align-items: flex-end; }
.sheet-card { width: 100%; max-height: 82%; background: var(--shell); border-top: 3px solid var(--ink); border-radius: 26px 26px 0 0; padding: 16px 14px 14px; display: flex; flex-direction: column; gap: 10px; animation: slide .22s ease-out; }
@keyframes slide { from { transform: translateY(40%); opacity: 0; } }
.sheet-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.sheet-head h3 { margin: 0; font-size: 1.1rem; font-weight: 800; }
.tabs { display: flex; gap: 6px; }
.tab { flex: 1; border: 2px solid var(--ink); border-radius: 999px; background: var(--shell); padding: 6px; font-weight: 800; font-size: .85rem; cursor: pointer; }
.tab[aria-selected="true"] { background: var(--ink); color: var(--shell); }
.list { display: flex; flex-direction: column; gap: 8px; overflow-y: auto; min-height: 0; padding-block: 2px; }
.row { display: grid; grid-template-columns: 2.4rem 1fr auto; align-items: center; gap: 10px; border: 2px solid var(--line); border-radius: 14px; padding: 8px 10px; }
.row .em { font-size: 1.8rem; text-align: center; line-height: 1; }
.row .tx { min-width: 0; }
.row .tx b { display: block; font-size: .95rem; }
.row .tx span { font-size: .74rem; color: var(--ink-soft); }
.mini { border: 2px solid var(--ink); border-radius: 12px; background: var(--honey); font-weight: 800; font-size: .85rem; padding: 6px 12px; cursor: pointer; box-shadow: 0 3px 0 var(--ink); white-space: nowrap; }
.mini:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--ink); }
.mini:disabled { opacity: .45; cursor: default; box-shadow: none; }
.mini.on { background: var(--coral); color: #fff; }
.empty { text-align: center; color: var(--ink-soft); font-size: .85rem; padding: 12px; }

/* mini games, live inside the room */
.game { position: absolute; inset: 0; z-index: 8; display: flex; flex-direction: column; justify-content: space-between; padding: 10px; pointer-events: none; }
.game .top { display: flex; justify-content: space-between; gap: 8px; font-family: var(--font-dot); font-size: 1rem; background: rgba(255,253,248,.92); border: 2.5px solid var(--ink); border-radius: 12px; padding: 4px 10px; }
.game .q { align-self: center; font-weight: 800; font-size: .95rem; background: var(--shell); border: 2.5px solid var(--ink); border-radius: 12px; padding: 4px 12px; text-align: center; }
.game .arrows { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; pointer-events: auto; }
.game .arrows button { font-size: 1.6rem; padding: 6px; border: 2.5px solid var(--ink); border-radius: 14px; background: var(--honey); box-shadow: 0 4px 0 var(--ink); cursor: pointer; font-weight: 800; }
.game .arrows button:disabled { opacity: .5; }
.mark { position: absolute; top: 30%; left: 50%; transform: translateX(-50%); font-size: 4rem; font-weight: 800; z-index: 9; animation: pop .25s ease-out; }

/* top bar, toasts, behavior album */
.topbar { display: flex; align-items: center; gap: 6px; padding-inline: 4px; }
.lv { flex: 1; min-width: 0; display: flex; align-items: center; gap: 6px; font-family: var(--font-dot); font-size: .9rem; }
.lvbar { flex: 1; height: 10px; border: 2px solid var(--ink); border-radius: 6px; overflow: hidden; background: var(--shell); }
#lvFill { height: 100%; width: 0; background: linear-gradient(90deg, #FF9CC0, #FF6F61); transition: width .6s; }
.ib { position: relative; border: 2px solid var(--ink); border-radius: 12px; background: var(--shell); box-shadow: 0 3px 0 var(--ink); font-size: 1.05rem; line-height: 1; padding: 5px 8px; cursor: pointer; display: flex; align-items: center; gap: 3px; }
.ib small { font-family: var(--font-dot); font-size: .7rem; }
.ib:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--ink); }
.badge { position: absolute; top: -7px; right: -7px; min-width: 18px; height: 18px; border-radius: 9px; background: var(--coral); color: #fff; border: 2px solid var(--ink); font-size: .65rem; font-weight: 800; display: grid; place-items: center; padding-inline: 3px; }
.toasts { position: absolute; top: 10px; left: 14px; right: 14px; z-index: 30; display: flex; flex-direction: column; gap: 6px; pointer-events: none; }
.toasts .toast { pointer-events: auto; cursor: pointer; }
.toast { background: var(--ink); color: var(--shell); border-radius: 14px; padding: 8px 12px; box-shadow: 0 4px 0 rgba(0,0,0,.2); animation: tin .3s ease-out; transition: opacity .4s, transform .4s; }
.toast b { display: block; font-size: .9rem; }
.toast span { display: block; font-size: .72rem; line-height: 1.45; opacity: .9; margin-top: 2px; }
.toast.out { opacity: 0; transform: translateY(-10px); }
@keyframes tin { from { transform: translateY(-14px); opacity: 0; } }
.conf { position: absolute; top: -10px; width: 8px; height: 12px; border-radius: 2px; z-index: 12; pointer-events: none; animation: fall 1.8s ease-in forwards; }
@keyframes fall { to { transform: translate(var(--dx), 340px) rotate(540deg); opacity: .2; } }
.tabs.wrap { flex-wrap: wrap; }
.tabs.wrap .tab { flex: 1 1 28%; }
.zklist { display: flex; flex-direction: column; gap: 8px; }
.zk { border: 2px dashed var(--line); border-radius: 14px; padding: 10px 12px; color: var(--ink-soft); }
.zk b { display: block; font-size: .95rem; }
.zk span { font-size: .8rem; line-height: 1.6; }
.zk.on { border: 2px solid var(--ink); background: var(--wall); color: var(--ink); }
.mis { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; align-items: center; border: 2px solid var(--line); border-radius: 14px; padding: 10px 12px; }
.mis.done { background: var(--wall); border-color: var(--ink); }
.mis .bar { grid-column: 1 / -1; height: 8px; border: 2px solid var(--ink); border-radius: 6px; overflow: hidden; }
.mis .bar i { display: block; height: 100%; background: var(--m-energy); }
.mis b { font-size: .9rem; }
.mis span { font-family: var(--font-dot); font-size: .85rem; }

/* 3D mode: the WebGL canvas draws the room and pet; DOM layers stay on top for speech, items and games */
.three-cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; z-index: 0; touch-action: pan-y; cursor: grab; }
.room.three { background: #DDF1E6; }
.room.three::after, .room.three .window, .room.three .frame, .room.three .rug, .room.three #furn { display: none; }
.room.three .petpos { transform: none !important; transition: none !important; bottom: auto; }

    g.setTransform(1, 0, 0, 1, 0, 0);
    g.clearRect(0, 0, 512, 512);

    if (species === 'hamster') stroke(14, p.dark, () => { g.moveTo(cx, 30); g.lineTo(cx, 110); });
    if (species === 'panda') for (const s of [-1, 1]) ellipse(cx + s * ex, ey + 6, 44, 56, p.dark, s * -0.55);
    // blush
    for (const s of [-1, 1]) {

  if (Math.random() < 0.35) return;
  const range = $('room').clientWidth * 0.26;
  const target = Math.round((Math.random() * 2 - 1) * range);

}

}

/* ---------- sheets ---------- */
let sheetMode = null, shopTab = 'food';

function row(icon, title, sub, btnLabel, btnAttrs, disabled, on) {

function effectText(f) {

function onSheetClick(e) {
  const t = e.target.closest('button'); if (!t || t.disabled) return;
  if (t.dataset.tab) { shopTab = t.dataset.tab; return renderSheet(); }
  if (t.dataset.feed) {
    closeSheet();
    const k = t.dataset.feed;
    return k === 'basic' ? feedBasic() : k === 'snack' ? feedSnack() : feedItem(k);
  }
  cared();
  if (t.dataset.drink) { closeSheet(); return drinkWater(); }
  if (t.dataset.vet) return vetAction(t.dataset.vet);
  if (t.dataset.trainMenu) { sheetMode = 'train'; return renderSheet(); }
  if (t.dataset.train) { closeSheet(); return practice(t.dataset.train); }
  if (t.dataset.call) { closeSheet(); return callPet(); }
  if (t.dataset.special) { closeSheet(); mission('special'); mission('play'); gainXP(10); if (S.species !== 'dog') diary('play'); return doSpecial(); }
  if (t.dataset.game) { closeSheet(); return t.dataset.game === 'dir' ? startDir() : startCatch(); }
  if (t.dataset.wear) {
    M.hat = M.hat === t.dataset.wear ? null : t.dataset.wear;
    if (M.hat) { setAnim('joy', 1200); say('にあう？'); }
    renderSheet(); render(); return save();
  }
  if (t.dataset.buy) {
    const [kind, k] = t.dataset.buy.split(':');
    const price = kind === 'food' ? foodInfo(k, S.species).price : kind === 'hat' ? HATS[k].price : FURN[k].price;
    if (M.coins < price) return;
    M.coins -= price;
    if (kind === 'food') { M.inv[k] = (M.inv[k] || 0) + 1; lcd(`${foodInfo(k, S.species).name}を かった`); }
    if (kind === 'hat') { M.hats.push(k); M.hat = k; lcd(`${HATS[k].name}を かって つけてあげた`); setAnim('joy', 1200); say('にあう？'); }
    if (kind === 'furn') { M.furn.push(k); lcd(`${FURN[k].name}を へやに おいた`); setAnim('joy', 1200); }
    renderSheet(); render(); save();
  }
}

/* ---------- each animal's own activity ---------- */
function goOut(awayMs, back) {
  const pos = $('petpos'), W = $('room').clientWidth;
  facing = 1; walkX = W * 0.95; placePet(true);
  setTimeout(() => {
    pos.style.transition = 'none'; walkX = -W * 0.95; placePet(false);
    void pos.offsetWidth;
    setTimeout(() => {
      pos.style.transition = ''; walkX = 0; facing = 1; placePet(true);
      setTimeout(back, 1650);
    }, awayMs);
  }, 1650);
}
function findSomething(where) {
  const r = Math.random();
  if (r < 0.45) { const n = 3 + Math.floor(Math.random() * 8); addCoins(n); return `${where}で ${n}コイン ひろった！`; }
  if (r < 0.6) { M.inv.fav = (M.inv.fav || 0) + 1; return `${where}で ${sp().fav.name}を みつけた！`; }
  return '';
}
function hopTimes(n, gap, done) {
  const pos = $('petpos'), range = $('room').clientWidth * 0.26;
  let i = 0;
  const step = () => {
    if (i++ >= n) return done();
    const target = Math.round((Math.random() * 2 - 1) * range);
    facing = target > walkX ? 1 : -1; walkX = target; placePet(false);
    pos.classList.remove('jump'); void pos.offsetWidth; pos.classList.add('jump');
    setAnim('joy', gap);
    setTimeout(step, gap);
  };
  step();
}

/* ---------- mini game: どっちむくかな ---------- */
function startDir() {
  busy = true; goCenter();
  const g = document.createElement('div');

/* ---------- mini game: おやつキャッチ ---------- */
function startCatch() {
  busy = true;
  const room = $('room'), pos = $('petpos');
  room.classList.add('catching');
  walkX = 0; placePet(false);
  const g = document.createElement('div');
  g.className = 'game';
  g.innerHTML = `<div class="top"><span>⏱<b id="cTime">25</b></span><span>🍬<b id="cScore">0</b></span><span id="cLives">❤❤❤</span></div><div class="q" id="cHint">ゆびで うごかして キャッチ！</div><div></div>`;
  room.appendChild(g);
  const DURATION = 25;
  let score = 0, lives = 3, t0 = performance.now(), last = t0, spawnIn = 0.6, items = [], targetX = 0, running = true;
  const fav = sp().fav.icon, goods = [fav, '🍎', '🍙', '🍬', fav];
  const W = () => room.clientWidth, H = () => room.clientHeight;
  const move = (e) => { const r = room.getBoundingClientRect(); targetX = e.clientX - r.left - r.width / 2; };
  const key = (e) => { if (e.key === 'ArrowLeft') targetX -= W() * 0.18; if (e.key === 'ArrowRight') targetX += W() * 0.18; };
  room.addEventListener('pointerdown', move); room.addEventListener('pointermove', move);
  document.addEventListener('keydown', key);
  setTimeout(() => { const h = $('cHint'); if (h) h.style.visibility = 'hidden'; }, 2500);
  function spawn(el) {
    const r = Math.random(), badP = Math.min(0.32, 0.14 + el * 0.008);
    const kind = r < 0.1 ? 'star' : r < 0.1 + badP ? 'bad' : 'good';
    const e = document.createElement('div');
    e.className = 'drop';
    e.textContent = kind === 'star' ? '⭐' : kind === 'bad' ? '🌶️' : goods[Math.floor(Math.random() * goods.length)];
    room.appendChild(e);
    items.push({ el: e, x: 6 + Math.random() * (W() - 44), y: -40, v: 0.32 + Math.random() * 0.18 + el * 0.012, kind });
  }
  function hit(it) {
    const c = petCenterPct();
    if (it.kind === 'bad') { lives--; setAnim('sad', 700); say('からい！', 700); floatAt('🔥', c.x - 4, c.y); }
    else { const n = it.kind === 'star' ? 3 : 1; score += n; setAnim('joy', 400); floatAt('+' + n, c.x - 3, c.y, '#FF6F61'); }
    $('cScore').textContent = score;
    $('cLives').textContent = '❤'.repeat(Math.max(0, lives)) + '♡'.repeat(3 - Math.max(0, lives));
  }
  function frame(now) {
    if (!running) return;
    const dt = Math.min(50, now - last) / 1000; last = now;
    const el = (now - t0) / 1000;
    const pw = pos.offsetWidth, half = W() / 2 - pw * 0.35;
    targetX = Math.max(-half, Math.min(half, targetX));
    const prev = walkX;
    walkX += (targetX - walkX) * Math.min(1, dt * 12);
    if (Math.abs(walkX - prev) > 0.6) facing = walkX > prev ? 1 : -1;
    placePet(false);
    spawnIn -= dt;
    if (spawnIn <= 0) { spawnIn = Math.max(0.33, 0.75 - el * 0.016); spawn(el); }
    const petCx = W() / 2 + walkX, top = pos.offsetTop - 20, bottom = pos.offsetTop + pos.offsetHeight * 0.65;
    for (const it of items) {
      it.y += it.v * dt * H();
      it.el.style.transform = `translate(${it.x}px, ${it.y}px)`;
      if (!it.done && it.y > top && it.y < bottom && Math.abs(it.x + 16 - petCx) < pw * 0.38) { it.done = true; hit(it); }
      if (it.y > H()) it.done = true;
    }
    items = items.filter(it => { if (it.done) { it.el.remove(); return false; } return true; });
    $('cTime').textContent = Math.max(0, Math.ceil(DURATION - el));
    if (el >= DURATION || lives <= 0) return finish(lives <= 0);
    requestAnimationFrame(frame);
  }
  function finish(burnt) {
    running = false;
    items.forEach(it => it.el.remove());
    room.removeEventListener('pointerdown', move); room.removeEventListener('pointermove', move);
    document.removeEventListener('keydown', key);
    g.remove(); room.classList.remove('catching'); busy = false;
    goCenter();
    const newBest = score > (S.best || 0);
    if (newBest) S.best = score;
    S.played++; mission('play'); gainXP(8 + Math.min(20, score));
    S.happy = clamp(S.happy + 6 + Math.min(30, score * 2)); S.energy = clamp(S.energy - 15);
    S.hunger = clamp(S.hunger + Math.min(15, score)); addBcs(Math.min(4, score * 0.2) - 2); S.water = clamp(S.water - 8); diary('play');
    const coins = Math.round(score * (S.personality === 'やんちゃ' ? 1.5 : 1));
    addCoins(coins);
    setAnim(burnt ? 'sad' : 'joy', 1800);
    say(burnt ? 'からかった…' : newBest ? 'ベスト きろく！' : bark('！'));
    lcd(`${score}こ キャッチ！ ${coins}コイン ゲット${newBest ? '・ベストこうしん！' : ''}`);
    render(); save();
  }
  requestAnimationFrame(frame);
}

/* ---------- sounds (synthesized, no files) ---------- */
const SND = (() => {
  let ctx = null;
  const on = () => M && M.sound !== false;
  function ac() {
    if (!ctx) { try { ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; } }
    if (ctx.state === 'suspended') ctx.resume();
    return ctx;
  }
  // Only soft music-box chimes. Animal voices stay as speech bubbles, never synthesized cries.
  const chime = (f, t, dur = 0.5, peak = 0.06) => {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = 'sine'; o.frequency.value = f;
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(peak, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(ctx.destination); o.start(t); o.stop(t + dur + 0.05);
  };
  const lib = {
    pop() { chime(1047, ctx.currentTime, 0.25, 0.035); },
    coin() { const t = ctx.currentTime; chime(1319, t, 0.4); chime(1760, t + 0.08, 0.5); },
    found() { const t = ctx.currentTime; [784, 988, 1175].forEach((f, i) => chime(f, t + i * 0.1, 0.6, 0.05)); },
    level() { const t = ctx.currentTime; [659, 784, 988, 1319].forEach((f, i) => chime(f, t + i * 0.12, 0.8, 0.05)); },
  };
  return {
    play(name, arg) { if (!on() || !lib[name]) return; if (!ac()) return; try { lib[name](arg); } catch (e) {} },
    unlock() { if (on()) ac(); },
  };
})();

const behaviorKey = (sp, id) => sp + ':' + id;
let behaviorUntil = 0;
function playBehavior(b) {
  if (!b || busy || S.asleep) return false;
  behaviorUntil = Date.now() + (b.dur || 1500);
  if (b.expr) setAnim(b.expr, b.dur || 1500);
  if (b.act && P3.ok) P3.act(b.act, b.dur || 1500);
  if (b.snd) Array.isArray(b.snd) ? SND.play(b.snd[0], b.snd[1]) : SND.play(b.snd);
  if (b.line) say(typeof b.line === 'function' ? bark('♪') : b.line, Math.min(3000, (b.dur || 1500) + 400));
  if (b.special === 'zoom' || b.special === 'hops') {
    const range = $('room').clientWidth * 0.3;
    let n = 0; const steps = b.special === 'zoom' ? 5 : 4;
    const go = () => { if (n++ >= steps || busy) return; walkX = (n % 2 ? 1 : -1) * range * (0.6 + Math.random() * 0.4); facing = walkX > 0 ? 1 : -1; placePet(true); if (b.special === 'hops') { const p = $('petpos'); p.classList.remove('jump'); void p.offsetWidth; p.classList.add('jump'); setTimeout(() => p.classList.remove('jump'), 600); } setTimeout(go, b.dur / steps); };
    go();
  }
  if (b.special === 'slide') { facing = walkX > 0 ? -1 : 1; walkX = -walkX || $('room').clientWidth * 0.25; placePet(false); }
  if (b.special === 'roll') { trick(); }
  if (b.after) setTimeout(() => setAnim(b.after, 2500), b.dur || 1500);
  discover(b);
  diary('saw', b.name);
  mission('behav');
  return true;
}
function pickBehavior(filter) {
  const list = (BEHAVIORS[S.species] || []).filter(b => (!b.when || b.when()) && (!filter || filter(b)));
  const total = list.reduce((a, b) => a + b.w, 0);
  let r = Math.random() * total;
  for (const b of list) { r -= b.w; if (r <= 0) return b; }
  return null;
}
const findBehavior = (id) => (BEHAVIORS[S.species] || []).find(b => b.id === id);
function discover(b) {
  const k = behaviorKey(S.species, b.id);
  if (M.seen[k]) return;
  M.seen[k] = Date.now();
  SND.play('found');
  toast(`📖 はじめて見た！「${b.name}」`, b.fact);

}

const xpNeed = (lv) => 40 + lv * 25;
function gainXP(n) {
  if (!S) return;
  S.xp = (S.xp || 0) + n;
  let up = false;
  while (S.xp >= xpNeed(S.lv)) { S.xp -= xpNeed(S.lv); S.lv++; up = true; }
  if (up) {
    SND.play('level'); confetti();
    const reward = 15 + S.lv * 5;
    M.coins += reward;
    toast(`💞 なかよしレベル ${S.lv} に アップ！`, `${reward}コイン もらった`);
    setAnim('joy', 2000); say(bark('！！'));
  }
  renderTop();
}

  if (M.mDay === today() && M.missions?.length) return;
  const pool = MISSION_POOL.slice().sort(() => Math.random() - 0.5).slice(0, 3);

function mission(id) {
  if (!M || !M.missions) return;
  let changed = false;
  for (const m of M.missions) if (m.id === id && !m.done) {
    m.have++; changed = true;
    if (m.have >= m.n) { m.done = true; M.coins += 15; gainXP(15); SND.play('coin'); toast('🎯 ミッション クリア！', `${m.text}（+15コイン）`); }
  }
  if (changed && !M.mBonus && M.missions.every(m => m.done)) { M.mBonus = true; M.coins += 30; confetti(); toast('🏆 きょうの ミッション ぜんぶ クリア！', 'ボーナス 30コイン'); }
  if (changed) { renderTop(); save(); }
}
const toastQ = [];
let toastBusy = false;
function toast(title, body) { toastQ.push([title, body]); if (toastQ.length > 4) toastQ.shift(); if (!toastBusy) nextToast(); }
function nextToast() {
  const item = toastQ.shift();
  if (!item) { toastBusy = false; return; }
  toastBusy = true;
  const [title, body] = item, box = $('toasts');
  const t = document.createElement('div');
  t.className = 'toast';
  t.innerHTML = `<b></b>${body ? '<span></span>' : ''}`;
  t.querySelector('b').textContent = title;
  if (body) t.querySelector('span').textContent = body;
  box.innerHTML = ''; box.appendChild(t);
  const ms = body && body.length > 30 ? 4800 : 2600;
  t.addEventListener('click', () => { t.remove(); nextToast(); }, { once: true });
  setTimeout(() => t.classList.add('out'), ms);
  setTimeout(() => { if (t.isConnected) { t.remove(); nextToast(); } }, ms + 400);
}
function confetti() {

}

  if (!S.alive) { render(); return showEnding(); }
  const idleH = (Date.now() - S.lastCare) / 3600000;
  if (idleH > 8 && !warned8) { warned8 = true; lcd(`${S.name}が ずっと まってる…（あと ${Math.max(0, 10 - idleH).toFixed(1)}じかんで たいへんな ことに）`); }
  const dt = (Date.now() - S.last) / 60000;
  const evts = [];
  if (dt > 2) handleEvents(catchUp());
  else { S.last = Date.now(); simulate(dt, false, evts); handleEvents(evts); }
  const st = stageOf(ageMin());
  if (st !== S.stage) {
    S.stage = st;
    let extra = '';
    if (st === 2) {
      S.variant = S.neglect < 60 ? 'star' : 'normal';
      if (!M.unlocked.panda) { M.unlocked.panda = true; extra = '・ひみつの どうぶつが ずかんに あらわれた！'; }
      addCoins(50);
    }
    lcd(`${S.name}が ${[sp().kid, sp().kid, sp().adult][st]}に せいちょうした！${extra}`);
    say(bark('！'), 3000); setAnim('joy', 2500);
    $('petpos').classList.add('jump'); setTimeout(() => $('petpos').classList.remove('jump'), 1000);
  }
  if (!S.alive) { render(); return showEnding(); }
  if (dailyBonus()) { lcd('きょうの ログインボーナス 20コイン！'); addCoins(0); }
  wander();
  if (!busy && !S.asleep && Date.now() > chatterAt) {
    chatterAt = Date.now() + 7000 + Math.random() * 7000;
    let line = null;
    if (S.sick) line = 'ぐあい わるい…';
    else if (S.hunger < 30 && S.species === 'cat') playBehavior(findBehavior('meow'));
    else if (S.hunger < 30) line = 'おなか すいた…';
    else if (S.poop > 1) line = '…くさい';
    else if (S.happy < 30 && S.species === 'dog') playBehavior(findBehavior('whine'));
    else if (S.happy < 30) line = 'あそんで！';
    else if (S.energy < 20) line = 'ねむい…';
    else if (S.clean < 30) line = 'からだが かゆい';
    else if (walkOverdue()) { line = 'さんぽ いきたい！'; if (P3.ok) P3.act('bow', 1500); SND.play('whine'); }
    else if (Math.random() < 0.6 && playBehavior(pickBehavior())) { if (has('radio')) S.happy = clamp(S.happy + 3); }
    else if (sp().nocturnal && !isNight() && Math.random() < 0.4) line = 'ふあぁ…（ひるは ねむい）';
    else if (Math.random() < 0.6) line = sp().idles[Math.floor(Math.random() * sp().idles.length)];
    else if (Math.random() < 0.5) line = bark(['！', '♪', '～'][Math.floor(Math.random() * 3)]);
    if (line) say(line);
  }
  render();
  if (Date.now() - lastSave > 5000) { lastSave = Date.now(); save(); }
}

let warned8 = false;
function start(data) {
  M = (data && data.M) || loadJSON(META_KEY) || newMeta();
  M = Object.assign(newMeta(), M);
  if (M.soundV !== 2) { M.sound = false; M.soundV = 2; }
  S = normalize((data && data.S) || loadJSON(SAVE_KEY));
  window.claude?.hot?.snapshot?.(() => ({ S, M }));
  if (!P3.ok && !P3.tried) { P3.tried = true; if (P3.init) P3.init($('room')); if (P3.ok) addHint(); }
  wire();
  if (!S) { openSetup(); return; }
  checkBones();
  if (!S.alive) { render(); return showEnding(); }
  const awayH = (Date.now() - S.lastCare) / 3600000;
  if (awayH >= 5) setTimeout(() => toast(`⚠️ ${Math.floor(awayH)}じかん ぶりだね`, `${S.name}は さみしかったみたい。10じかん いじょう ほうっておくと ほねに なってしまうよ。`), 2500);
  ensureMissions(); renderTop();
  setTimeout(() => { if (!S || !S.alive || S.asleep) return; const g = { dog: 'wag', cat: 'tailup', rabbit: 'periscope', penguin: 'ecstatic' }[S.species]; if (g) playBehavior(findBehavior(g)); }, 1800);
  const evts = catchUp();
  const bonus = dailyBonus();
  render();
  if (bonus) lcd('きょうの ログインボーナス 20コイン！');
  else lcd(evts.length || S.hunger < 40 ? `おかえり！ ${S.name}が まってたよ` : `${S.name}は げんきに してるよ`);
  say(bark('！'));
}
function addHint() {
  const h = document.createElement('div');
  h.className = 'hint3d'; h.textContent = '← ドラッグで ぐるっと →';
  $('room').appendChild(h);
  setTimeout(() => { h.style.opacity = '0'; setTimeout(() => h.remove(), 1200); }, 6000);
}
function begin() {
  const name = ($('nameInput').value || '').trim() || SPECIES[pick.species].name;
  S = newPet(pick.species, pick.color, name);
  dailyBonus();
  save(); petKey = ''; walkX = 0; goCenter();
  $('setup').hidden = true; $('ending').hidden = true;
  $('poops').innerHTML = '';
  render();
  ensureMissions(); renderTop();
  lcd(`${name}が やってきた！ せいかくは「${S.personality}」みたい`);
  say(bark('！'));
}
let wired = false;
function wire() {
  if (wired) return; wired = true;
  $('pad').addEventListener('click', (e) => {
    const b = e.target.closest('.act'); if (!b || !S || !S.alive) return;
    cared();
    if (busy && b.dataset.act !== 'info') return;
    if (b.dataset.act === 'bath' && sp().bath.style !== 'brush') SND.play('splash');
    actions[b.dataset.act]();
  });
  const pet = () => {
    if (!S || busy) return;
    cared();
    if (S.asleep) return say('…Zzz');
    const t = Date.now();
    if (S.species === 'cat' && S.personality !== 'あまえんぼう' && Math.random() < 0.25) { setAnim('normal', 900); if (P3.ok) P3.act('groom', 900); return say('…プイッ', 1200); }
    if ((S.lv || 1) < 2 && ageMin() < 360 && Math.random() < 0.35) {
      setAnim('surprise', 900); if (P3.ok) P3.act('freeze', 900); say('ビクッ', 1000);
      toastOnce('shy', '🏠 まだ なれていない', 'あたらしい おうちに きたばかりの どうぶつは きんちょうしている。むりせず やさしく せっして、なれるのを まとう。');
      return;
    }
    if (t - (S.lastPet || 0) > 1500) diary('pet');
    if (t - (S.lastPet || 0) > 1500) { S.lastPet = t; S.happy = clamp(S.happy + (S.personality === 'あまえんぼう' ? 6 : 3)); mission('pet'); gainXP(2); }
    const c = petCenterPct();
    floatAt('💗', c.x - 4, c.y);
    SND.play('pop');
    // how each animal answers a pat
    const r = Math.random();
    if (S.species === 'cat' && S.happy > 45 && r < 0.45) return playBehavior(findBehavior(r < 0.2 ? 'slowblink' : 'purr'));
    if (S.species === 'dog' && r < 0.4) return playBehavior(findBehavior('wag'));
    if (S.species === 'rabbit' && S.happy > 70 && r < 0.25) return playBehavior(findBehavior('binky'));
    setAnim('joy', 900); say(bark('♪'), 1200); render();
  };
  $('petpos').addEventListener('click', pet);
  $('petpos').addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); pet(); } });
  $('gift').addEventListener('click', openGift);
  $('praise').addEventListener('click', () => {
    if (!S) return;
    cared(); $('praise').hidden = true;
    const before = S.toilet || 0;
    S.toilet = Math.min(5, before + 1); S.happy = clamp(S.happy + 6); diary('toilet'); gainXP(5);
    setAnim('joy', 1500); say(bark('♪'));
    SND.play('coin');
    if (S.toilet >= 5 && before < 5) { confetti(); toast('🚽 トイレを かんぺきに おぼえた！', 'もう ゆかに しないよ'); }
    else lcd(`いいこ！ トイレの おぼえ ${S.toilet}/5`);
    toastOnce('toilet', '🚽 トイレの しつけ', 'できた しゅんかんに ほめると「ここで すると いいこと が ある」と おぼえやすい。');
    render(); save();
  });
  $('sheetList').addEventListener('click', onSheetClick);
  $('sheetTabs').addEventListener('click', onSheetClick);
  $('sheetClose').onclick = closeSheet;
  $('sheet').addEventListener('click', (e) => { if (e.target === $('sheet')) closeSheet(); });
  $('nameInput').addEventListener('input', () => { nameTouched = true; });
  $('startBtn').onclick = begin;
  $('misBtn').onclick = () => { if (S && S.alive) openMissions(); };
  $('zkBtn').onclick = () => { if (S) { zkTab = S.species; openZukan(); } };
  $('zkTabs').addEventListener('click', (e) => { const b = e.target.closest('[data-zk]'); if (b) { zkTab = b.dataset.zk; openZukan(); } });
  $('closeZk').onclick = () => { $('zukan').hidden = true; };
  $('sndBtn').onclick = () => { M.sound = M.sound === false; renderTop(); save(); if (M.sound) SND.play('pop'); };
  document.addEventListener('pointerdown', () => SND.unlock(), { passive: true });
  $('closeInfo').onclick = () => { $('info').hidden = true; };
  $('resetAsk').onclick = () => { $('resetBox').hidden = false; };
  $('resetNo').onclick = () => { $('resetBox').hidden = true; };
  $('resetYes').onclick = () => { archive('bye'); save(); try { localStorage.removeItem(SAVE_KEY); } catch (e) {} S = null; $('info').hidden = true; openSetup(); };
  $('againBtn').onclick = () => { $('ending').hidden = true; openSetup(); };
  document.addEventListener('visibilitychange', () => { if (!document.hidden && S && S.alive) { handleEvents(catchUp()); render(); } });
  setInterval(tick, 1000);
}

window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
</script>
