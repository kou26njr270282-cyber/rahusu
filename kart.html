<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>わんにゃんカート</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800;900&display=swap">
<style>
/* Full-screen 3D game: WebGL canvas, a 2D HUD canvas on top, HTML overlays for menus. */
:root {
  --ink: #1d1436;
  --panel: rgba(18, 12, 42, 0.86);
  --panel-line: rgba(255, 255, 255, 0.14);
  --gold: #ffd23f;
  --ok: #3ddc97;
  --text: #ffffff;
  --font: "M PLUS Rounded 1c", "Hiragino Maru Gothic ProN", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
  color-scheme: dark;
}
html, body {
  margin: 0; height: 100%; overflow: hidden; background: #0b0820; color: var(--text);
  font-family: var(--font); touch-action: none; user-select: none; -webkit-user-select: none;
  -webkit-tap-highlight-color: transparent;
}
#gl, #hud { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
#hud { pointer-events: none; z-index: 2; }
.overlay {
  position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center;
  justify-content: safe center; padding: 16px; box-sizing: border-box; overflow-y: auto;
}
.dim { background: radial-gradient(ellipse at center, rgba(20,10,50,.45), rgba(5,3,15,.85)); }
.hidden { display: none !important; }
#loading { position: fixed; inset: 0; z-index: 30; display: flex; align-items: center; justify-content: center; background: #0b0820; font-weight: 800; font-size: 20px; }
.logo {
  font-size: clamp(44px, 10vw, 110px); font-weight: 900; font-style: italic; letter-spacing: .02em; margin: 0;
  background: linear-gradient(180deg, #fff7a8 0%, #ffd23f 35%, #ff8a1c 65%, #ff3d5f 100%);
  -webkit-background-clip: text; background-clip: text; color: transparent;
  filter: drop-shadow(0 6px 0 #1d1436) drop-shadow(0 0 24px rgba(255,140,60,.55));
  text-align: center; line-height: 1.05; transform: rotate(-3deg);
}
.logo small { display: block; font-size: .3em; letter-spacing: .3em; font-style: normal; }
.sub { margin: 28px 0 26px; text-align: center; font-size: 16px; font-weight: 800; text-shadow: 0 2px 6px #000a; }
.btn {
  font-family: var(--font); font-weight: 900; font-size: 22px; color: var(--ink); background: var(--gold);
  border: none; border-radius: 999px; padding: 14px 46px; cursor: pointer; box-shadow: 0 6px 0 #b0780a, 0 10px 24px rgba(0,0,0,.4);
  transition: transform .08s;
}
.btn:hover { filter: brightness(1.06); }
.btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #b0780a; }
.btn:focus-visible, .card:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
.btn.sec { background: #ece8ff; box-shadow: 0 5px 0 #8c84c4; font-size: 16px; padding: 10px 26px; }
.btn.sec:active { box-shadow: 0 2px 0 #8c84c4; }
.pulse { animation: pulse 1.4s ease-in-out infinite; }
@keyframes pulse { 50% { transform: scale(1.06); } }
@media (prefers-reduced-motion: reduce) { .pulse { animation: none; } }
.row { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; margin-top: 16px; }
.howto { margin-top: 26px; font-size: 13px; line-height: 1.9; text-align: center; background: rgba(0,0,0,.45); padding: 10px 18px; border-radius: 14px; }
kbd { background: #fff2; border: 1px solid #fff4; border-radius: 4px; padding: 0 6px; font-family: inherit; }
h2 { margin: 0 0 10px; font-size: 18px; font-weight: 900; letter-spacing: .05em; }

/* select: the 3D showroom renders behind; the panel sits right (landscape) or bottom (portrait) */
#scrSelect { align-items: flex-end; }
.selpanel { width: min(500px, 100%); background: var(--panel); border: 1px solid var(--panel-line); border-radius: 20px; padding: 16px; box-sizing: border-box; backdrop-filter: blur(6px); }
.selpanel { max-height: 100%; overflow-y: auto; }
@media (max-height: 500px) {
  .selpanel { width: min(440px, 100%); padding: 10px 12px; }
  .selname { font-size: 20px !important; margin-bottom: 4px !important; }
  .card .emo { font-size: 20px; }
  .stats { margin: 6px 0 2px; font-size: 11px; }
  .stat { margin: 1px 0; }
  .sep { margin: 6px 0; }
  h2 { font-size: 14px; margin-bottom: 6px; }
  .course { padding: 4px 2px; }
  .course .ds, .course .emo { display: none; }
  .course .best:empty, .selpanel h2, .sep { display: none; }
  .courses { margin-top: 8px; }
  #scrSelect { padding-block: 8px; }
  .card { padding: 3px 2px; }
  .stat { margin: 0; }
  .bar { height: 7px; }
  .row { margin-top: 8px; }
  .btn { font-size: 17px; padding: 9px 30px; }
  .btn.sec { font-size: 14px; padding: 8px 18px; }
}
.selname { font-size: 30px; font-weight: 900; font-style: italic; margin: 0 0 8px; }
@media (orientation: portrait) {
  #scrSelect { align-items: center; justify-content: flex-end; }
  .selpanel { max-height: 64%; overflow-y: auto; }
}
.grid { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 6px; }
.card {
  background: rgba(255,255,255,.06); border: 2px solid transparent; border-radius: 12px; padding: 6px 2px; text-align: center;
  cursor: pointer; transition: transform .1s, border-color .1s; font-family: var(--font); color: var(--text);
}
.card:hover { transform: translateY(-2px); }
.card.sel { border-color: var(--gold); background: rgba(255,210,63,.16); }
.card .emo { font-size: 26px; line-height: 1.15; }
.stats { margin: 10px 0 4px; font-size: 13px; }
.stat { display: flex; align-items: center; gap: 10px; margin: 4px 0; }
.stat span { width: 74px; flex: none; }
.bar { flex: 1; height: 9px; background: #fff2; border-radius: 5px; overflow: hidden; }
.bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--ok), var(--gold)); border-radius: 5px; }
.courses { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.course { padding: 8px 4px; }
.course .emo { font-size: 24px; }
.course .nm { font-weight: 800; font-size: 13px; }
.course .ds { font-size: 10px; opacity: .75; margin-top: 2px; }
.course .best { font-size: 10px; color: var(--gold); margin-top: 3px; min-height: 1.2em; font-variant-numeric: tabular-nums; }
.sep { height: 1px; background: var(--panel-line); margin: 12px 0; }

table.res { border-collapse: collapse; background: var(--panel); border-radius: 16px; overflow: hidden; min-width: min(440px, 100%); }
table.res td { padding: 7px 14px; font-size: 17px; }
table.res tr:nth-child(odd) { background: #ffffff0d; }
table.res tr.me { background: rgba(255,210,63,.28); font-weight: 900; }
table.res td.rk { font-weight: 900; text-align: right; font-style: italic; }
table.res td.tm { font-variant-numeric: tabular-nums; text-align: right; opacity: .9; }
.bigrank { font-size: clamp(44px, 9vw, 84px); font-weight: 900; font-style: italic; margin: 0 0 8px; color: var(--gold); text-shadow: 0 5px 0 #1d1436, 0 0 30px rgba(255,200,60,.5); }

#touch { position: fixed; inset: 0; z-index: 5; pointer-events: none; }
#touch .tb {
  position: absolute; pointer-events: auto; border-radius: 50%; background: rgba(255,255,255,.16);
  border: 2px solid rgba(255,255,255,.5); color: #fff; font-family: var(--font); font-weight: 900; white-space: nowrap;
  display: flex; align-items: center; justify-content: center; font-size: 24px; touch-action: none;
}
#touch .tb.on { background: rgba(255,255,255,.45); }
#touch #tl { left: 18px; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); width: 80px; height: 80px; }
#touch #tr { left: 112px; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); width: 80px; height: 80px; }
#touch #tdrift { right: 112px; bottom: calc(22px + env(safe-area-inset-bottom, 0px)); width: 78px; height: 78px; font-size: 13px; }
#touch #tbrake { right: 20px; bottom: calc(22px + env(safe-area-inset-bottom, 0px)); width: 78px; height: 78px; font-size: 13px; }
#touch #titem { right: 64px; bottom: calc(114px + env(safe-area-inset-bottom, 0px)); width: 72px; height: 72px; font-size: 30px; }
#topbtns { position: fixed; top: calc(10px + env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%); z-index: 6; display: flex; gap: 8px; }
#topbtns button { font-family: var(--font); background: rgba(0,0,0,.35); color: #fff; border: 1px solid #fff5; border-radius: 999px; padding: 4px 12px; font-size: 13px; cursor: pointer; }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<canvas id="hud"></canvas>
<div id="loading">よみこみ中…</div>

<div id="topbtns" class="hidden">
  <button id="btnPause" type="button">⏸ ポーズ</button>
  <button id="btnMute" type="button">🔊</button>
</div>

<div id="touch" class="hidden">
  <div class="tb" id="tl">◀</div>
  <div class="tb" id="tr">▶</div>
  <div class="tb" id="titem">🎁</div>
  <div class="tb" id="tdrift">ドリフト</div>
  <div class="tb" id="tbrake">ブレーキ</div>
</div>

<div id="scrTitle" class="overlay hidden">
  <h1 class="logo">わんにゃん<br>カート<small>WANNYAN GRAND PRIX</small></h1>
  <p class="sub">どうぶつたちの 3D カートレース！ アイテムとドリフトで 1位をねらえ</p>
  <button class="btn pulse" id="btnStart" type="button">あそぶ</button>
  <div class="howto">
    <kbd>↑</kbd>/<kbd>W</kbd> アクセル　<kbd>↓</kbd>/<kbd>S</kbd> ブレーキ　<kbd>←</kbd><kbd>→</kbd> ハンドル<br>
    <kbd>Space</kbd>/<kbd>Shift</kbd> ドリフト（曲がりながら長押し → 火花の色が変わったら離すとターボ）<br>
    <kbd>X</kbd>/<kbd>Z</kbd>/<kbd>Enter</kbd> アイテム　<kbd>Esc</kbd>/<kbd>P</kbd> ポーズ　｜ スマホは自動アクセル
  </div>
</div>

<div id="scrSelect" class="overlay hidden">
  <div class="selpanel">
    <div class="selname" id="selName"></div>
    <div class="grid" id="charGrid"></div>
    <div class="stats" id="charStats"></div>
    <div class="sep"></div>
    <h2>コース</h2>
    <div class="courses" id="courseGrid"></div>
    <div class="row">
      <button class="btn sec" id="btnBack" type="button">もどる</button>
      <button class="btn" id="btnGo" type="button">スタート！</button>
    </div>
  </div>
</div>

<div id="scrPause" class="overlay dim hidden">
  <h2 style="font-size:26px">ポーズ中</h2>
  <div class="row">
    <button class="btn" id="btnResume" type="button">つづける</button>
    <button class="btn sec" id="btnRetry2" type="button">やりなおす</button>
    <button class="btn sec" id="btnQuit" type="button">メニューへ</button>
  </div>
</div>

<div id="scrResult" class="overlay hidden">
  <div class="bigrank" id="resRank"></div>
  <div id="resBest" style="margin-bottom:10px;color:var(--gold);font-weight:900;text-shadow:0 2px 4px #000"></div>
  <table class="res" id="resTable"></table>
  <div class="row">
    <button class="btn" id="btnRetry" type="button">もういちど</button>
    <button class="btn sec" id="btnMenu" type="button">メニューへ</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';
// ============================================================
//  constants & data
// ============================================================
const LAPS = 3;
const ROADW = 120;            // road width
const CURB = 10;              // curb width on each side
const WALL = ROADW / 2 + 46;  // lateral distance of the barrier from the centerline
const SP = 6;                 // centerline sample spacing
const TAU = Math.PI * 2;

const CHARS = [
  { emoji: '🐶', name: 'ポチ', sp: 'dog',    color: '#e63946', max: 300, acc: 0.85, hand: 2.35 },
  { emoji: '🐱', name: 'タマ', sp: 'cat',    color: '#3a6df0', max: 294, acc: 0.88, hand: 2.65 },
  { emoji: '🐻', name: 'クマ', sp: 'bear',   color: '#2a9d4b', max: 314, acc: 0.70, hand: 2.10 },
  { emoji: '🐰', name: 'ウサ', sp: 'rabbit', color: '#f72585', max: 288, acc: 1.08, hand: 2.50 },
  { emoji: '🐸', name: 'ケロ', sp: 'frog',   color: '#ffb703', max: 298, acc: 0.92, hand: 2.40 },
  { emoji: '🐼', name: 'パン', sp: 'panda',  color: '#2b2d42', max: 308, acc: 0.78, hand: 2.25 },
  { emoji: '🦊', name: 'コン', sp: 'fox',    color: '#7b2cbf', max: 302, acc: 0.82, hand: 2.45 },
  { emoji: '🐵', name: 'モン', sp: 'monkey', color: '#00b4d8', max: 292, acc: 0.98, hand: 2.55 },
];

const COURSES = [
  {
    name: 'わんわんサーキット', emoji: '🌳', desc: 'みどりの丘をかけぬける',
    elev: 14, hills: 70,
    theme: { g0: '#5fbf4f', g1: '#4aa63e', shoulder: '#6fcf5a', road: '#5d5f6b', curbA: '#e63946', curbB: '#ffffff',
      wallA: '#e63946', wallB: '#f5f5f5', skyTop: '#2d7ff9', skyHor: '#cdeeff', fog: '#cdeeff', mtn: '#6b9e7e', mtnSnow: false,
      tree: 'round', sun: 0xfff3dd },
    points: [[300,1000],[300,500],[500,300],[900,300],[1100,500],[1300,400],[1650,350],[1750,600],[1600,900],
             [1700,1200],[1700,1600],[1450,1750],[1000,1700],[800,1450],[500,1700],[300,1500]],
  },
  {
    name: 'にゃんにゃん砂漠', emoji: '🌵', desc: 'ゆうやけの砂丘。カーブが多い',
    elev: 26, hills: 110,
    theme: { g0: '#e9c06a', g1: '#d9ab55', shoulder: '#f0cf85', road: '#7d6a58', curbA: '#ff7b00', curbB: '#fff3d6',
      wallA: '#8a4b20', wallB: '#c98a4b', skyTop: '#ff5e62', skyHor: '#ffd08a', fog: '#ffc98a', mtn: '#c7744a', mtnSnow: false,
      tree: 'cactus', sun: 0xffd2a0 },
    points: [[1000,260],[1600,400],[1750,800],[1400,1000],[1000,900],[700,1050],[900,1300],[1500,1300],[1750,1600],
             [1400,1800],[600,1800],[250,1400],[250,800],[450,380]],
  },
  {
    name: 'こおりの山', emoji: '❄️', desc: '雪山のアップダウン。ヘアピン注意',
    elev: 40, hills: 240,
    theme: { g0: '#f2f7fb', g1: '#dfe9f2', shoulder: '#ffffff', road: '#6f7f94', curbA: '#3a86ff', curbB: '#ffffff',
      wallA: '#3a86ff', wallB: '#e8f1ff', skyTop: '#4f8fd6', skyHor: '#e6f3ff', fog: '#e6f3ff', mtn: '#8fa8c4', mtnSnow: true,
      tree: 'pine', sun: 0xffffff },
    points: [[1000,300],[1700,300],[1750,700],[1300,800],[1300,1100],[1700,1200],[1700,1700],[1000,1750],
             [1000,1300],[600,1250],[600,1700],[300,1700],[300,300]],
  },
];

const ITEMS = {
  boost:  { emoji: '🔥', name: 'ターボ' },
  banana: { emoji: '🍌', name: 'バナナ' },
  rocket: { emoji: '🚀', name: 'ロケット' },
  star:   { emoji: '⭐', name: 'スター' },
};
const ITEM_KEYS = Object.keys(ITEMS);

// ============================================================
//  utils
// ============================================================
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const wrapAngle = a => { a = (a + Math.PI) % TAU; if (a < 0) a += TAU; return a - Math.PI; };
const rand = (a, b) => a + Math.random() * (b - a);
function fmtTime(t) {
  if (!isFinite(t)) return '--:--.--';
  const m = Math.floor(t / 60), s = t - m * 60;
  return `${m}:${s.toFixed(2).padStart(5, '0')}`;
}
const store = {
  get(k) { try { return JSON.parse(localStorage.getItem('wnkart3d_' + k)); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem('wnkart3d_' + k, JSON.stringify(v)); } catch (e) {} },
};

// ============================================================
//  sound
// ============================================================
const Sound = {
  ac: null, master: null, eng: null, eng2: null, engGain: null, muted: !!store.get('muted'),
  init() {
    if (this.ac) { if (this.ac.state === 'suspended') this.ac.resume(); return; }
    try {
      this.ac = new (window.AudioContext || window.webkitAudioContext)();
      this.master = this.ac.createGain(); this.master.gain.value = this.muted ? 0 : 0.5;
      this.master.connect(this.ac.destination);
      this.eng = this.ac.createOscillator(); this.eng.type = 'sawtooth';
      this.eng2 = this.ac.createOscillator(); this.eng2.type = 'square';
      const lp = this.ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 900;
      this.engGain = this.ac.createGain(); this.engGain.gain.value = 0;
      const g2 = this.ac.createGain(); g2.gain.value = 0.35;
      this.eng.connect(lp); this.eng2.connect(g2); g2.connect(lp); lp.connect(this.engGain); this.engGain.connect(this.master);
      this.eng.start(); this.eng2.start();
    } catch (e) { this.ac = null; }
  },
  setMuted(m) { this.muted = m; store.set('muted', m); if (this.master) this.master.gain.value = m ? 0 : 0.5; },
  engine(speed, on) {
    if (!this.ac) return;
    const t = this.ac.currentTime, f = 48 + Math.abs(speed) * 0.45;
    this.eng.frequency.setTargetAtTime(f, t, 0.05);
    this.eng2.frequency.setTargetAtTime(f * 0.5, t, 0.05);
    this.engGain.gain.setTargetAtTime(on ? 0.045 : 0, t, 0.1);
  },
  beep(freq, dur = 0.12, type = 'square', vol = 0.15, slide = 0) {
    if (!this.ac) return;
    const t = this.ac.currentTime, o = this.ac.createOscillator(), g = this.ac.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq + slide), t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g); g.connect(this.master); o.start(t); o.stop(t + dur + 0.02);
  },
  noise(dur = 0.3, vol = 0.2, freq = 1200) {
    if (!this.ac) return;
    const t = this.ac.currentTime, len = Math.floor(this.ac.sampleRate * dur);
    const buf = this.ac.createBuffer(1, len, this.ac.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const s = this.ac.createBufferSource(); s.buffer = buf;
    const f = this.ac.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = freq;
    const g = this.ac.createGain(); g.gain.value = vol;
    s.connect(f); f.connect(g); g.connect(this.master); s.start(t);
  },
};

// ============================================================
//  renderer / scenes
// ============================================================
const glCanvas = document.getElementById('gl');
const hud = document.getElementById('hud');
const hctx = hud.getContext('2d');
const renderer = new THREE.WebGLRenderer({ canvas: glCanvas, antialias: true, powerPreference: 'high-performance' });
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const MAX_ANISO = renderer.capabilities.getMaxAnisotropy();

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(68, 1, 1, 6000);
const hemi = new THREE.HemisphereLight(0xffffff, 0x556644, 0.75);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffffff, 0.95);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -150, right: 150, top: 150, bottom: -150, near: 10, far: 600 });
sun.shadow.bias = -0.0008;
scene.add(sun, sun.target);

// showroom for character select
const showroom = new THREE.Scene();
const showCam = new THREE.PerspectiveCamera(36, 1, 1, 1000);
showroom.background = new THREE.Color('#2a1b5e');
showroom.add(new THREE.HemisphereLight(0xffffff, 0x332255, 0.8));
const spot = new THREE.DirectionalLight(0xffffff, 0.9); spot.position.set(30, 60, 40); spot.castShadow = true;
spot.shadow.mapSize.set(1024, 1024); Object.assign(spot.shadow.camera, { left: -30, right: 30, top: 30, bottom: -30 });
showroom.add(spot);
const rimLight = new THREE.DirectionalLight(0xff88cc, 0.5); rimLight.position.set(-40, 20, -40); showroom.add(rimLight);
const turntable = new THREE.Group(); showroom.add(turntable);
{
  const plat = new THREE.Mesh(new THREE.CylinderGeometry(24, 25, 3, 48), new THREE.MeshPhongMaterial({ color: '#3d2c86', shininess: 80 }));
  plat.position.y = -1.5; plat.receiveShadow = true; turntable.add(plat);
  const ring = new THREE.Mesh(new THREE.TorusGeometry(24.5, 0.5, 8, 64), new THREE.MeshBasicMaterial({ color: '#ffd23f' }));
  ring.rotation.x = Math.PI / 2; turntable.add(ring);
  const floor = new THREE.Mesh(new THREE.CircleGeometry(400, 48), new THREE.MeshLambertMaterial({ color: '#21164a' }));
  floor.rotation.x = -Math.PI / 2; floor.position.y = -3; floor.receiveShadow = true; showroom.add(floor);
}
let showKart = null;

// ============================================================
//  textures
// ============================================================
function canvasTex(w, h, draw, rep = true) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;

function nearestIdx(x, y, from) {
  const { pts, n } = course;
  let best = from, bd = 1e18;
  for (let o = -25; o <= 25; o++) {
    const i = (from + o + n) % n, p = pts[i], d = (p.x - x) ** 2 + (p.y - y) ** 2;
    if (d < bd) { bd = d; best = i; }
  }
  return best;
}
function latOf(x, y, i) { const p = course.pts[i], a = course.ang[i]; return (x - p.x) * -Math.sin(a) + (y - p.y) * Math.cos(a); }
function heightAt(x, y, i) {
  const { pts, ang, hgt, n } = course, p = pts[i], a = ang[i];
  const t = ((x - p.x) * Math.cos(a) + (y - p.y) * Math.sin(a)) / SP;
  const j = t >= 0 ? (i + 1) % n : (i - 1 + n) % n;
  return lerp(hgt[i], hgt[j], Math.min(1, Math.abs(t)));

    idx, total: (idx - n) * SP, lat, lastLap: 0, finished: false, finishTime: Infinity, rank: slot, steerVis: 0,

const keys = {};
const touchIn = { left: false, right: false, brake: false, drift: false };
let isTouch = matchMedia('(pointer: coarse)').matches;
let itemPressed = false;
window.addEventListener('keydown', e => {
  if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code) && state !== 'select') e.preventDefault();
  if (!keys[e.code] && ['KeyX', 'KeyZ', 'Enter'].includes(e.code)) itemPressed = true;
  if ((e.code === 'Escape' || e.code === 'KeyP') && !keys[e.code]) togglePause();
  keys[e.code] = true;
});
window.addEventListener('keyup', e => { keys[e.code] = false; });
window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; if (state === 'race' || state === 'countdown') togglePause(); });
function bindTouch(id, prop) {
  const el = document.getElementById(id);
  const on = e => { e.preventDefault(); if (prop === 'item') itemPressed = true; else touchIn[prop] = true; el.classList.add('on'); };
  const off = e => { e.preventDefault(); if (prop !== 'item') touchIn[prop] = false; el.classList.remove('on'); };
  el.addEventListener('pointerdown', on); el.addEventListener('pointerup', off);
  el.addEventListener('pointercancel', off); el.addEventListener('pointerleave', off);
}
bindTouch('tl', 'left'); bindTouch('tr', 'right'); bindTouch('tbrake', 'brake'); bindTouch('tdrift', 'drift'); bindTouch('titem', 'item');
window.addEventListener('touchstart', () => { isTouch = true; }, { once: true, passive: true });
function playerInput() {
  const left = keys.ArrowLeft || keys.KeyA || touchIn.left;
  const right = keys.ArrowRight || keys.KeyD || touchIn.right;
  const brake = keys.ArrowDown || keys.KeyS || touchIn.brake;
  const accel = keys.ArrowUp || keys.KeyW || (isTouch && !touchIn.brake);
  return { accel: !!accel, brake: !!brake, steer: (right ? 1 : 0) - (left ? 1 : 0), drift: !!(keys.Space || keys.ShiftLeft || keys.ShiftRight || touchIn.drift) };
}

// ============================================================
//  kart physics

function updateKart(k, inp, dt) {

// ============================================================
//  update
// ============================================================
function update(dt) {
  clock += dt;
  for (const m of messages) m.t -= dt;
  messages = messages.filter(m => m.t > 0);
  if (shakeT > 0) shakeT -= dt;
  if (state === 'select') { turntable.rotation.y += dt * 0.6; return; }
  if (!course) return;
  for (const b of course.boxes) {
    if (b.t > 0) b.t -= dt;
    const s = b.t > 0 ? clamp(1 - b.t / 0.4, 0, 1) : 1;
    b.mesh.visible = s > 0.01;
    b.mesh.scale.setScalar(Math.max(0.01, s));
    b.mesh.rotation.set(clock * 0.9 + b.ph, clock * 1.3 + b.ph, 0);
    b.mesh.position.y = b.h + 8 + Math.sin(clock * 2.5 + b.ph) * 1.2;
  }
  for (const pd of course.pads) pd.tex.offset.y = -clock * 1.5;

  if (state === 'title') { for (const k of karts) syncKart(k, dt); updateParticles(dt); return; }
  if (state === 'countdown') {
    const prev = Math.ceil(countdown);
    countdown -= dt;
    const now = Math.ceil(countdown);
    if (now !== prev && now >= 1 && now <= 3) Sound.beep(440, 0.15, 'square', 0.15);
    const inp = playerInput();
    if (countdown < 1.0 && countdown > 0.35 && inp.accel) player.rocketStart = true;
    if (countdown >= 1.0 && inp.accel) player.rocketStart = false;
    if (countdown <= 0) {
      state = 'race'; Sound.beep(880, 0.4, 'square', 0.18); say('GO!', '#3ddc97', 1);
      if (player.rocketStart) { player.boostT = 1.0; say('ロケットスタート！', '#ffd23f', 1.2); }
    }
    for (const k of karts) syncKart(k, dt);
    updateParticles(dt);
    Sound.engine(inp.accel ? 160 : 20, true);
    return;
  }
  if (state === 'result') {
    for (const k of karts) { if (!k.finished || k.isPlayer) updateKart(k, aiInput(k, dt), dt); syncKart(k, dt); }
    updateEntities(dt); updateParticles(dt);
    return;
  }
  if (state !== 'race' && state !== 'done') return;

  for (const k of karts) {
    let inp;

    else inp = aiInput(k, dt);
    updateKart(k, inp, dt);

  collideKarts();
  updateEntities(dt);
  updateRanks();
  for (const k of karts) syncKart(k, dt);
  updateParticles(dt);
  Sound.engine(player.speed, true);

}

function updateCamera(dt) {

    const fx = Math.cos(yaw), fy = Math.sin(yaw);
    const tx = k.x - fx * dist, tz = k.y - fy * dist;
    const groundH = Math.max(heightAt(tx, tz, nearestIdx(tx, tz, k.idx)), k.h);
    cam.y = (state === 'countdown' || !cam.y) ? groundH + hh : lerp(cam.y, groundH + hh, Math.min(1, dt * 6));
    let sx = 0, sy = 0;
    if (shakeT > 0) { sx = rand(-1.2, 1.2); sy = rand(-1.2, 1.2); }
    camera.position.set(tx + sx, cam.y + sy, tz);
    camera.lookAt(k.x + fx * 24, k.h + 7, k.y + fy * 24);
    fov = 66 + clamp(Math.abs(k.speed) / 300, 0, 1.3) * 8 + (k.boostT > 0 ? 7 : 0);
  }
  cam.fov = lerp(cam.fov, fov, Math.min(1, dt * 4));
  if (Math.abs(camera.fov - cam.fov) > 0.01) { camera.fov = cam.fov; camera.updateProjectionMatrix(); }
  const f = state === 'title' ? { x: course.pts[0].x, h: course.hgt[0], y: course.pts[0].y } : player;
  sun.position.set(f.x + 120, f.h + 260, f.y + 60);
  sun.target.position.set(f.x, f.h, f.y);
}

// ============================================================
//  HUD
// ============================================================
let hudFont = 'sans-serif';
const EMOJI_FONT = '"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
function drawLights(c, u, Wd, lit, green) {
  const lw = 150 * u, lh = 46 * u, lx = Wd / 2 - lw / 2, ly = 52 * u;
  c.fillStyle = '#1d1436'; c.beginPath(); c.roundRect ? c.roundRect(lx, ly, lw, lh, 12 * u) : c.rect(lx, ly, lw, lh); c.fill();
  for (let i = 0; i < 3; i++) {
    c.beginPath(); c.arc(lx + lw * (i + 0.5) / 3, ly + lh / 2, 15 * u, 0, TAU);
    c.fillStyle = green ? '#3ddc97' : i < lit ? '#ff3b3b' : '#3d3355'; c.fill();
  }
}
function drawHUD() {
  const c = hctx, Wd = hud.width, Hd = hud.height;
  c.clearRect(0, 0, Wd, Hd);
  if (!course || !player || state === 'title' || state === 'select' || state === 'loading') return;
  const u = Math.min(Wd, Hd) / 400, pad = 14 * u;
  const txt = (text, x, y, size, color, align = 'left', weight = 900, italic = true) => {
    c.font = `${italic ? 'italic ' : ''}${weight} ${Math.round(size)}px ${hudFont}`; c.textAlign = align; c.textBaseline = 'middle';
    c.lineJoin = 'round'; c.lineWidth = size * 0.2; c.strokeStyle = '#1d1436'; c.strokeText(text, x, y);
    c.fillStyle = color; c.fillText(text, x, y);
  };
  if (player.boostT > 0 && state !== 'result') {
    c.strokeStyle = 'rgba(255,255,255,.55)'; c.lineWidth = 2 * u;
    for (let i = 0; i < 26; i++) {
      const a = rand(0, TAU), r0 = rand(0.35, 0.5) * Math.max(Wd, Hd), r1 = r0 + rand(40, 120) * u;
      c.beginPath(); c.moveTo(Wd / 2 + Math.cos(a) * r0, Hd * 0.55 + Math.sin(a) * r0); c.lineTo(Wd / 2 + Math.cos(a) * r1, Hd * 0.55 + Math.sin(a) * r1); c.stroke();
    }
  }
  if (state === 'result' || (state === 'paused' && pausedFrom === 'result')) return;
  // item slot
  const bs = 54 * u, bx = pad + bs / 2, by = pad + bs / 2 + 4 * u;
  c.beginPath(); c.arc(bx, by, bs / 2, 0, TAU);
  const gr = c.createRadialGradient(bx, by - bs * 0.2, bs * 0.1, bx, by, bs / 2);
  gr.addColorStop(0, 'rgba(90,70,160,.85)'); gr.addColorStop(1, 'rgba(25,15,60,.85)'); c.fillStyle = gr; c.fill();
  c.lineWidth = 4 * u; c.strokeStyle = '#ffd23f'; c.stroke();
  let em = null;
  if (player.rollT > 0) em = ITEMS[ITEM_KEYS[Math.floor(clock * 14) % ITEM_KEYS.length]].emoji;
  else if (player.item) em = ITEMS[player.item].emoji;
  if (em) { c.font = `${Math.round(bs * 0.58)}px ${EMOJI_FONT}`; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(em, bx, by + 2 * u); }
  // lap & time
  const lap = clamp(Math.floor(player.total / course.L) + 1, 1, LAPS);
  txt('LAP', Wd - pad - 64 * u, pad + 16 * u, 14 * u, '#ffffff', 'right');
  txt(`${lap}/${LAPS}`, Wd - pad, pad + 14 * u, 28 * u, '#ffffff', 'right');
  txt(fmtTime(player.finished ? player.finishTime : raceTime), Wd - pad, pad + 40 * u, 16 * u, '#ffd23f', 'right', 800, false);
  // rank & speed
  const rk = player.rank + 1;
  const rankY = isTouch ? Hd - 140 * DPR : Hd - pad - 30 * u;
  const rcol = rk === 1 ? '#ffd23f' : rk === 2 ? '#e3e8f0' : rk === 3 ? '#ffae6b' : '#b9b3ff';
  txt(`${rk}`, pad, rankY, 70 * u, rcol);
  c.font = `italic 900 ${Math.round(70 * u)}px ${hudFont}`;
  txt('位', pad + c.measureText(`${rk}`).width + 6 * u, rankY + 12 * u, 26 * u, '#ffffff');
  const kmh = `${Math.round(Math.abs(player.speed) * 0.42)}`;
  txt(kmh, pad, rankY - 52 * u, 20 * u, '#ffffff');
  c.font = `italic 900 ${Math.round(20 * u)}px ${hudFont}`;
  txt('km/h', pad + c.measureText(kmh).width + 6 * u, rankY - 50 * u, 11 * u, '#ffffff', 'left', 800);
  // drift gauge
  if (player.drifting) {
    const tier = driftTier(player.driftCharge), col = tier >= 0 ? TIERS[tier].c : '#ffffff';
    const gw = 120 * u, gx = Wd / 2 - gw / 2, gy = Hd - (isTouch ? 40 : 30) * u;
    c.fillStyle = 'rgba(0,0,0,.45)'; c.fillRect(gx, gy, gw, 8 * u);
    c.fillStyle = col; c.fillRect(gx, gy, gw * clamp(player.driftCharge / 2.3, 0, 1), 8 * u);
    txt('DRIFT', Wd / 2, gy - 12 * u, 14 * u, col, 'center');
  }
  drawMinimap(c, u, pad, Wd);
  if (player.wrongT > 1 && Math.floor(clock * 3) % 2 === 0) txt('ぎゃくそう！', Wd / 2, Hd * 0.3, 32 * u, '#ff5d73', 'center');
  const cdState = state === 'countdown' || (state === 'paused' && pausedFrom === 'countdown');
  if (cdState && countdown < 3.6) {
    drawLights(c, u, Wd, countdown > 3 ? 0 : countdown > 2 ? 1 : countdown > 1 ? 2 : 3, false);
    const nn = Math.ceil(countdown);
    if (nn <= 3 && nn >= 1) { const f = countdown - Math.floor(countdown); txt(`${nn}`, Wd / 2, Hd * 0.4, (80 + f * 50) * u, ['', '#3ddc97', '#ffd23f', '#ff5d73'][nn], 'center'); }
  }
  if (state === 'race' && raceTime < 0.8) drawLights(c, u, Wd, 3, true);
  let my = Hd * 0.27;
  for (const m of messages) {
    const a = clamp(m.t / 0.3, 0, 1), grow = 1 + Math.max(0, (m.t - m.max + 0.2)) * 2;
    c.globalAlpha = a; txt(m.text, Wd / 2, my, 40 * u * grow, m.color, 'center'); c.globalAlpha = 1;
    my += 52 * u;
  }
}
function drawMinimap(c, u, pad, Wd) {
  const { bounds, pts } = course;
  const size = 100 * u, sc = size / Math.max(bounds.maxX - bounds.minX, bounds.maxY - bounds.minY);
  const ox = Wd - pad - size, oy = pad + 62 * u;
  const tx = x => ox + (x - bounds.minX) * sc, ty = y => oy + (y - bounds.minY) * sc;
  c.lineJoin = 'round';
  c.beginPath(); for (let i = 0; i < pts.length; i += 3) { const p = pts[i]; i ? c.lineTo(tx(p.x), ty(p.y)) : c.moveTo(tx(p.x), ty(p.y)); } c.closePath();
  c.strokeStyle = 'rgba(20,10,50,.6)'; c.lineWidth = 8 * u; c.stroke();
  c.strokeStyle = 'rgba(255,255,255,.9)'; c.lineWidth = 4 * u; c.stroke();
  for (const k of [...karts].sort((a, b) => a.isPlayer - b.isPlayer)) {
    c.fillStyle = k.ch.color; c.strokeStyle = k.isPlayer ? '#fff' : '#1d1436'; c.lineWidth = (k.isPlayer ? 2.5 : 1.2) * u;
    c.beginPath(); c.arc(tx(k.x), ty(k.y), (k.isPlayer ? 5 : 3.4) * u, 0, TAU); c.fill(); c.stroke();
  }
}

// ============================================================
//  menus
// ============================================================
const screens = ['scrTitle', 'scrSelect', 'scrPause', 'scrResult'];
function showScreen(id) { for (const s of screens) document.getElementById(s).classList.toggle('hidden', s !== id); }
function setShowKart() {
  if (showKart) { turntable.remove(showKart); disposeGroup(showKart); }
  showKart = buildKart(CHARS[selChar]);
  showKart.rotation.y = 0.6;
  turntable.add(showKart);
  showCam.position.set(0, 20, 52); showCam.lookAt(0, 6, 0);
}
function buildSelect() {
  const c = CHARS[selChar];
  document.getElementById('selName').textContent = `${c.emoji} ${c.name}`;
  const cg = document.getElementById('charGrid'); cg.innerHTML = '';
  CHARS.forEach((ch, i) => {
    const d = document.createElement('button'); d.type = 'button'; d.className = 'card' + (i === selChar ? ' sel' : '');
    d.setAttribute('aria-label', ch.name); d.innerHTML = `<div class="emo">${ch.emoji}</div>`;
    d.onclick = () => { selChar = i; Sound.init(); Sound.beep(700 + i * 60, 0.08, 'triangle', 0.1); buildSelect(); setShowKart(); };
    cg.appendChild(d);
  });
  const bar = (label, v) => `<div class="stat"><span>${label}</span><div class="bar"><i style="width:${Math.round(clamp(v, 0.06, 1) * 100)}%"></i></div></div>`;
  document.getElementById('charStats').innerHTML = bar('スピード', (c.max - 280) / 38) + bar('かそく', (c.acc - 0.6) / 0.52) + bar('ハンドル', (c.hand - 1.95) / 0.75);
  const og = document.getElementById('courseGrid'); og.innerHTML = '';
  COURSES.forEach((co, i) => {
    const best = store.get('best' + i);
    const d = document.createElement('button'); d.type = 'button'; d.className = 'card course' + (i === selCourse ? ' sel' : '');
    d.innerHTML = `<div class="emo">${co.emoji}</div><div class="nm">${co.name}</div><div class="ds">${co.desc}</div><div class="best">${best ? 'ベスト ' + fmtTime(best) : ''}</div>`;
    d.onclick = () => { selCourse = i; Sound.init(); Sound.beep(500 + i * 120, 0.08, 'triangle', 0.1); buildSelect(); };
    og.appendChild(d);
  });
}
function showResults() {
  state = 'result'; messages = [];
  Sound.engine(0, false);
  updateRanks();
  const rows = karts.map(k => ({ k, time: k.finished ? k.finishTime : raceTime + Math.max(0, LAPS * course.L - k.total) / 270 })).sort((a, b) => a.time - b.time);
  const pos = rows.findIndex(r => r.k.isPlayer) + 1;
  document.getElementById('resRank').textContent = pos === 1 ? '🏆 1位！' : pos <= 3 ? `🎉 ${pos}位` : `${pos}位`;
  const key = 'best' + selCourse, best = store.get(key);
  let bestMsg = '';
  if (!best || player.finishTime < best) { store.set(key, player.finishTime); bestMsg = best ? '🌟 ベストタイム更新！' : ''; }
  document.getElementById('resBest').textContent = bestMsg;
  document.getElementById('resTable').innerHTML = rows.map((r, i) =>
    `<tr class="${r.k.isPlayer ? 'me' : ''}"><td class="rk">${i + 1}</td><td>${r.k.ch.emoji} ${r.k.ch.name}${r.k.isPlayer ? '（あなた）' : ''}</td><td class="tm">${fmtTime(r.time)}</td></tr>`).join('');
  showScreen('scrResult');
  document.getElementById('touch').classList.add('hidden');
  document.getElementById('topbtns').classList.add('hidden');
}
function togglePause() {
  if (state === 'race' || state === 'countdown' || state === 'done') { pausedFrom = state; state = 'paused'; Sound.engine(0, false); showScreen('scrPause'); }
  else if (state === 'paused') { state = pausedFrom; showScreen(null); lastT = performance.now(); }
}
function toTitle() {
  setupRace(0, selChar); state = 'title'; showScreen('scrTitle');
}
function toSelect() {
  state = 'select'; Sound.engine(0, false); buildSelect(); setShowKart(); showScreen('scrSelect');
  document.getElementById('touch').classList.add('hidden');
  document.getElementById('topbtns').classList.add('hidden');
}
document.getElementById('btnStart').onclick = () => { Sound.init(); toSelect(); };
document.getElementById('btnBack').onclick = () => { state = 'title'; showScreen('scrTitle'); };
document.getElementById('btnGo').onclick = startRace;
document.getElementById('btnRetry').onclick = startRace;
document.getElementById('btnRetry2').onclick = startRace;
document.getElementById('btnMenu').onclick = toSelect;
document.getElementById('btnQuit').onclick = toSelect;
document.getElementById('btnResume').onclick = togglePause;
document.getElementById('btnPause').onclick = togglePause;
const muteBtn = document.getElementById('btnMute');
const syncMute = () => { muteBtn.textContent = Sound.muted ? '🔇' : '🔊'; };
muteBtn.onclick = () => { Sound.init(); Sound.setMuted(!Sound.muted); syncMute(); };
syncMute();

// ============================================================
//  loop
// ============================================================
let lastT = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - lastT) / 1000);
  lastT = now;
  if (state !== 'paused') update(dt);
  if (state === 'select') renderer.render(showroom, showCam);
  else if (course) { updateCamera(dt); renderer.render(scene, camera); }
  drawHUD();
  requestAnimationFrame(frame);
}
resize();
setTimeout(() => {
  hudFont = getComputedStyle(document.body).fontFamily;
  toTitle();
  document.getElementById('loading').remove();
  lastT = performance.now();
  requestAnimationFrame(frame);
}, 30);
</script>
</body>
