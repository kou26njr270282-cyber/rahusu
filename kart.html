<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>わんにゃんカート</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&display=swap">
<style>
/* Full-screen canvas game. HTML overlays handle menus; the HUD is drawn on the canvas. */
:root {
  --ink: #2b2140;
  --panel: rgba(20, 16, 40, 0.82);
  --accent: #ff5d73;
  --accent2: #ffd23f;
  --ok: #3ddc97;
  --font: "M PLUS Rounded 1c", "Hiragino Maru Gothic ProN", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
  color-scheme: dark;
}
html, body {
  margin: 0; height: 100%; overflow: hidden; background: #0d0b1a; color: #fff;
  font-family: var(--font); touch-action: none; user-select: none; -webkit-user-select: none;
  -webkit-tap-highlight-color: transparent;
}
#game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
.overlay {
  position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center;
  justify-content: safe center; padding: 16px; box-sizing: border-box; overflow-y: auto;
  background: radial-gradient(ellipse at center, rgba(40,20,80,.55), rgba(5,3,15,.88));
}
.hidden { display: none !important; }
.logo {
  font-size: clamp(40px, 9vw, 92px); font-weight: 800; letter-spacing: .04em; margin: 0 0 4px;
  background: linear-gradient(180deg, #fff36b, #ff9f1c 55%, #ff4d6d); -webkit-background-clip: text; background-clip: text;
  color: transparent; filter: drop-shadow(0 5px 0 #2b2140) drop-shadow(0 0 18px rgba(255,120,80,.5));
  text-align: center; line-height: 1.1;
}
.sub { opacity: .85; margin: 0 0 28px; text-align: center; font-size: 15px; }
.btn {
  font-family: var(--font); font-weight: 800; font-size: 20px; color: var(--ink); background: var(--accent2);
  border: none; border-radius: 999px; padding: 14px 42px; cursor: pointer; box-shadow: 0 5px 0 #b8860b;
  transition: transform .08s;
}
.btn:active { transform: translateY(3px); box-shadow: 0 2px 0 #b8860b; }
.btn.sec { background: #e8e4ff; box-shadow: 0 5px 0 #8c84c4; font-size: 16px; padding: 10px 26px; }
.btn.sec:active { box-shadow: 0 2px 0 #8c84c4; }
.row { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; margin-top: 18px; }
.howto { margin-top: 26px; font-size: 13px; opacity: .8; line-height: 1.8; text-align: center; }
kbd { background: #fff2; border: 1px solid #fff4; border-radius: 4px; padding: 0 6px; font-family: inherit; }
h2 { margin: 0 0 12px; font-size: 22px; text-align: center; }
.grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; width: min(640px, 100%); }
.card {
  background: var(--panel); border: 3px solid transparent; border-radius: 14px; padding: 10px 6px; text-align: center;
  cursor: pointer; transition: transform .1s, border-color .1s;
}
.card:hover { transform: translateY(-2px); }
.card.sel { border-color: var(--accent2); box-shadow: 0 0 0 3px rgba(255,210,63,.25); }
.card .emo { font-size: 38px; line-height: 1.1; }
.card .nm { font-weight: 800; margin-top: 2px; }
.card .swatch { height: 6px; border-radius: 3px; margin: 6px 10px 0; }
.stats { width: min(640px, 100%); background: var(--panel); border-radius: 14px; padding: 10px 16px; margin-top: 10px; box-sizing: border-box; font-size: 13px; }
.stat { display: flex; align-items: center; gap: 10px; margin: 3px 0; }
.stat span { width: 90px; flex: none; }
.bar { flex: 1; height: 8px; background: #fff2; border-radius: 4px; overflow: hidden; }
.bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--ok), var(--accent2)); border-radius: 4px; }
.courses { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; width: min(640px, 100%); margin-top: 18px; }
.course .emo { font-size: 30px; }
.course .ds { font-size: 11px; opacity: .75; margin-top: 2px; }
.course .best { font-size: 11px; color: var(--accent2); margin-top: 4px; min-height: 1em; }
@media (max-width: 520px) {
  .grid { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
  .card .emo { font-size: 28px; }
  .card .nm { font-size: 12px; }
  .courses { grid-template-columns: 1fr; }
}
table.res { border-collapse: collapse; background: var(--panel); border-radius: 14px; overflow: hidden; min-width: min(420px, 100%); }
table.res td { padding: 7px 14px; font-size: 17px; }
table.res tr:nth-child(odd) { background: #ffffff0d; }
table.res tr.me { background: rgba(255,210,63,.25); font-weight: 800; }
table.res td.rk { font-weight: 800; text-align: right; }
table.res td.tm { font-variant-numeric: tabular-nums; text-align: right; opacity: .9; }
.bigrank { font-size: clamp(36px, 8vw, 64px); font-weight: 800; margin: 0 0 10px; color: var(--accent2); text-shadow: 0 4px 0 #2b2140; }
#touch { position: fixed; inset: 0; z-index: 5; pointer-events: none; }
#touch .tb {
  position: absolute; pointer-events: auto; border-radius: 50%; background: rgba(255,255,255,.18);
  border: 2px solid rgba(255,255,255,.45); color: #fff; font-family: var(--font); font-weight: 800;
  display: flex; align-items: center; justify-content: center; font-size: 22px; touch-action: none; white-space: nowrap;
}
#touch .tb.on { background: rgba(255,255,255,.45); }
#tl { left: 18px; bottom: 26px; width: 78px; height: 78px; }
#tr { left: 110px; bottom: 26px; width: 78px; height: 78px; }
#tdrift { right: 112px; bottom: 22px; width: 76px; height: 76px; font-size: 13px; }
#tbrake { right: 20px; bottom: 22px; width: 76px; height: 76px; font-size: 13px; }
#titem { right: 66px; bottom: 112px; width: 70px; height: 70px; font-size: 30px; }
#topbtns { position: fixed; top: 10px; left: 50%; transform: translateX(-50%); z-index: 6; display: flex; gap: 8px; }
#topbtns button { font-family: var(--font); background: rgba(0,0,0,.35); color: #fff; border: 1px solid #fff5; border-radius: 999px; padding: 4px 12px; font-size: 13px; cursor: pointer; }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="topbtns" class="hidden">
  <button id="btnPause" type="button">⏸ ポーズ</button>
  <button id="btnMute" type="button">🔊</button>
</div>

<div id="touch" class="hidden">
  <div class="tb" id="tl">◀</div>
  <div class="tb" id="tr">▶</div>
  <div class="tb" id="titem">🎁</div>
  <div class="tb" id="tdrift">ドリフト</div>
  <div class="tb" id="tbrake">ブレーキ</div>
</div>

<div id="scrTitle" class="overlay">
  <h1 class="logo">わんにゃんカート</h1>
  <p class="sub">どうぶつたちの 3周レース！アイテムをつかって 1位をめざそう</p>
  <button class="btn" id="btnStart" type="button">あそぶ</button>
  <div class="howto">
    <kbd>↑</kbd>/<kbd>W</kbd> アクセル　<kbd>↓</kbd>/<kbd>S</kbd> ブレーキ・バック　<kbd>←</kbd><kbd>→</kbd> ハンドル<br>
    <kbd>Space</kbd>/<kbd>Shift</kbd> ドリフト（曲がりながら長押し → 離すとミニターボ）<br>
    <kbd>X</kbd>/<kbd>Z</kbd>/<kbd>Enter</kbd> アイテム　<kbd>Esc</kbd>/<kbd>P</kbd> ポーズ<br>
    スマホは自動アクセル。画面のボタンで操作できます
  </div>
</div>

<div id="scrSelect" class="overlay hidden">
  <h2>キャラクターをえらぼう</h2>
  <div class="grid" id="charGrid"></div>
  <div class="stats" id="charStats"></div>
  <h2 style="margin-top:20px">コースをえらぼう</h2>
  <div class="courses" id="courseGrid"></div>
  <div class="row">
    <button class="btn sec" id="btnBack" type="button">もどる</button>
    <button class="btn" id="btnGo" type="button">レーススタート！</button>
  </div>
</div>

<div id="scrPause" class="overlay hidden">
  <h2>ポーズ中</h2>
  <div class="row">
    <button class="btn" id="btnResume" type="button">つづける</button>
    <button class="btn sec" id="btnRetry2" type="button">やりなおす</button>
    <button class="btn sec" id="btnQuit" type="button">メニューへ</button>
  </div>
</div>

<div id="scrResult" class="overlay hidden">
  <div class="bigrank" id="resRank"></div>
  <div id="resBest" style="margin-bottom:10px;color:var(--accent2);font-weight:800"></div>
  <table class="res" id="resTable"></table>
  <div class="row">
    <button class="btn" id="btnRetry" type="button">もういちど</button>
    <button class="btn sec" id="btnMenu" type="button">メニューへ</button>
  </div>
</div>

<script>
'use strict';
// ===================== constants =====================
const LAPS = 3;
const ROADW = 120;             // road width in world units
const WALL = ROADW / 2 + 48;   // lateral distance from centerline where the fence is
const SP = 6;                  // spacing of sampled centerline points
const TS = 2048;               // track texture size
const CAM_DIST = 42;
const CAM_H = 18;
const TAU = Math.PI * 2;

const CHARS = [
  { emoji: '🐶', name: 'ポチ', color: '#e63946', max: 300, acc: 0.85, hand: 2.35 },
  { emoji: '🐱', name: 'タマ', color: '#4361ee', max: 294, acc: 0.88, hand: 2.65 },
  { emoji: '🐻', name: 'クマ', color: '#8d5524', max: 314, acc: 0.70, hand: 2.10 },
  { emoji: '🐰', name: 'ウサ', color: '#f72585', max: 288, acc: 1.08, hand: 2.50 },
  { emoji: '🐸', name: 'ケロ', color: '#2a9d8f', max: 298, acc: 0.92, hand: 2.40 },
  { emoji: '🐼', name: 'パン', color: '#f1f1f1', max: 308, acc: 0.78, hand: 2.25 },
  { emoji: '🦊', name: 'コン', color: '#f77f00', max: 302, acc: 0.82, hand: 2.45 },
  { emoji: '🐵', name: 'モン', color: '#ffd60a', max: 292, acc: 0.98, hand: 2.55 },
];

const COURSES = [
  {
    name: 'わんわんサーキット', emoji: '🌳', desc: 'みどりの草原。はじめてならココ',
    theme: { g0: '#62c462', g1: '#55b355', road: '#6c6c76', curbA: '#e63946', curbB: '#ffffff', fence: '#5a3d2b',
      sky: ['#3d8bfd', '#bfe6ff'], hillFar: '#7cc29a', hillNear: '#3f8f4a', tree: 'round', edge: '#ffffff' },
    points: [[300,1000],[300,500],[500,300],[900,300],[1100,500],[1300,400],[1650,350],[1750,600],[1600,900],
             [1700,1200],[1700,1600],[1450,1750],[1000,1700],[800,1450],[500,1700],[300,1500]],
  },
  {
    name: 'にゃんにゃん砂漠', emoji: '🌵', desc: 'ゆうやけの砂漠。カーブがおおい',
    theme: { g0: '#ecc66f', g1: '#e2b960', road: '#85725f', curbA: '#ff7b00', curbB: '#fff3d6', fence: '#8a4b20',
      sky: ['#ff6a5b', '#ffc988'], hillFar: '#e09a6a', hillNear: '#b5603a', tree: 'cactus', edge: '#fff3d6' },
    points: [[1000,260],[1600,400],[1750,800],[1400,1000],[1000,900],[700,1050],[900,1300],[1500,1300],[1750,1600],
             [1400,1800],[600,1800],[250,1400],[250,800],[450,380]],
  },
  {
    name: 'こおりの山', emoji: '❄️', desc: 'ゆきやま。ヘアピンに注意',
    theme: { g0: '#f1f7fc', g1: '#e2edf6', road: '#7a8ba1', curbA: '#3a86ff', curbB: '#ffffff', fence: '#4b5d73',
      sky: ['#6aa6db', '#e8f4ff'], hillFar: '#d6e6f5', hillNear: '#9fbad6', tree: 'pine', edge: '#ffffff' },
    points: [[1000,300],[1700,300],[1750,700],[1300,800],[1300,1100],[1700,1200],[1700,1700],[1000,1750],
             [1000,1300],[600,1250],[600,1700],[300,1700],[300,300]],
  },
];

const ITEMS = {
  boost:  { emoji: '🔥', name: 'ターボ' },
  banana: { emoji: '🍌', name: 'バナナ' },
  rocket: { emoji: '🚀', name: 'ロケット' },
  star:   { emoji: '⭐', name: 'スター' },
};
const ITEM_KEYS = Object.keys(ITEMS);

// ===================== utils =====================
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const wrapAngle = a => { a = (a + Math.PI) % TAU; if (a < 0) a += TAU; return a - Math.PI; };
const rand = (a, b) => a + Math.random() * (b - a);
function hexToRgb(h) { const n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
function shade(hex, f) {
  const [r, g, b] = hexToRgb(hex);
  const m = v => clamp(Math.round(f >= 1 ? v + (255 - v) * (f - 1) : v * f), 0, 255);
  return `rgb(${m(r)},${m(g)},${m(b)})`;
}
function fmtTime(t) {
  if (!isFinite(t)) return '--:--.--';
  const m = Math.floor(t / 60), s = t - m * 60;
  return `${m}:${s.toFixed(2).padStart(5, '0')}`;
}
const store = {
  get(k) { try { return JSON.parse(localStorage.getItem('wnkart_' + k)); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem('wnkart_' + k, JSON.stringify(v)); } catch (e) {} },
};

// ===================== sound =====================
const Sound = {
  ac: null, master: null, eng: null, engGain: null, muted: !!store.get('muted'),
  init() {
    if (this.ac) { if (this.ac.state === 'suspended') this.ac.resume(); return; }
    try {
      this.ac = new (window.AudioContext || window.webkitAudioContext)();
      this.master = this.ac.createGain(); this.master.gain.value = this.muted ? 0 : 0.5;
      this.master.connect(this.ac.destination);
      this.eng = this.ac.createOscillator(); this.eng.type = 'sawtooth'; this.eng.frequency.value = 50;
      const lp = this.ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 700;
      this.engGain = this.ac.createGain(); this.engGain.gain.value = 0;
      this.eng.connect(lp); lp.connect(this.engGain); this.engGain.connect(this.master); this.eng.start();
    } catch (e) { this.ac = null; }
  },
  setMuted(m) { this.muted = m; store.set('muted', m); if (this.master) this.master.gain.value = m ? 0 : 0.5; },
  engine(speed, on) {
    if (!this.ac) return;
    const t = this.ac.currentTime;
    this.eng.frequency.setTargetAtTime(45 + Math.abs(speed) * 0.42, t, 0.05);
    this.engGain.gain.setTargetAtTime(on ? 0.05 : 0, t, 0.1);
  },
  beep(freq, dur = 0.12, type = 'square', vol = 0.15, slide = 0) {
    if (!this.ac) return;
    const t = this.ac.currentTime, o = this.ac.createOscillator(), g = this.ac.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq + slide), t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g); g.connect(this.master); o.start(t); o.stop(t + dur + 0.02);
  },
  noise(dur = 0.3, vol = 0.2, freq = 1200) {
    if (!this.ac) return;
    const t = this.ac.currentTime, len = Math.floor(this.ac.sampleRate * dur);
    const buf = this.ac.createBuffer(1, len, this.ac.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const s = this.ac.createBufferSource(); s.buffer = buf;
    const f = this.ac.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = freq;
    const g = this.ac.createGain(); g.gain.value = vol;
    s.connect(f); f.connect(g); g.connect(this.master); s.start(t);
  },
};

// ===================== canvas / screen =====================
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let W = 0, H = 0, DPR = 1, GW = 384, GH = 216, HOR = 80, FOCAL = 190, K = 1;
const groundCv = document.createElement('canvas');
const gctx = groundCv.getContext('2d');
let groundImg = null, groundBuf = null;
let ridgeFar = [], ridgeNear = [];

function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = Math.round(innerWidth * DPR); H = Math.round(innerHeight * DPR);
  canvas.width = W; canvas.height = H;
  GW = 384; GH = Math.round(GW * H / W);
  const portrait = H > W;
  HOR = Math.round(GH * (portrait ? 0.4 : 0.36));
  FOCAL = portrait ? GW * 0.62 : GW * 0.5;
  K = W / GW;
  groundCv.width = GW; groundCv.height = Math.max(1, GH - HOR);
  groundImg = gctx.createImageData(groundCv.width, groundCv.height);
  groundBuf = new Uint32Array(groundImg.data.buffer);
}
window.addEventListener('resize', resize);
resize();

(function makeRidges() {
  const mk = (seed, amp) => {
    const a = [];
    for (let i = 0; i < 1024; i++) {
      const x = i / 1024 * TAU;
      let h = 0;
      for (let o = 1; o <= 5; o++) h += Math.sin(x * (o * 2 + seed) + seed * o * 1.7) / o;
      a.push(Math.max(0, 0.45 + h * 0.35) * amp);
    }
    return a;
  };
  ridgeFar = mk(3, 1); ridgeNear = mk(7, 0.6);
})();

// ===================== course building =====================
let course = null;

function buildCourse(ci) {
  const def = COURSES[ci], th = def.theme;
  const P = def.points.map(([x, y]) => ({ x: x + 24, y: y + 24 }));
  const raw = [], np = P.length;
  for (let i = 0; i < np; i++) {
    const p0 = P[(i - 1 + np) % np], p1 = P[i], p2 = P[(i + 1) % np], p3 = P[(i + 2) % np];
    for (let s = 0; s < 80; s++) {
      const t = s / 80, t2 = t * t, t3 = t2 * t;
      const f = (a, b, c, d) => 0.5 * (2 * b + (-a + c) * t + (2 * a - 5 * b + 4 * c - d) * t2 + (-a + 3 * b - 3 * c + d) * t3);
      raw.push({ x: f(p0.x, p1.x, p2.x, p3.x), y: f(p0.y, p1.y, p2.y, p3.y) });
    }
  }
  // resample to uniform spacing
  const pts = [{ x: raw[0].x, y: raw[0].y }];
  let prev = raw[0], need = SP;
  for (let i = 1; i <= raw.length; i++) {
    const cur = raw[i % raw.length];
    let px = prev.x, py = prev.y, seg = Math.hypot(cur.x - px, cur.y - py);
    while (seg >= need) {
      const t = need / seg; px += (cur.x - px) * t; py += (cur.y - py) * t;
      pts.push({ x: px, y: py }); seg -= need; need = SP;
    }
    need -= seg; prev = cur;
  }
  const last = pts[pts.length - 1];
  if (Math.hypot(last.x - pts[0].x, last.y - pts[0].y) < SP * 0.6) pts.pop();
  const n = pts.length;
  const ang = pts.map((p, i) => {
    const a = pts[(i - 1 + n) % n], b = pts[(i + 1) % n];
    return Math.atan2(b.y - a.y, b.x - a.x);
  });
  const L = n * SP;

  // ----- texture -----
  const tex = document.createElement('canvas'); tex.width = tex.height = TS;
  const t = tex.getContext('2d');
  const groundPat = (() => {
    const c = document.createElement('canvas'); c.width = c.height = 128; const g = c.getContext('2d');
    g.fillStyle = th.g0; g.fillRect(0, 0, 128, 128);
    g.fillStyle = th.g1; g.fillRect(0, 0, 64, 64); g.fillRect(64, 64, 64, 64);
    for (let i = 0; i < 260; i++) {
      g.fillStyle = Math.random() < 0.5 ? 'rgba(0,0,0,.05)' : 'rgba(255,255,255,.07)';
      g.fillRect(Math.random() * 128 | 0, Math.random() * 128 | 0, 2, 2);
    }
    return t.createPattern(c, 'repeat');
  })();
  const roadPat = (() => {
    const c = document.createElement('canvas'); c.width = c.height = 64; const g = c.getContext('2d');
    g.fillStyle = th.road; g.fillRect(0, 0, 64, 64);
    for (let i = 0; i < 300; i++) {
      g.fillStyle = Math.random() < 0.5 ? 'rgba(0,0,0,.07)' : 'rgba(255,255,255,.06)';
      g.fillRect(Math.random() * 64 | 0, Math.random() * 64 | 0, 2, 2);
    }
    return t.createPattern(c, 'repeat');
  })();
  t.fillStyle = groundPat; t.fillRect(0, 0, TS, TS);
  const stroke = (w, style, dash) => {
    t.beginPath(); pts.forEach((p, i) => i ? t.lineTo(p.x, p.y) : t.moveTo(p.x, p.y)); t.closePath();
    t.lineWidth = w; t.strokeStyle = style; t.lineJoin = 'round'; t.setLineDash(dash || []); t.stroke();
  };
  stroke(WALL * 2 + 14, th.fence);
  stroke(WALL * 2 + 6, 'rgba(255,255,255,.35)', [10, 10]);
  stroke(WALL * 2, groundPat);
  stroke(ROADW + 18, th.curbA);
  stroke(ROADW + 18, th.curbB, [16, 16]);
  stroke(ROADW, roadPat);
  stroke(ROADW - 8, th.edge);
  stroke(ROADW - 12, roadPat);
  t.setLineDash([]);
  // start line
  t.save(); t.translate(pts[0].x, pts[0].y); t.rotate(ang[0]);
  for (let yy = -ROADW / 2; yy < ROADW / 2; yy += 8) for (let xx = -8; xx < 8; xx += 8) {
    t.fillStyle = (((yy + 64) / 8 + (xx + 8) / 8) & 1) ? '#111' : '#fff'; t.fillRect(xx, yy, 8, 8);
  }
  t.restore();
  // boost pads
  const pads = [0.33, 0.66].map(f => ({ idx: Math.floor(n * f), lat: rand(-28, 28) }));
  for (const pd of pads) {
    const p = pts[pd.idx], a = ang[pd.idx];
    t.save(); t.translate(p.x - Math.sin(a) * pd.lat, p.y + Math.cos(a) * pd.lat); t.rotate(a);
    t.fillStyle = '#ff8c00'; t.fillRect(-18, -12, 36, 24);
    t.fillStyle = '#ffe14d';
    for (let k = -12; k <= 8; k += 10) { t.beginPath(); t.moveTo(k, -9); t.lineTo(k + 8, 0); t.lineTo(k, 9); t.lineTo(k + 4, 0); t.closePath(); t.fill(); }
    t.restore();
  }
  // mipmaps
  const mips = [];
  let src = tex;
  for (let lv = 0; lv < 4; lv++) {
    const size = TS >> lv;
    let cv = src;
    if (lv > 0) {
      cv = document.createElement('canvas'); cv.width = cv.height = size;
      const c2 = cv.getContext('2d'); c2.imageSmoothingEnabled = true; c2.imageSmoothingQuality = 'high';
      c2.drawImage(src, 0, 0, size, size);
    }
    const data = cv.getContext('2d').getImageData(0, 0, size, size).data;
    mips.push({ size, buf: new Uint32Array(data.buffer.slice(0)) });
    src = cv;
  }
  const bgRgb = hexToRgb(th.g0);
  const bg = (255 << 24 | bgRgb[2] << 16 | bgRgb[1] << 8 | bgRgb[0]) >>> 0;

  // trees
  const trees = [];
  for (let tries = 0; tries < 900 && trees.length < 170; tries++) {
    const x = rand(30, TS - 30), y = rand(30, TS - 30);
    let md = 1e9;
    for (let i = 0; i < n; i += 2) { const d = (pts[i].x - x) ** 2 + (pts[i].y - y) ** 2; if (d < md) md = d; }
    md = Math.sqrt(md);
    if (md > WALL + 26 && md < 520) trees.push({ x, y, s: rand(0.8, 1.3), kind: th.tree });
  }
  // item boxes
  const boxes = [];
  for (const f of [0.17, 0.5, 0.8]) {
    const i = Math.floor(n * f), p = pts[i], a = ang[i];
    for (const lat of [-36, -12, 12, 36]) boxes.push({ x: p.x - Math.sin(a) * lat, y: p.y + Math.cos(a) * lat, t: 0 });
  }
  // minimap
  let minX = 1e9, minY = 1e9, maxX = -1e9, maxY = -1e9;
  for (const p of pts) { minX = Math.min(minX, p.x); minY = Math.min(minY, p.y); maxX = Math.max(maxX, p.x); maxY = Math.max(maxY, p.y); }

  course = { def, th, pts, ang, n, L, mips, bg, trees, boxes, pads, bounds: { minX, minY, maxX, maxY } };
}

function nearestIdx(x, y, from) {
  const { pts, n } = course;
  let best = from, bd = 1e18;
  for (let o = -25; o <= 25; o++) {
    const i = (from + o + n) % n, p = pts[i];
    const d = (p.x - x) ** 2 + (p.y - y) ** 2;
    if (d < bd) { bd = d; best = i; }
  }
  return best;
}
function nearestIdxGlobal(x, y) {
  const { pts, n } = course;
  let best = 0, bd = 1e18;
  for (let i = 0; i < n; i++) { const d = (pts[i].x - x) ** 2 + (pts[i].y - y) ** 2; if (d < bd) { bd = d; best = i; } }
  return best;
}
function latOf(x, y, i) {
  const p = course.pts[i], a = course.ang[i];
  return (x - p.x) * -Math.sin(a) + (y - p.y) * Math.cos(a);
}

// ===================== race state =====================
let state = 'title';       // title | select | countdown | race | done | result | paused
let pausedFrom = null;
let karts = [], player = null, entities = [], particles = [];
let raceTime = 0, countdown = 0, doneTimer = 0, finishOrder = 0;
let selChar = store.get('char') ?? 0, selCourse = store.get('course') ?? 0;
let messages = [];          // {text, t, color}
const cam = { x: 0, y: 0, a: 0, h: CAM_H, dist: CAM_DIST, fx: 1, fy: 0, rx: 0, ry: 1 };
let shakeT = 0;

function makeKart(ci, isPlayer, slot) {
  const ch = CHARS[ci];
  const { pts, ang, n } = course;
  const back = 26 + slot * 20;
  const idx = (n - Math.round(back / SP)) % n;
  const p = pts[idx], a = ang[idx];
  const lat = (slot % 2 ? 22 : -22);
  return {
    ch, isPlayer, x: p.x - Math.sin(a) * lat, y: p.y + Math.cos(a) * lat, angle: a, speed: 0, slip: 0,
    idx, total: (idx - n) * SP, lat, lastLap: 0, finished: false, finishTime: Infinity, rank: slot,
    item: null, rollT: 0, spinT: 0, spinA: 0, boostT: 0, starT: 0, hopT: 0,
    drifting: false, driftDir: 0, driftCharge: 0, driftHeld: false, wallCd: 0, wrongT: 0,
    // AI params
    skill: isPlayer ? 1 : rand(0.93, 1.0), laneOff: rand(-30, 30), laneT: rand(1, 4), itemT: rand(1, 4),
    colors: {},
  };
}

function startRace() {
  buildCourse(selCourse);
  store.set('char', selChar); store.set('course', selCourse);
  karts = []; entities = []; particles = []; messages = [];
  const others = CHARS.map((_, i) => i).filter(i => i !== selChar).sort(() => Math.random() - 0.5);
  const playerSlot = 6;
  for (let s = 0, o = 0; s < 8; s++) {
    if (s === playerSlot) karts.push(player = makeKart(selChar, true, s));
    else karts.push(makeKart(others[o++], false, s));
  }
  raceTime = 0; countdown = 3.999; doneTimer = 0; finishOrder = 0;
  cam.a = player.angle; cam.dist = 160; cam.h = 60;
  for (const b of course.boxes) b.t = 0;
  state = 'countdown';
  Sound.init();
  showScreen(null);
  document.getElementById('topbtns').classList.remove('hidden');
  if (isTouch) document.getElementById('touch').classList.remove('hidden');
}

function say(text, color = '#fff', dur = 1.6) { messages.push({ text, color, t: dur, max: dur }); }

// ===================== input =====================
const keys = {};
const touchIn = { left: false, right: false, brake: false, drift: false, item: false };
let isTouch = false;
let itemPressed = false;
window.addEventListener('keydown', e => {
  if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) e.preventDefault();
  if (!keys[e.code] && ['KeyX', 'KeyZ', 'Enter'].includes(e.code)) itemPressed = true;
  if ((e.code === 'Escape' || e.code === 'KeyP') && !keys[e.code]) togglePause();
  keys[e.code] = true;
});
window.addEventListener('keyup', e => { keys[e.code] = false; });
window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; if (state === 'race' || state === 'countdown') togglePause(); });

function bindTouch(id, prop) {
  const el = document.getElementById(id);
  const on = e => { e.preventDefault(); touchIn[prop] = true; el.classList.add('on'); if (prop === 'item') itemPressed = true; };
  const off = e => { e.preventDefault(); touchIn[prop] = false; el.classList.remove('on'); };
  el.addEventListener('pointerdown', on); el.addEventListener('pointerup', off);
  el.addEventListener('pointercancel', off); el.addEventListener('pointerleave', off);
}
bindTouch('tl', 'left'); bindTouch('tr', 'right'); bindTouch('tbrake', 'brake');
bindTouch('tdrift', 'drift'); bindTouch('titem', 'item');
window.addEventListener('touchstart', () => { isTouch = true; }, { once: true, passive: true });
if (matchMedia('(pointer: coarse)').matches) isTouch = true;

function playerInput() {
  const left = keys.ArrowLeft || keys.KeyA || touchIn.left;
  const right = keys.ArrowRight || keys.KeyD || touchIn.right;
  const brake = keys.ArrowDown || keys.KeyS || touchIn.brake;
  const accel = keys.ArrowUp || keys.KeyW || (isTouch && !touchIn.brake);
  return {
    accel: !!accel, brake: !!brake, steer: (right ? 1 : 0) - (left ? 1 : 0),
    drift: !!(keys.Space || keys.ShiftLeft || keys.ShiftRight || touchIn.drift),
  };
}

// ===================== AI =====================
function aiInput(k, dt) {
  const { pts, ang, n } = course;
  k.laneT -= dt;
  if (k.laneT <= 0) { k.laneT = rand(1.5, 4); k.laneOff = rand(-34, 34); }
  const look = 10 + Math.floor(Math.abs(k.speed) / 28);
  const ti = (k.idx + look) % n, tp = pts[ti], ta = ang[ti];
  const tx = tp.x - Math.sin(ta) * k.laneOff, ty = tp.y + Math.cos(ta) * k.laneOff;
  const want = Math.atan2(ty - k.y, tx - k.x);
  const diff = wrapAngle(want - k.angle);
  const curve = Math.abs(wrapAngle(ang[(k.idx + 30) % n] - ang[k.idx]));
  let accel = true, brake = false;
  if (curve > 1.1 && k.speed > k.ch.max * 0.78) accel = false;
  if (Math.abs(diff) > 1.4 && k.speed > 120) { accel = false; brake = true; }
  // items
  if (k.item && k.rollT <= 0) {
    k.itemT -= dt;
    if (k.itemT <= 0) {
      if (k.item !== 'rocket' || k.rank > 0) useItem(k);
      k.itemT = rand(1, 5);
    }
  }
  return { accel, brake, steer: clamp(diff * 2.6, -1, 1), drift: false };
}

// ===================== items =====================
function rollItem(k) {
  const r = k.rank; // 0 = leading
  let w;
  if (r <= 1) w = { banana: 50, boost: 35, rocket: 15, star: 0 };
  else if (r <= 4) w = { banana: 25, boost: 35, rocket: 30, star: 10 };
  else w = { banana: 8, boost: 35, rocket: 35, star: 22 };
  let s = Math.random() * (w.banana + w.boost + w.rocket + w.star);
  for (const key of ITEM_KEYS) { s -= w[key]; if (s < 0) return key; }
  return 'boost';
}

function useItem(k) {
  const it = k.item; if (!it || k.rollT > 0) return;
  k.item = null;
  const fx = Math.cos(k.angle), fy = Math.sin(k.angle);
  if (it === 'boost') { k.boostT = Math.max(k.boostT, 1.3); if (k.isPlayer) Sound.noise(0.5, 0.25, 600); }
  else if (it === 'star') { k.starT = 7; if (k.isPlayer) { Sound.beep(880, 0.1); Sound.beep(1320, 0.3, 'triangle'); } }
  else if (it === 'banana') {
    entities.push({ type: 'banana', x: k.x - fx * 18, y: k.y - fy * 18, owner: k, age: 0 });
    if (k.isPlayer) Sound.beep(300, 0.1, 'triangle');
  } else if (it === 'rocket') {
    const ahead = karts.filter(o => o !== k && !o.finished && o.total > k.total).sort((a, b) => a.total - b.total)[0] || null;
    entities.push({ type: 'rocket', x: k.x + fx * 14, y: k.y + fy * 14, a: k.angle, idx: k.idx, target: ahead, owner: k, age: 0 });
    if (k.isPlayer) Sound.beep(500, 0.4, 'sawtooth', 0.12, 600);
  }
}

function spinOut(k) {
  if (k.starT > 0 || k.spinT > 0) return;
  k.spinT = 1.1; k.drifting = false; k.driftCharge = 0; k.boostT = 0;
  if (k.isPlayer) { Sound.beep(600, 0.6, 'square', 0.12, -450); shakeT = 0.3; say('スピン！', '#ff8fa3', 1); }
}

function explode(x, y) {
  for (let i = 0; i < 22; i++) {
    const a = rand(0, TAU), sp = rand(30, 120);
    particles.push({ x, y, z: 4, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, vz: rand(20, 80), life: rand(0.4, 0.8), max: 0.8,
      color: ['#ff6b35', '#ffd23f', '#666', '#ff3d3d'][i % 4], size: rand(2, 4) });
  }
  Sound.noise(0.35, 0.3, 300);
}

function updateEntities(dt) {
  const { pts, n } = course;
  for (const e of entities) {
    e.age += dt;
    if (e.type === 'rocket') {
      e.idx = nearestIdx(e.x, e.y, e.idx);
      let tx, ty;
      const tgt = e.target && !e.target.finished ? e.target : null;
      if (tgt && Math.hypot(tgt.x - e.x, tgt.y - e.y) < 160) { tx = tgt.x; ty = tgt.y; }
      else { const p = pts[(e.idx + 14) % n]; tx = p.x; ty = p.y; }
      const want = Math.atan2(ty - e.y, tx - e.x);
      e.a += clamp(wrapAngle(want - e.a), -6 * dt, 6 * dt);
      e.x += Math.cos(e.a) * 470 * dt; e.y += Math.sin(e.a) * 470 * dt;
      if (Math.random() < 0.7) particles.push({ x: e.x, y: e.y, z: 5, vx: rand(-10, 10), vy: rand(-10, 10), vz: rand(0, 10), life: 0.4, max: 0.4, color: '#ddd', size: 2.2 });
      if (e.age > (tgt ? 8 : 4)) { e.dead = true; explode(e.x, e.y); }
    }
    for (const k of karts) {
      if (e.dead) break;
      if (k === e.owner && e.age < 0.5) continue;
      const r = e.type === 'rocket' ? 13 : 11;
      if ((k.x - e.x) ** 2 + (k.y - e.y) ** 2 < r * r) {
        e.dead = true;
        if (e.type === 'rocket') explode(e.x, e.y);
        spinOut(k);
      }
    }
  }
  // rockets destroy bananas
  for (const r of entities) if (r.type === 'rocket' && !r.dead) for (const b of entities) {
    if (b.type === 'banana' && !b.dead && (b.x - r.x) ** 2 + (b.y - r.y) ** 2 < 120) { b.dead = r.dead = true; explode(r.x, r.y); }
  }
  entities = entities.filter(e => !e.dead);
}

// ===================== physics =====================
function updateKart(k, inp, dt) {
  const ch = k.ch;
  k.wallCd -= dt;
  if (k.spinT > 0) {
    k.spinT -= dt; k.spinA += dt * 13;
    if (k.spinT <= 0) k.spinA = 0;
    inp = { accel: false, brake: false, steer: 0, drift: false };
    k.speed *= Math.pow(0.12, dt);
  }
  if (k.hopT > 0) k.hopT -= dt;
  if (k.starT > 0) k.starT -= dt;
  let max = ch.max * k.skill;
  if (!k.isPlayer && player) {
    const gap = player.total - k.total;
    if (gap > 250) max *= 1.07; else if (gap < -500) max *= 0.95;
  }
  const off = Math.abs(k.lat) > ROADW / 2 + 6;
  if (off && k.starT <= 0 && k.boostT <= 0) max *= 0.5;
  if (k.starT > 0) max *= 1.15;
  if (k.boostT > 0) {
    k.boostT -= dt; max *= 1.38; k.speed = Math.max(k.speed, max * 0.95);
    if (Math.random() < 0.8) {
      const bx = k.x - Math.cos(k.angle) * 10, by = k.y - Math.sin(k.angle) * 10;
      particles.push({ x: bx, y: by, z: 3, vx: -Math.cos(k.angle) * 40 + rand(-15, 15), vy: -Math.sin(k.angle) * 40 + rand(-15, 15), vz: rand(5, 25),
        life: 0.3, max: 0.3, color: Math.random() < 0.5 ? '#ffd23f' : '#ff6b35', size: rand(1.8, 3.2) });
    }
  }
  // speed
  if (inp.accel) {
    if (k.speed < max) k.speed += (max - k.speed) * ch.acc * dt + 12 * dt;
    else k.speed += (max - k.speed) * 2.2 * dt;
  } else if (inp.brake) {
    k.speed -= (k.speed > 0 ? 420 : 160) * dt;
    if (k.speed < -70) k.speed = -70;
  } else {
    k.speed -= Math.sign(k.speed) * Math.min(Math.abs(k.speed), 110 * dt);
    if (k.speed > max) k.speed += (max - k.speed) * 2.2 * dt;
  }
  // drift
  if (inp.drift && !k.driftHeld && Math.abs(inp.steer) > 0.1 && k.speed > 130 && !k.drifting && k.spinT <= 0) {
    k.drifting = true; k.driftDir = Math.sign(inp.steer); k.driftCharge = 0; k.hopT = 0.22;
  }
  k.driftHeld = inp.drift;
  let turn;
  const speedF = clamp(Math.abs(k.speed) / 90, 0, 1) * Math.sign(k.speed || 1);
  if (k.drifting) {
    if (!inp.drift || k.speed < 90 || k.spinT > 0) {
      if (k.driftCharge >= 1.5) { k.boostT = Math.max(k.boostT, 1.0); if (k.isPlayer) Sound.noise(0.45, 0.25, 800); }
      else if (k.driftCharge >= 0.75) { k.boostT = Math.max(k.boostT, 0.5); if (k.isPlayer) Sound.noise(0.3, 0.2, 900); }
      k.drifting = false; k.driftCharge = 0;
      turn = inp.steer * ch.hand * speedF;
    } else {
      const inward = inp.steer * k.driftDir;
      turn = k.driftDir * ch.hand * (0.78 + inward * 0.42) * speedF;
      k.driftCharge += dt * (inward > 0 ? 1.25 : 0.8);
      if (Math.random() < 0.9) {
        const col = k.driftCharge >= 1.5 ? '#ff9f1c' : k.driftCharge >= 0.75 ? '#4cc9ff' : 'rgba(255,255,255,.8)';
        for (const side of [-1, 1]) {
          const rx = -Math.sin(k.angle) * 6 * side, ry = Math.cos(k.angle) * 6 * side;
          particles.push({ x: k.x - Math.cos(k.angle) * 6 + rx, y: k.y - Math.sin(k.angle) * 6 + ry, z: 1, vx: rand(-25, 25), vy: rand(-25, 25), vz: rand(15, 45), life: 0.25, max: 0.25, color: col, size: k.driftCharge >= 0.75 ? 1.8 : 1.2 });
        }
      }
    }
  } else {
    turn = inp.steer * ch.hand * speedF;
  }
  k.angle = wrapAngle(k.angle + turn * dt);
  k.slip = lerp(k.slip, k.drifting ? k.driftDir * 0.38 : 0, Math.min(1, dt * 6));
  const md = k.angle - k.slip;
  k.x += Math.cos(md) * k.speed * dt;
  k.y += Math.sin(md) * k.speed * dt;
  // offroad dust
  if (off && Math.abs(k.speed) > 60 && Math.random() < 0.5 && k.starT <= 0) {
    particles.push({ x: k.x, y: k.y, z: 1, vx: rand(-20, 20), vy: rand(-20, 20), vz: rand(10, 30), life: 0.4, max: 0.4, color: shade(course.th.g1, 0.75), size: 2 });
  }
  // track position
  const oldIdx = k.idx;
  k.idx = nearestIdx(k.x, k.y, k.idx);
  let d = k.idx - oldIdx;
  if (d > course.n / 2) d -= course.n; else if (d < -course.n / 2) d += course.n;
  k.total += d * SP;
  k.lat = latOf(k.x, k.y, k.idx);
  if (Math.abs(k.lat) > WALL) {
    const a = course.ang[k.idx], over = k.lat - Math.sign(k.lat) * WALL;
    k.x -= -Math.sin(a) * over; k.y -= Math.cos(a) * over;
    k.lat = Math.sign(k.lat) * WALL;
    if (k.wallCd <= 0) {
      const hit = Math.abs(Math.sin(wrapAngle(md - a)));
      k.speed *= 1 - 0.55 * hit; k.wallCd = 0.4;
      if (k.isPlayer && hit > 0.25) { Sound.noise(0.15, 0.3, 200); shakeT = 0.15; }
    }
  }
  // boost pads
  for (const pd of course.pads) {
    let di = Math.abs(k.idx - pd.idx); di = Math.min(di, course.n - di);
    if (di <= 3 && Math.abs(k.lat - pd.lat) < 20) {
      if (k.boostT < 0.2 && k.isPlayer) Sound.noise(0.4, 0.22, 700);
      k.boostT = Math.max(k.boostT, 0.9);
    }
  }
  // item boxes
  for (const b of course.boxes) {
    if (b.t > 0) continue;
    if ((k.x - b.x) ** 2 + (k.y - b.y) ** 2 < 15 * 15) {
      b.t = 2.5;
      for (let i = 0; i < 8; i++) particles.push({ x: b.x, y: b.y, z: 7, vx: rand(-60, 60), vy: rand(-60, 60), vz: rand(10, 60), life: 0.5, max: 0.5, color: `hsl(${rand(0, 360)},90%,65%)`, size: 2 });
      if (!k.item && k.rollT <= 0) {
        k.rollT = k.isPlayer ? 1.2 : 0.01; k.pending = rollItem(k);
        if (k.isPlayer) Sound.beep(1000, 0.08, 'square', 0.1);
      }
    }
  }
  if (k.rollT > 0) {
    k.rollT -= dt;
    if (k.rollT <= 0) { k.item = k.pending; if (k.isPlayer) Sound.beep(1500, 0.12, 'triangle', 0.12); }
  }
  // lap tracking
  const lap = Math.floor(k.total / course.L) + 1;
  if (lap > k.lastLap) {
    if (k.isPlayer && lap >= 2 && lap <= LAPS) {
      if (lap === LAPS) { say('ファイナルラップ！', '#ffd23f', 2); Sound.beep(660, 0.15); Sound.beep(990, 0.35, 'triangle'); }
      else { say(`LAP ${lap}/${LAPS}`, '#fff', 1.5); Sound.beep(880, 0.2, 'triangle'); }
    }
    k.lastLap = lap;
  }
  if (!k.finished && k.total >= LAPS * course.L) {
    k.finished = true; k.finishTime = raceTime; k.finishPos = finishOrder++;
    if (k.isPlayer) onPlayerFinish();
  }
  // wrong way
  if (k.isPlayer) {
    const wrong = Math.abs(wrapAngle(md - course.ang[k.idx])) > 2.0 && Math.abs(k.speed) > 30;
    k.wrongT = wrong ? k.wrongT + dt : 0;
  }
}

function collideKarts() {
  for (let i = 0; i < karts.length; i++) for (let j = i + 1; j < karts.length; j++) {
    const a = karts[i], b = karts[j];
    const dx = b.x - a.x, dy = b.y - a.y, d2 = dx * dx + dy * dy;
    if (d2 < 15 * 15 && d2 > 0.0001) {
      const d = Math.sqrt(d2), push = (15 - d) / 2, nx = dx / d, ny = dy / d;
      if (a.starT > 0 && b.starT <= 0) spinOut(b);
      else if (b.starT > 0 && a.starT <= 0) spinOut(a);
      a.x -= nx * push; a.y -= ny * push; b.x += nx * push; b.y += ny * push;
      const avg = (a.speed + b.speed) / 2;
      a.speed = lerp(a.speed, avg, 0.3); b.speed = lerp(b.speed, avg, 0.3);
      if ((a.isPlayer || b.isPlayer) && Math.random() < 0.3) Sound.noise(0.08, 0.15, 400);
    }
  }
}

function updateRanks() {
  const sorted = [...karts].sort((a, b) => {
    if (a.finished && b.finished) return a.finishPos - b.finishPos;
    if (a.finished) return -1; if (b.finished) return 1;
    return b.total - a.total;
  });
  sorted.forEach((k, i) => k.rank = i);
}

function onPlayerFinish() {
  state = 'done'; doneTimer = 4;
  const pos = player.rank + 1;
  say(pos === 1 ? 'ゴール！ 1位！' : `ゴール！ ${pos}位`, pos <= 3 ? '#ffd23f' : '#fff', 4);
  if (pos <= 3) { [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => Sound.beep(f, 0.25, 'triangle', 0.15), i * 140)); }
  else Sound.beep(440, 0.4, 'triangle');
}

function updateParticles(dt) {
  for (const p of particles) {
    p.life -= dt; p.x += p.vx * dt; p.y += p.vy * dt; p.z += p.vz * dt; p.vz -= 120 * dt;
    if (p.z < 0) { p.z = 0; p.vz *= -0.3; }
  }
  particles = particles.filter(p => p.life > 0);
  if (particles.length > 500) particles.splice(0, particles.length - 500);
}

// ===================== main update =====================
function update(dt) {
  for (const m of messages) m.t -= dt;
  messages = messages.filter(m => m.t > 0);
  if (shakeT > 0) shakeT -= dt;

  if (state === 'countdown') {
    const prev = Math.ceil(countdown);
    countdown -= dt;
    const now = Math.ceil(countdown);
    if (now !== prev && now >= 1) Sound.beep(440, 0.15, 'square', 0.15);
    if (countdown <= 0) { state = 'race'; Sound.beep(880, 0.4, 'square', 0.18); say('GO!', '#3ddc97', 1); }
    // hold accel at the right moment = rocket start
    const inp = playerInput();
    if (countdown < 1.0 && countdown > 0.4 && inp.accel) player.rocketStart = true;
    if (countdown >= 1.0 && inp.accel) player.rocketStart = false;
    if (state === 'race' && player.rocketStart) player.boostT = 1.0;
    updateCamera(dt);
    return;
  }
  if (state !== 'race' && state !== 'done') return;

  raceTime += dt;
  for (const b of course.boxes) if (b.t > 0) b.t -= dt;
  for (const k of karts) {
    let inp;
    if (k.isPlayer && !k.finished) {
      inp = playerInput();
      if (itemPressed) useItem(k);
    } else inp = aiInput(k, dt);
    updateKart(k, inp, dt);
  }
  itemPressed = false;
  collideKarts();
  updateEntities(dt);
  updateParticles(dt);
  updateRanks();
  updateCamera(dt);
  Sound.engine(player.speed, true);

  if (state === 'done') {
    doneTimer -= dt;
    if (doneTimer <= 0 || karts.every(k => k.finished)) showResults();
  }
}

function updateCamera(dt) {
  const target = player.angle - player.slip * 0.6;
  cam.a = wrapAngle(cam.a + wrapAngle(target - cam.a) * Math.min(1, dt * (state === 'countdown' ? 2 : 7)));
  const wantD = state === 'countdown' ? lerp(CAM_DIST, 150, clamp((countdown - 1) / 3, 0, 1)) : CAM_DIST;
  const wantH = state === 'countdown' ? lerp(CAM_H, 55, clamp((countdown - 1) / 3, 0, 1)) : CAM_H;
  cam.dist = lerp(cam.dist, wantD, Math.min(1, dt * 4));
  cam.h = lerp(cam.h, wantH, Math.min(1, dt * 4));
  cam.fx = Math.cos(cam.a); cam.fy = Math.sin(cam.a); cam.rx = -cam.fy; cam.ry = cam.fx;
  let sx = 0, sy = 0;
  if (shakeT > 0) { sx = rand(-2, 2); sy = rand(-2, 2); }
  cam.x = player.x - cam.fx * cam.dist + sx;
  cam.y = player.y - cam.fy * cam.dist + sy;
}

// ===================== rendering =====================
function proj(wx, wy, wz) {
  const dx = wx - cam.x, dy = wy - cam.y;
  const depth = dx * cam.fx + dy * cam.fy;
  if (depth < 2) return null;
  const side = dx * cam.rx + dy * cam.ry, s = FOCAL / depth;
  return { x: (GW / 2 + side * s) * K, y: (HOR + (cam.h - wz) * s) * K, s: s * K, depth };
}

function drawSky() {
  const th = course.th, hy = HOR * K;
  const g = ctx.createLinearGradient(0, 0, 0, hy);
  g.addColorStop(0, th.sky[0]); g.addColorStop(1, th.sky[1]);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, hy + 2);
  const pxPerRad = FOCAL * K;
  const layer = (arr, color, amp, par) => {
    ctx.fillStyle = color; ctx.beginPath(); ctx.moveTo(0, hy + 2);
    for (let x = 0; x <= W + 8; x += 8) {
      const th2 = cam.a * par + (x - W / 2) / pxPerRad;
      let i = Math.floor((th2 / TAU) * 1024) % 1024; if (i < 0) i += 1024;
      ctx.lineTo(x, hy + 1 - arr[i] * amp);
    }
    ctx.lineTo(W, hy + 2); ctx.closePath(); ctx.fill();
  };
  layer(ridgeFar, th.hillFar, hy * 0.45, 1);
  layer(ridgeNear, th.hillNear, hy * 0.35, 1);
  // clouds
  ctx.fillStyle = 'rgba(255,255,255,.75)';
  for (let c = 0; c < 6; c++) {
    let x = ((c * 0.17 + 0.05 - cam.a / TAU) % 1 + 1) % 1 * pxPerRad * TAU;
    x = x % (pxPerRad * TAU) - pxPerRad * 0.5;
    if (x < -200 * DPR || x > W + 200 * DPR) continue;
    const y = hy * (0.15 + (c % 3) * 0.12), r = (14 + (c % 2) * 8) * DPR * K / 3;
    ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.arc(x + r, y + r * 0.2, r * 0.8, 0, TAU); ctx.arc(x - r, y + r * 0.25, r * 0.7, 0, TAU); ctx.fill();
  }
}

function drawGround() {
  const gw = groundCv.width, gh = groundCv.height, buf = groundBuf, mips = course.mips, bg = course.bg;
  const fx = cam.fx, fy = cam.fy, rx = cam.rx, ry = cam.ry;
  for (let r = 0; r < gh; r++) {
    const dist = cam.h * FOCAL / (r + 0.5);
    const step = dist / FOCAL;
    let lv = step < 1.6 ? 0 : step < 3.2 ? 1 : step < 6.4 ? 2 : 3;
    const m = mips[lv], size = m.size, mb = m.buf, sc = 1 / (1 << lv);
    let wx = (cam.x + fx * dist + rx * (0.5 - gw / 2) * step) * sc;
    let wy = (cam.y + fy * dist + ry * (0.5 - gw / 2) * step) * sc;
    const sx = rx * step * sc, sy = ry * step * sc;
    let o = r * gw;
    for (let x = 0; x < gw; x++) {
      const ix = wx | 0, iy = wy | 0;
      buf[o++] = (ix >= 0 && iy >= 0 && ix < size && iy < size) ? mb[iy * size + ix] : bg;
      wx += sx; wy += sy;
    }
  }
  gctx.putImageData(groundImg, 0, 0);
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(groundCv, 0, Math.round(HOR * K), W, Math.ceil(gh * K) + 1);
  // horizon haze
  const hy = HOR * K;
  const g = ctx.createLinearGradient(0, hy, 0, hy + 30 * K);
  g.addColorStop(0, course.th.sky[1]); g.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.globalAlpha = 0.85; ctx.fillStyle = g; ctx.fillRect(0, hy, W, 30 * K); ctx.globalAlpha = 1;
}

// kart model: boxes in local coords (x right, y forward, z up)
const KART_BOXES = [
  { b: [-7.8, -6.5, 0, -4.8, -2.5, 4], c: 'tire' }, { b: [4.8, -6.5, 0, 7.8, -2.5, 4], c: 'tire' },
  { b: [-7.0, 4, 0, -4.5, 7.5, 3.4], c: 'tire' }, { b: [4.5, 4, 0, 7.0, 7.5, 3.4], c: 'tire' },
  { b: [-2.5, -8.5, 1.5, 2.5, -6, 3.5], c: 'metal' },
  { b: [-5, -6.5, 1.2, 5, 5, 4], c: 'main' },
  { b: [-3.5, 5, 1.2, 3.5, 9.5, 3.2], c: 'main' },
  { b: [-4.5, 9.2, 0.6, 4.5, 10.6, 2.2], c: 'dark' },
  { b: [-3, -5, 4, 3, -3.6, 7.5], c: 'dark' },
  { b: [-2.6, -3.6, 4, 2.6, -0.4, 8], c: 'suit' },
  { b: [-3.2, -8.2, 3.5, -2.2, -7.2, 5.5], c: 'dark' }, { b: [2.2, -8.2, 3.5, 3.2, -7.2, 5.5], c: 'dark' },
  { b: [-6, -9, 5.5, 6, -7, 6.6], c: 'main' },
];
const FACE_DEF = [
  // [corner indices], normal in local (nx right, ny fwd, nz up), shade
  { c: [4, 5, 7, 6], n: [0, 0, 1], f: 1.12 },   // top
  { c: [2, 3, 7, 6], n: [0, 1, 0], f: 0.85 },   // front
  { c: [0, 1, 5, 4], n: [0, -1, 0], f: 0.72 },  // back
  { c: [1, 3, 7, 5], n: [1, 0, 0], f: 0.62 },   // right
  { c: [0, 2, 6, 4], n: [-1, 0, 0], f: 0.62 },  // left
];

function kartColor(k, role, f) {
  if (k.starT > 0 && (role === 'main' || role === 'suit')) return `hsl(${(raceTime * 700 + f * 120) % 360},90%,${45 + f * 15}%)`;
  const key = role + f;
  if (k.colors[key]) return k.colors[key];
  const base = role === 'main' ? k.ch.color : role === 'suit' ? shade(k.ch.color, 0.55) : role === 'tire' ? '#1d1d22' : role === 'metal' ? '#8a8f99' : '#2e2e38';
  return (k.colors[key] = shade(base, f));
}

function drawKart(k) {
  const heading = k.angle + k.spinA;
  const fwx = Math.cos(heading), fwy = Math.sin(heading), rtx = -fwy, rty = fwx;
  const hop = k.hopT > 0 ? Math.sin(Math.PI * k.hopT / 0.22) * 3 : 0;
  const toW = (lx, ly, lz) => proj(k.x + rtx * lx + fwx * ly, k.y + rty * lx + fwy * ly, lz + hop);
  // shadow
  const sh = [toW(-7.5, -9, -hop), toW(7.5, -9, -hop), toW(7.5, 11, -hop), toW(-7.5, 11, -hop)];
  if (sh.some(p => !p)) return;
  ctx.fillStyle = 'rgba(0,0,0,.28)'; ctx.beginPath(); sh.forEach((p, i) => i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y)); ctx.fill();
  const camZ = cam.h;
  const boxes = KART_BOXES.map(bx => {
    const [x0, y0, z0, x1, y1, z1] = bx.b;
    const cx = (x0 + x1) / 2, cy = (y0 + y1) / 2;
    const wx = k.x + rtx * cx + fwx * cy, wy = k.y + rty * cx + fwy * cy;
    return { bx, wx, wy, depth: (wx - cam.x) * cam.fx + (wy - cam.y) * cam.fy };
  }).sort((a, b) => b.depth - a.depth);
  const lw = Math.max(1, sh[0].s * 0.12);
  ctx.lineJoin = 'round'; ctx.lineWidth = lw; ctx.strokeStyle = 'rgba(20,10,30,.55)';
  for (const { bx } of boxes) {
    const [x0, y0, z0, x1, y1, z1] = bx.b;
    const P = [];
    for (let i = 0; i < 8; i++) P.push(toW(i & 1 ? x1 : x0, i & 2 ? y1 : y0, i & 4 ? z1 : z0));
    if (P.some(p => !p)) continue;
    for (const fd of FACE_DEF) {
      const [nx, ny, nz] = fd.n;
      const wnx = rtx * nx + fwx * ny, wny = rty * nx + fwy * ny;
      // face center in world
      const lx = nx ? (nx > 0 ? x1 : x0) : (x0 + x1) / 2, ly = ny ? (ny > 0 ? y1 : y0) : (y0 + y1) / 2, lz = nz ? z1 : (z0 + z1) / 2;
      const fcx = k.x + rtx * lx + fwx * ly, fcy = k.y + rty * lx + fwy * ly;
      const dot = wnx * (fcx - cam.x) + wny * (fcy - cam.y) + nz * (lz + hop - camZ);
      if (dot >= 0) continue;
      ctx.fillStyle = kartColor(k, bx.c, fd.f);
      ctx.beginPath(); fd.c.forEach((ci, i) => i ? ctx.lineTo(P[ci].x, P[ci].y) : ctx.moveTo(P[ci].x, P[ci].y)); ctx.closePath();
      ctx.fill(); ctx.stroke();
    }
  }
  // driver head (emoji)
  const hp = toW(0, -1.8, 11);
  if (hp) {
    ctx.font = `${Math.round(hp.s * 8)}px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(k.ch.emoji, hp.x, hp.y);
  }
  // name tag for CPU racers close by
  if (!k.isPlayer && hp && hp.depth < 260) {
    ctx.font = `800 ${Math.round(Math.max(10 * DPR, hp.s * 3.2))}px ${hudFont}`;
    ctx.fillStyle = 'rgba(0,0,0,.45)';
    const ty = hp.y - hp.s * 6.5;
    ctx.fillText(k.ch.name, hp.x + 1, ty + 1); ctx.fillStyle = '#fff'; ctx.fillText(k.ch.name, hp.x, ty);
  }
}

function drawTree(tr, p) {
  const s = p.s * tr.s;
  if (tr.kind === 'round') {
    ctx.fillStyle = '#6b4226'; ctx.fillRect(p.x - 2.2 * s, p.y - 16 * s, 4.4 * s, 16 * s);
    ctx.fillStyle = '#2f8f3a'; ctx.beginPath(); ctx.arc(p.x, p.y - 24 * s, 12 * s, 0, TAU); ctx.fill();
    ctx.fillStyle = '#4fb458'; ctx.beginPath(); ctx.arc(p.x - 3.5 * s, p.y - 27 * s, 6.5 * s, 0, TAU); ctx.fill();
  } else if (tr.kind === 'pine') {
    ctx.fillStyle = '#5b3a24'; ctx.fillRect(p.x - 2 * s, p.y - 8 * s, 4 * s, 8 * s);
    for (let i = 0; i < 3; i++) {
      const y0 = p.y - (6 + i * 10) * s, w = (13 - i * 3.5) * s;
      ctx.fillStyle = '#2d6a4f'; ctx.beginPath(); ctx.moveTo(p.x - w, y0); ctx.lineTo(p.x + w, y0); ctx.lineTo(p.x, y0 - 15 * s); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.moveTo(p.x - w * 0.45, y0 - 8 * s); ctx.lineTo(p.x + w * 0.45, y0 - 8 * s); ctx.lineTo(p.x, y0 - 15 * s); ctx.fill();
    }
  } else {
    ctx.fillStyle = '#3c8d40';
    const rr = (x, y, w, h) => { ctx.beginPath(); ctx.roundRect ? ctx.roundRect(x, y, w, h, w / 2) : ctx.rect(x, y, w, h); ctx.fill(); };
    rr(p.x - 3.5 * s, p.y - 26 * s, 7 * s, 26 * s);
    rr(p.x - 10 * s, p.y - 20 * s, 5 * s, 11 * s); rr(p.x - 10 * s, p.y - 11 * s, 9 * s, 4 * s);
    rr(p.x + 5 * s, p.y - 24 * s, 5 * s, 12 * s); rr(p.x + 1 * s, p.y - 14 * s, 9 * s, 4 * s);
  }
}

function drawSprites() {
  const list = [];
  const maxD = 1500;
  const inView = p => p && p.depth < maxD && p.x > -150 * K && p.x < W + 150 * K;
  for (const tr of course.trees) { const p = proj(tr.x, tr.y, 0); if (inView(p)) list.push({ d: p.depth, f: () => drawTree(tr, p) }); }
  for (const b of course.boxes) {
    if (b.t > 0) continue;
    const p = proj(b.x, b.y, 7 + Math.sin(raceTime * 3 + b.x) * 1.2);
    if (!inView(p)) continue;
    list.push({ d: p.depth, f: () => {
      const s = 5.5 * p.s;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(Math.sin(raceTime * 2 + b.y) * 0.25);
      ctx.fillStyle = `hsla(${(raceTime * 120 + b.x) % 360},90%,60%,.85)`;
      ctx.fillRect(-s, -s, s * 2, s * 2);
      ctx.lineWidth = Math.max(1, s * 0.18); ctx.strokeStyle = '#fff'; ctx.strokeRect(-s, -s, s * 2, s * 2);
      ctx.fillStyle = '#fff'; ctx.font = `800 ${Math.round(s * 1.5)}px sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('?', 0, s * 0.08); ctx.restore();
    } });
  }
  for (const e of entities) {
    const p = proj(e.x, e.y, e.type === 'rocket' ? 5 : 3);
    if (!inView(p)) continue;
    list.push({ d: p.depth, f: () => {
      ctx.font = `${Math.round(p.s * (e.type === 'rocket' ? 10 : 9))}px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(ITEMS[e.type].emoji, p.x, p.y);
    } });
  }
  for (const k of karts) {
    const p = proj(k.x, k.y, 0);
    if (!p || p.depth > maxD || p.depth < 8) continue;
    list.push({ d: p.depth, f: () => drawKart(k) });
  }
  for (const pt of particles) {
    const p = proj(pt.x, pt.y, pt.z);
    if (!p || p.depth > 600) continue;
    list.push({ d: p.depth, f: () => {
      ctx.globalAlpha = clamp(pt.life / pt.max, 0, 1); ctx.fillStyle = pt.color;
      ctx.beginPath(); ctx.arc(p.x, p.y, Math.max(1, pt.size * p.s * 0.5), 0, TAU); ctx.fill(); ctx.globalAlpha = 1;
    } });
  }
  list.sort((a, b) => b.d - a.d);
  for (const it of list) it.f();
}

let hudFont = '';
function drawHUD() {
  const u = Math.min(W, H) / 400; // ui unit
  ctx.textBaseline = 'middle';
  const outlined = (text, x, y, size, color, align = 'left', weight = 800) => {
    ctx.font = `${weight} ${Math.round(size)}px ${hudFont}`; ctx.textAlign = align;
    ctx.lineWidth = size * 0.16; ctx.strokeStyle = '#1a1030'; ctx.lineJoin = 'round';
    ctx.strokeText(text, x, y); ctx.fillStyle = color; ctx.fillText(text, x, y);
  };
  const pad = 14 * u;
  // item slot
  const bs = 46 * u, bx = pad, by = pad;
  ctx.fillStyle = 'rgba(0,0,0,.45)'; ctx.strokeStyle = '#fff'; ctx.lineWidth = 3 * u;
  ctx.beginPath(); ctx.roundRect ? ctx.roundRect(bx, by, bs, bs, 10 * u) : ctx.rect(bx, by, bs, bs); ctx.fill(); ctx.stroke();
  let em = null;
  if (player.rollT > 0) em = ITEMS[ITEM_KEYS[Math.floor(raceTime * 14) % ITEM_KEYS.length]].emoji;
  else if (player.item) em = ITEMS[player.item].emoji;
  if (em) {
    ctx.font = `${Math.round(bs * 0.62)}px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif`;
    ctx.textAlign = 'center'; ctx.fillText(em, bx + bs / 2, by + bs / 2 + 2 * u);
  }
  // lap + time (right)
  const lap = clamp(Math.floor(player.total / course.L) + 1, 1, LAPS);
  outlined(`LAP ${lap}/${LAPS}`, W - pad, pad + 12 * u, 22 * u, '#fff', 'right');
  outlined(fmtTime(player.finished ? player.finishTime : raceTime), W - pad, pad + 36 * u, 16 * u, '#ffd23f', 'right', 500);
  // rank (bottom left / above touch buttons)
  const rk = player.rank + 1;
  const rankY = isTouch ? H - 130 * DPR : H - pad - 28 * u;
  outlined(`${rk}`, pad, rankY, 54 * u, rk === 1 ? '#ffd23f' : rk <= 3 ? '#ffffff' : '#c9c3ff');
  ctx.font = `800 ${Math.round(54 * u)}px ${hudFont}`;
  const rw = ctx.measureText(`${rk}`).width;
  outlined('位', pad + rw + 4 * u, rankY + 8 * u, 22 * u, '#fff');
  // speed
  outlined(`${Math.round(Math.abs(player.speed) * 0.42)} km/h`, pad, rankY - 40 * u, 13 * u, '#fff', 'left', 500);
  // drift charge indicator
  if (player.drifting) {
    const c = player.driftCharge >= 1.5 ? '#ff9f1c' : player.driftCharge >= 0.75 ? '#4cc9ff' : '#ffffff';
    outlined('DRIFT', W / 2, H * 0.9, 14 * u, c, 'center');
  }
  // minimap
  drawMinimap(u, pad);
  // wrong way
  if (player.wrongT > 1 && Math.floor(raceTime * 3) % 2 === 0) outlined('ぎゃくそう！', W / 2, H * 0.3, 30 * u, '#ff5d73', 'center');
  // countdown
  if (state === 'countdown') {
    const n = Math.ceil(countdown);
    if (n <= 3) {
      const f = countdown - Math.floor(countdown);
      outlined(`${n}`, W / 2, H * 0.32, (60 + f * 40) * u, ['#3ddc97', '#ffd23f', '#ff9f1c', '#ff5d73'][n] || '#fff', 'center');
    }
  }
  // messages
  let my = H * 0.24;
  for (const m of messages) {
    const a = clamp(m.t / 0.3, 0, 1), grow = 1 + Math.max(0, (m.t - m.max + 0.2)) * 2;
    ctx.globalAlpha = a; outlined(m.text, W / 2, my, 34 * u * grow, m.color, 'center'); ctx.globalAlpha = 1;
    my += 46 * u;
  }
}

function drawMinimap(u, pad) {
  const { bounds, pts } = course;
  const size = 96 * u;
  const sc = size / Math.max(bounds.maxX - bounds.minX, bounds.maxY - bounds.minY);
  const ox = W - pad - size, oy = pad + 56 * u;
  const tx = x => ox + (x - bounds.minX) * sc, ty = y => oy + (y - bounds.minY) * sc;
  ctx.lineJoin = 'round';
  ctx.beginPath(); for (let i = 0; i < pts.length; i += 3) { const p = pts[i]; i ? ctx.lineTo(tx(p.x), ty(p.y)) : ctx.moveTo(tx(p.x), ty(p.y)); } ctx.closePath();
  ctx.strokeStyle = 'rgba(0,0,0,.5)'; ctx.lineWidth = 7 * u; ctx.stroke();
  ctx.strokeStyle = 'rgba(255,255,255,.85)'; ctx.lineWidth = 3.5 * u; ctx.stroke();
  for (const k of [...karts].sort((a, b) => a.isPlayer - b.isPlayer)) {
    ctx.fillStyle = k.ch.color; ctx.strokeStyle = k.isPlayer ? '#fff' : '#000'; ctx.lineWidth = (k.isPlayer ? 2 : 1) * u;
    ctx.beginPath(); ctx.arc(tx(k.x), ty(k.y), (k.isPlayer ? 4.5 : 3) * u, 0, TAU); ctx.fill(); ctx.stroke();
  }
}

function render() {
  if (!course) {
    // title backdrop
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#1b1446'); g.addColorStop(1, '#3a1c5c'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    return;
  }
  drawSky();
  drawGround();
  drawSprites();
  if (state !== 'title' && state !== 'select') drawHUD();
}

// ===================== menus =====================
const screens = ['scrTitle', 'scrSelect', 'scrPause', 'scrResult'];
function showScreen(id) { for (const s of screens) document.getElementById(s).classList.toggle('hidden', s !== id); }

function buildSelect() {
  const cg = document.getElementById('charGrid'); cg.innerHTML = '';
  CHARS.forEach((c, i) => {
    const d = document.createElement('div'); d.className = 'card' + (i === selChar ? ' sel' : '');
    d.innerHTML = `<div class="emo">${c.emoji}</div><div class="nm">${c.name}</div><div class="swatch" style="background:${c.color}"></div>`;
    d.onclick = () => { selChar = i; Sound.init(); Sound.beep(700 + i * 60, 0.08, 'triangle', 0.1); buildSelect(); };
    cg.appendChild(d);
  });
  const c = CHARS[selChar];
  const bar = (label, v) => `<div class="stat"><span>${label}</span><div class="bar"><i style="width:${Math.round(clamp(v, 0.05, 1) * 100)}%"></i></div></div>`;
  document.getElementById('charStats').innerHTML =
    `<b>${c.emoji} ${c.name}</b>` + bar('スピード', (c.max - 280) / 38) + bar('かそく', (c.acc - 0.6) / 0.52) + bar('ハンドル', (c.hand - 1.95) / 0.75);
  const og = document.getElementById('courseGrid'); og.innerHTML = '';
  COURSES.forEach((co, i) => {
    const best = store.get('best' + i);
    const d = document.createElement('div'); d.className = 'card course' + (i === selCourse ? ' sel' : '');
    d.innerHTML = `<div class="emo">${co.emoji}</div><div class="nm">${co.name}</div><div class="ds">${co.desc}</div><div class="best">${best ? 'ベスト ' + fmtTime(best) : ''}</div>`;
    d.onclick = () => { selCourse = i; Sound.init(); Sound.beep(500 + i * 120, 0.08, 'triangle', 0.1); buildSelect(); };
    og.appendChild(d);
  });
}

function showResults() {
  state = 'result'; messages = [];
  Sound.engine(0, false);
  updateRanks();
  // estimate times for racers still on track
  const avgSpeed = 270;
  const rows = [...karts].map(k => ({ k, time: k.finished ? k.finishTime : raceTime + Math.max(0, LAPS * course.L - k.total) / avgSpeed }))
    .sort((a, b) => a.time - b.time);
  const pos = rows.findIndex(r => r.k.isPlayer) + 1;
  document.getElementById('resRank').textContent = pos === 1 ? '🏆 1位！' : pos <= 3 ? `🎉 ${pos}位` : `${pos}位`;
  const key = 'best' + selCourse, best = store.get(key);
  let bestMsg = '';
  if (!best || player.finishTime < best) { store.set(key, player.finishTime); bestMsg = best ? '🌟 ベストタイム更新！' : ''; }
  document.getElementById('resBest').textContent = bestMsg;
  document.getElementById('resTable').innerHTML = rows.map((r, i) =>
    `<tr class="${r.k.isPlayer ? 'me' : ''}"><td class="rk">${i + 1}</td><td>${r.k.ch.emoji} ${r.k.ch.name}${r.k.isPlayer ? '（あなた）' : ''}</td><td class="tm">${fmtTime(r.time)}</td></tr>`).join('');
  showScreen('scrResult');
  document.getElementById('touch').classList.add('hidden');
  document.getElementById('topbtns').classList.add('hidden');
}

function togglePause() {
  if (state === 'race' || state === 'countdown' || state === 'done') {
    pausedFrom = state; state = 'paused'; Sound.engine(0, false); showScreen('scrPause');
  } else if (state === 'paused') {
    state = pausedFrom; showScreen(null); lastT = performance.now();
  }
}

function toMenu() {
  state = 'select'; Sound.engine(0, false); buildSelect(); showScreen('scrSelect');
  document.getElementById('touch').classList.add('hidden');
  document.getElementById('topbtns').classList.add('hidden');
}

document.getElementById('btnStart').onclick = () => { Sound.init(); toMenu(); };
document.getElementById('btnBack').onclick = () => { state = 'title'; showScreen('scrTitle'); };
document.getElementById('btnGo').onclick = startRace;
document.getElementById('btnRetry').onclick = startRace;
document.getElementById('btnRetry2').onclick = startRace;
document.getElementById('btnMenu').onclick = toMenu;
document.getElementById('btnQuit').onclick = toMenu;
document.getElementById('btnResume').onclick = togglePause;
document.getElementById('btnPause').onclick = togglePause;
const muteBtn = document.getElementById('btnMute');
const syncMute = () => { muteBtn.textContent = Sound.muted ? '🔇' : '🔊'; };
muteBtn.onclick = () => { Sound.init(); Sound.setMuted(!Sound.muted); syncMute(); };
syncMute();

// ===================== loop =====================
let lastT = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - lastT) / 1000);
  lastT = now;
  if (!hudFont) hudFont = getComputedStyle(document.body).fontFamily;
  if (state !== 'paused') update(dt);
  render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
